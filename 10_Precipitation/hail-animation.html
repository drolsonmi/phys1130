  const h = html => { const tp = document.createElement('template'); tp.innerHTML = html; return tp.content; };

<script>window.HAIL = {
  svg(n, r, grow) {
    grow = grow == null ? 1 : grow;
    var s = '', core = r * 0.22, step = (r - core) / Math.max(1, n);
    for (var i = n; i >= 1; i--) {
      var rr = core + step * i;
      s += '<circle class="' + (i % 2 ? 'ice-opaque' : 'ice-clear') + '" r="' + rr.toFixed(1) + '"/>';
      s += '<circle class="ice-edge" style="stroke-width:2;opacity:.55" r="' + rr.toFixed(1) + '"/>';
    }
    s += '<circle class="seed" r="' + core.toFixed(1) + '"/>';
    return s;
  }
};</script>

<script>
(function () {
  const ORDER = [["title", "How hail forms"], ["embryo", "The embryo"], ["cycle", "Up and down"], ["heavy", "Too heavy to lift"], ["hard", "Hail or graupel"], ["slice", "Slice it open"], ["end", "Hail"]];
  const defs = window.__defs, scaler = document.getElementById('scaler'), frame = document.getElementById('frame'), view = document.getElementById('view');
  const scenes = ORDER.map(([id, name]) => {
    const el = document.createElement('div'); el.className = 'stage'; scaler.appendChild(el);
    window.kit.stage = el; const def = defs[id]; def.init.call(def, window.kit);
    return { id, name, el, def };
  });
  const dots = document.getElementById('dots');
  scenes.forEach(() => dots.appendChild(document.createElement('i')));
  let cur = 0, start = performance.now();
  const P = 6.5, A = 0.5, g = x => x - A * Math.sin(2 * Math.PI * x) / (2 * Math.PI);
  const inv = v => { let a = 0, b = 1; for (let i = 0; i < 40; i++) { const m = (a + b) / 2; if (g(m) < v) a = m; else b = m; } return (a + b) / 2; };
  const XF = inv(0.375);
  function go(i) {
    i = Math.max(0, Math.min(scenes.length - 1, i));
    if (scenes[cur].id === 'cycle' && scenes[i].id === 'heavy') {
      const tc = (performance.now() - start) / 1000, s = (tc - 1) / P, u = s - Math.floor(s);
      window.HV_ENTRY = tc < 1 ? { skip: 0, wait: 0, u0: 0 } : (u < XF ? { skip: u * P, wait: 0, u0: 0 } : { skip: 0, wait: (1 - u) * P, u0: u });
    } else window.HV_ENTRY = { skip: 0, wait: 0, u0: 0 };
    scenes[cur].el.classList.remove('on'); cur = i; scenes[cur].el.classList.add('on'); start = performance.now();
    document.getElementById('where').innerHTML = '<b>' + scenes[cur].name + '</b>&nbsp;&nbsp;' + (cur + 1) + ' of ' + scenes.length;
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === cur));
    document.getElementById('back').disabled = cur === 0;
    const nx = document.getElementById('next'); nx.disabled = cur === scenes.length - 1;
  }
  function fit() {
    const w = view.clientWidth - 32, hh = view.clientHeight - 32, s = Math.min(w / 1920, hh / 1080);
    frame.style.width = 1920 * s + 'px'; frame.style.height = 1080 * s + 'px'; scaler.style.transform = 'scale(' + s + ')';
  }
  function tick(now) { const sc = scenes[cur]; try { sc.def.render.call(sc.def, (now - start) / 1000); } catch (e) { console.error(e); } requestAnimationFrame(tick); }
  document.getElementById('next').onclick = () => go(cur + 1);
  document.getElementById('back').onclick = () => { window.HV_ENTRY = null; go(cur - 1); };
  document.getElementById('replay').onclick = () => go(cur);
  document.getElementById('full').onclick = () => { const d = document; if (d.fullscreenElement) d.exitFullscreen && d.exitFullscreen(); else d.documentElement.requestFullscreen && d.documentElement.requestFullscreen().catch(() => {}); };
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'r' || e.key === 'R') go(cur);
    else if (e.key === 'f' || e.key === 'F') document.getElementById('full').click();
  });
  addEventListener('resize', fit); fit(); go(0); requestAnimationFrame(tick);
})();
</script>
