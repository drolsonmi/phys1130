/* Page around the animation follows light/dark mode; the animation keeps its own dark palette. */
:root {
  --bg: #e9eef6;
  --fg: #0e1a2e;
  --muted: #4a5a72;
  --line: #b9c6d9;
  --btn: #ffffff;
  --btn-hover: #f1f5fb;
  --accent: #1d5fd0;
  --on-accent: #ffffff;
  --panel: #ffffff;
  --overlay: rgba(255, 255, 255, 0.97);
  --focus: #1d5fd0;
  --stage: #0e182a;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1322;
    --fg: #edf2fa;
    --muted: #9eb0c9;
    --line: #2a3b58;
    --btn: #16243b;
    --btn-hover: #1f3352;
    --accent: #61a0ff;
    --on-accent: #07101f;
    --panel: #111d31;
    --overlay: rgba(11, 19, 34, 0.96);
    --focus: #8fbcff;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--font);
  overflow: hidden;
}
#app {
  height: 100%; height: 100dvh;
  display: flex; flex-direction: column; align-items: stretch; gap: 12px;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#stageArea { flex: 1 1 auto; min-height: 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; position: relative; }
#stageBox { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
#stage { display: block; background: var(--stage); border-radius: 6px; touch-action: pan-y; max-width: 100%; }

/* scene text */
.sr-only {
  position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important;
  overflow: hidden !important; clip: rect(0 0 0 0) !important; clip-path: inset(50%) !important; white-space: nowrap !important; border: 0 !important;
}
#scene-text {
  width: min(100%, 1100px); max-height: 30vh; overflow-y: auto; flex: 0 0 auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px;
}
#scene-text:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
#scene-text h2 { font-size: 17px; line-height: 1.3; margin: 0 0 6px; text-wrap: balance; }
#scene-text p, #scene-text li { font-size: 15px; line-height: 1.55; margin: 0 0 8px; max-width: 70ch; }
#scene-text ul { margin: 0 0 8px; padding-left: 20px; }
#scene-text p:last-child { margin-bottom: 0; }
.st-head { display: flex; justify-content: flex-end; }
#closeText { display: none; }
#turnHint { display: none; margin: 0; color: var(--muted); font-size: 14px; text-align: center; }

/* controls */
#controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; flex: 0 0 auto; }
button {
  font: 700 15px/1 var(--font); color: var(--fg); background: var(--btn);
  border: 1px solid var(--line); border-radius: 8px; padding: 11px 18px; cursor: pointer;
  min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  -webkit-tap-highlight-color: transparent;
}
button:hover { background: var(--btn-hover); }
button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }
#next { background: var(--accent); color: var(--on-accent); border-color: var(--accent); padding-inline: 26px; }
#next:hover:not(:disabled) { filter: brightness(1.08); }
.ic { width: 22px; height: 22px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.minor .ic { display: none; }
#prev .ic, #next .ic { display: none; }
#textBtn[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.dots { display: flex; gap: 6px; }
.dot { width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 13px; color: var(--muted); }
.dot[aria-current="step"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }
#counter { display: none; font: 700 13px/1.2 var(--font); color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.spacer { display: none; }
.hint { margin: 0; color: var(--muted); font-size: 13px; text-align: center; flex: 0 0 auto; }
kbd { font: inherit; }

.skip {
  position: absolute; left: 12px; top: 12px; z-index: 50; padding: 12px 16px; border-radius: 8px;
  background: var(--accent); color: var(--on-accent); font-weight: 700; text-decoration: none;
  transform: translateY(-200%);
}
.skip:focus, .skip:focus-visible { transform: none; }
[hidden] { display: none !important; }

/* ---------- phone held sideways ---------- */
html.land #app { flex-direction: row; gap: 8px;
  padding-top: max(6px, env(safe-area-inset-top, 0px)); padding-bottom: max(6px, env(safe-area-inset-bottom, 0px));
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: 0; }
html.land #stageArea { gap: 0; }
html.land #stage { border-radius: 4px; }
html.land .hint { display: none; }
html.land #controls {
  flex-direction: column; flex-wrap: nowrap; justify-content: flex-start; align-items: stretch; gap: 6px;
  width: calc(84px + max(8px, env(safe-area-inset-right, 0px))); height: 100%;
  padding-right: max(8px, env(safe-area-inset-right, 0px)); overflow-y: auto;
}
html.land .dots { display: none; }
html.land #counter { display: block; padding: 4px 0 2px; }
html.land .spacer { display: block; flex: 1 1 auto; min-height: 4px; }
html.land .minor { padding: 0; min-height: 44px; }
html.land .minor .ic { display: block; }
html.land .minor .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
html.land #prev, html.land #next { flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 14px; }
html.land #prev .ic, html.land #next .ic { display: block; }
html.land #prev { min-height: 52px; }
html.land #next { min-height: 72px; }
html.land #prev .arr, html.land #next .arr { display: none; }
html.land #scene-text {
  position: absolute; inset: 6px; width: auto; max-height: none; z-index: 5;
  background: var(--overlay); padding: 10px 16px 14px; box-shadow: 0 6px 30px rgba(0,0,0,.35);
}
html.land #closeText { display: inline-flex; padding: 8px 16px; }
html.land .st-head { position: sticky; top: -10px; margin: -10px -16px 4px; padding: 6px 8px 0; background: var(--overlay); }

/* ---------- phone held upright ---------- */
html.port #app { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); gap: 8px;
  padding-top: max(4px, env(safe-area-inset-top, 0px)); padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
html.port #stageArea { gap: 8px; }
html.port #stageBox { flex: 0 0 auto; }
html.port #stage { border-radius: 0; }
html.port #turnHint { display: block; padding: 0 16px; }
html.port #scene-text { flex: 1 1 auto; min-height: 0; max-height: none; width: auto; margin: 0 16px; align-self: stretch; }
html.port .st-head { display: none; }
html.port .hint, html.port .dots, html.port #fs, html.port #textBtn { display: none; }
html.port #controls { flex-wrap: nowrap; justify-content: space-between; padding: 0 16px; gap: 8px; }
html.port .minor { padding: 0; width: 48px; min-height: 52px; }
html.port .minor .ic { display: block; }
html.port .minor .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
html.port #prev, html.port #next { flex: 1 1 0; min-height: 52px; font-size: 17px; }

@media (prefers-reduced-motion: reduce) { .skip { transition: none; } }
</style>
</head>
<body>
<a class="skip" href="#scene-text" id="skip">Skip to scene text</a>
<div id="app">
  <div id="stageArea">
    <div id="stageBox"><canvas id="stage" width="1920" height="1080" aria-hidden="true"></canvas></div>
    <p id="turnHint">Turn your phone sideways for a bigger picture.</p>
    <section id="scene-text" tabindex="-1" aria-label="Scene description" class="sr-only">
      <div class="st-head"><button id="closeText" type="button">Close</button></div>
      <div id="st-live" aria-live="polite" aria-atomic="true"></div>
    </section>
  </div>
  <nav id="controls" aria-label="Animation controls">
    <span id="counter" aria-hidden="true">1 of 6</span>
    <button id="prev" type="button" aria-label="Back: previous scene">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span><span class="arr">&larr; </span>Back</span></button>
    <div class="dots" id="dots"></div>
    <button id="next" type="button" aria-label="Next scene">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg><span>Next<span class="arr"> &rarr;</span></span></button>
    <button id="replay" class="minor" type="button" aria-label="Restart scene" title="Restart this scene (R)">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg><span class="lbl">Restart scene</span></button>
    <button id="pause" class="minor" type="button" aria-label="Pause" title="Pause or play (P)">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><g class="ic-pause"><path d="M8 5v14M16 5v14"/></g><g class="ic-play" style="display:none"><path d="M7 5l12 7-12 7z"/></g></svg><span class="lbl">Pause</span></button>
    <button id="fs" class="minor" type="button" aria-label="Full screen" title="Full screen (F)">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lbl">Fullscreen</span></button>
    <button id="textBtn" class="minor" type="button" aria-label="Text: show scene description" aria-pressed="false" aria-controls="scene-text" title="Show the scene description (T)">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 10h14M5 14h10M5 18h8"/></svg><span class="lbl">Text</span></button>
    <span class="spacer" aria-hidden="true"></span>
  </nav>
  <p class="hint">Keys: &rarr; or Space = Next &nbsp;·&nbsp; &larr; = Back &nbsp;·&nbsp; Home / End = First / Last &nbsp;·&nbsp; R = Restart scene &nbsp;·&nbsp; P = Pause &nbsp;·&nbsp; T = Text &nbsp;·&nbsp; F = Fullscreen</p>
</div>

<script>
(() => {
"use strict";
let W = 1920, H = 1080;
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
const FONT = '"Inter", system-ui, sans-serif';

const BG = [0.055, 0.094, 0.165], PANEL = [0.075, 0.13, 0.22];
const TXT = [0.93, 0.95, 0.98], MUTED = [0.62, 0.69, 0.79];
const WARM = [0.96, 0.42, 0.30], COLD = [0.38, 0.62, 1.00];
const DROP = [0.30, 0.62, 1.00], ICE = [0.86, 0.94, 1.00], GROUND = [0.24, 0.22, 0.20];
const ZTOP = 3.0;

const SC = [
  { name: "Snow", sub: "The entire column is below freezing", color: [0.92, 0.96, 1.0],
    prof: [[-12, 3.0], [-9, 2.2], [-6.5, 1.2], [-3, 0.0]], kind: "snow",
    caps: [[0.8, "Entire layer from cloud to ground is colder than 0°C (32°F)."],
           [4.5, "Snowflakes never melt, so they reach the ground as snow."]],
    result: "SNOW", summary: "Entire column below 0°C. Flakes never melt." },
  { name: "Sleet", sub: "Warm layer aloft, deep cold layer at the surface", color: [0.75, 0.88, 1.0],
    prof: [[-11, 3.0], [-3, 2.75], [0, 2.5], [3.2, 2.05], [0, 1.6], [-6, 0.7], [-4, 0.0]], kind: "sleet",
    caps: [[0.8, "A warm layer aloft (above 0°C) melts the falling snowflakes into raindrops."],
           [4.0, "A DEEP below-freezing layer near the ground gives the drops time to refreeze."],
           [7.3, "They land as ice pellets (sleet) that bounce when they hit the ground."]],
    result: "SLEET", summary: "Warm layer aloft melts snow; a deep cold layer refreezes drops into ice pellets." },
  { name: "Freezing Rain", sub: "Warm layer lower down, shallow cold layer at the surface", color: [0.45, 0.90, 0.95],
    prof: [[-11, 3.0], [-6, 2.4], [0, 1.8], [4.2, 1.1], [0, 0.4], [-2.5, 0.0]], kind: "frz",
    caps: [[0.8, "Snow melts completely in a deep warm layer closer to the ground."],
           [4.0, "The cold layer at the surface is too SHALLOW to refreeze them: drops become supercooled."],
           [7.3, "Supercooled drops freeze on contact, coating the ground.\nTrees, power lines, and roads become encased in ice."]],
    result: "FREEZING RAIN", summary: "Shallow surface cold layer: drops stay liquid (supercooled) and freeze on impact." },
  { name: "Rain", sub: "Warm layer extends all the way to the surface", color: [0.40, 0.68, 1.0],
    prof: [[-11, 3.0], [-5, 2.4], [0, 1.8], [4, 1.0], [8, 0.0]], kind: "rain",
    caps: [[0.8, "Above-freezing air extends all the way down to the surface."],
           [4.5, "Snowflakes melt and stay liquid, reaching the ground as rain."]],
    result: "RAIN", summary: "Warm layer reaches the ground. Snow melts and stays as rain." },
];
const FACT = { snow: "Warm layer: none", sleet: "Surface cold layer: DEEP", frz: "Surface cold layer: SHALLOW", rain: "Surface cold layer: none" };

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };

function T_at(sc, z) {
  const p = sc.prof;
  for (let i = 0; i < p.length - 1; i++) {
    const [t1, z1] = p[i], [t2, z2] = p[i + 1];
    if (z2 <= z && z <= z1) return t1 + (t2 - t1) * (z1 - z) / (z1 - z2);
  }
  return p[p.length - 1][0];
}
function crossings(sc) {
  const p = sc.prof, out = [];
  for (let i = 0; i < p.length - 1; i++) {
    const [t1, z1] = p[i], [t2, z2] = p[i + 1];
    if (((t1 < 0 && 0 <= t2) || (t1 >= 0 && 0 > t2)) && t1 !== t2) out.push(z1 + (z2 - z1) * (0 - t1) / (t2 - t1));
  }
  return out;
}
for (const sc of SC) {
  const cr = crossings(sc);
  sc.cr = cr;
  if (sc.kind === "snow") { sc.zt = null; sc.zb = null; }
  else if (sc.kind === "rain") { sc.zt = cr[0]; sc.zb = 0; }
  else { sc.zt = cr[0]; sc.zb = cr[1]; }
}
function state(sc, z) {
  if (sc.zt === null) return [0, 0, false];
  const zt = sc.zt, zb = sc.zb;
  const m = clamp((zt - z) / (0.55 * (zt - zb)));
  let f = 0, sup = false;
  if (sc.kind === "sleet" && z < zb) f = clamp((zb - z) / 0.6);
  if (sc.kind === "frz" && z < zb) sup = true;
  return [m, f, sup];
}
const VS = 0.52, VR = 0.95, DT = 1 / 240;
for (const sc of SC) {
  const zs = [ZTOP + 0.05];
  let z = zs[0];
  while (z > 0) { const [m] = state(sc, z); z -= (VS + (VR - VS) * m) * DT; zs.push(z); }
  sc.traj = Float32Array.from(zs);
  sc.thit = (zs.length - 1) * DT;
}
function z_of(sc, tau) {
  const i = tau / DT, i0 = Math.floor(i), tr = sc.traj;
  if (i0 >= tr.length - 1) return 0;
  return tr[i0] + (tr[i0 + 1] - tr[i0]) * (i - i0);
}

// endless, deterministic particle stream
const SPAWN_DT = 0.055, SPAWN_T0 = -6;
function hash(i, k) { let x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); }
function particle(i) {
  return { spawn: SPAWN_T0 + i * SPAWN_DT + hash(i, 1) * 0.04, x: 0.03 + 0.94 * hash(i, 2),
    rot: hash(i, 3) * Math.PI, size: 0.8 + 0.4 * hash(i, 4), ph: hash(i, 5) * 2 * Math.PI, bx: hash(i, 6) * 2 - 1 };
}

// ---------- adaptive text size ----------
// COMP: "wide" (1920x1080, desktop and phone held sideways) or "tall" (1080x1350, phone held upright).
// BIG: the picture is drawn at under ~55% of full size, so small labels are enlarged to ~14 px on screen.
let COMP = "wide", BIG = false, SCALE = 1;
const F = (base, cap) => BIG ? Math.round(clamp(14 / SCALE, base, cap)) : base;

// ---------- layout record (used by the self-check; costs nothing otherwise) ----------
const REC = { on: false, items: [] };
function rec(kind, x0, y0, x1, y1, label) { if (REC.on) REC.items.push({ kind, x0, y0, x1, y1, label }); }

// ---------- drawing helpers ----------
const col = (c, a = 1) => `rgba(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)},${a})`;
function setFont(size, bold) { ctx.font = `${bold ? 700 : 400} ${size}px ${FONT}`; }
function text(s, x, y, size, color = TXT, bold = false, align = "left", alpha = 1) {
  setFont(size, bold);
  ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = col(color, alpha);
  ctx.fillText(s, x, y);
  const m = ctx.measureText(s);
  if (REC.on && alpha * ctx.globalAlpha > 0.05) {
    const t = ctx.getTransform();
    if (Math.abs(t.b) < 1e-6 && Math.abs(t.c) < 1e-6)
      rec("text", t.a * (x - m.actualBoundingBoxLeft) + t.e, t.d * (y - m.actualBoundingBoxAscent) + t.f,
                  t.a * (x + m.actualBoundingBoxRight) + t.e, t.d * (y + m.actualBoundingBoxDescent) + t.f, s);
  }
  return m.width;
}
function textW(s, size, bold) { setFont(size, bold); return ctx.measureText(s).width; }
function fitSize(s, size, bold, maxw, min) { let f = size; while (f > min && textW(s, f, bold) > maxw) f -= 1; return f; }
function wrap(s, maxw, size, bold = false) {
  setFont(size, bold);
  const lines = []; let cur = "";
  for (const w of s.split(/\s+/)) {
    const t = (cur + " " + w).trim();
    if (ctx.measureText(t).width > maxw && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  lines.push(cur);
  return lines;
}
// wrap, then narrow the measure as far as possible without adding a line (avoids one-word last lines)
function bwrap(s, maxw, size, bold = false) {
  const n = wrap(s, maxw, size, bold).length;
  if (n < 2) return [s];
  let lo = maxw * 0.5, hi = maxw;
  for (let k = 0; k < 14; k++) { const mid = (lo + hi) / 2; if (wrap(s, mid, size, bold).length > n) lo = mid; else hi = mid; }
  return wrap(s, hi, size, bold);
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
function flatEllipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), 0, 0, Math.PI * 2); }

function snowflake(x, y, r, rot, a) {
  if (a <= 0.01) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.lineCap = "round"; ctx.lineWidth = Math.max(1, r * 0.16); ctx.strokeStyle = col([1, 1, 1], a);
  ctx.beginPath();
  for (let k = 0; k < 6; k++) {
    const an = k * Math.PI / 3, c = Math.cos(an), s = Math.sin(an);
    const P = (px, py) => [px * c - py * s, px * s + py * c];
    const bx = r * 0.55, b = r * 0.32;
    let p;
    ctx.moveTo(0, 0); p = P(r, 0); ctx.lineTo(p[0], p[1]);
    p = P(bx, 0); ctx.moveTo(p[0], p[1]); p = P(bx + b * 0.6, b); ctx.lineTo(p[0], p[1]);
    p = P(bx, 0); ctx.moveTo(p[0], p[1]); p = P(bx + b * 0.6, -b); ctx.lineTo(p[0], p[1]);
  }
  ctx.stroke(); ctx.restore();
}
function drop(x, y, r, a, fill = DROP, outline = null, streak = true) {
  if (r <= 0.2 || a <= 0.01) return;
  if (streak) {
    const g = ctx.createLinearGradient(x, y - r * 5, x, y);
    g.addColorStop(0, col(fill, 0)); g.addColorStop(1, col(fill, 0.35 * a));
    ctx.strokeStyle = g; ctx.lineWidth = r * 0.9; ctx.lineCap = "butt";
    ctx.beginPath(); ctx.moveTo(x, y - r * 5); ctx.lineTo(x, y); ctx.stroke();
  }
  flatEllipse(x, y, r * 1.08, r * 0.94);  // real drops are slightly flattened spheres
  ctx.fillStyle = col(fill, a); ctx.fill();
  if (outline) { ctx.strokeStyle = col(outline, a); ctx.lineWidth = Math.max(1.2, r * 0.3); ctx.stroke(); }
  circle(x - r * 0.35, y - r * 0.35, r * 0.28); ctx.fillStyle = col([1, 1, 1], 0.55 * a); ctx.fill();
}
function pellet(x, y, r, f, a = 1) {
  const c = [0, 1, 2].map(i => DROP[i] + (ICE[i] - DROP[i]) * f);
  drop(x, y, r, a, c, f > 0.3 ? [1, 1, 1] : null, f < 0.99);
}

function zoneTint(sc, x0, y0, w, h) {
  const n = 300, runs = [];
  for (let i = 0; i < n; i++) {
    const warm = T_at(sc, ZTOP * (1 - (i + 0.5) / n)) > 0;
    if (runs.length && runs[runs.length - 1][0] === warm) runs[runs.length - 1][2] = i + 1;
    else runs.push([warm, i, i + 1]);
  }
  for (const [warm, a0, a1] of runs) {
    ctx.fillStyle = warm ? col(WARM, 0.20) : col(COLD, 0.09);
    const ya = y0 + h * a0 / n, yb = y0 + h * a1 / n;
    ctx.fillRect(x0, ya, w, yb - ya);
  }
}

function drawPowerline(x0, w, gy, s, glaze, poles) {
  const px1 = x0 + w * poles[0], px2 = x0 + w * poles[1], ph = 78 * s;
  rec("obstacle", px1 - 14 * s, gy - ph, px2 + 14 * s, gy, "power line");
  ctx.strokeStyle = col([0.45, 0.36, 0.28]); ctx.lineWidth = 5 * s; ctx.lineCap = "butt";
  for (const px of [px1, px2]) {
    ctx.beginPath(); ctx.moveTo(px, gy); ctx.lineTo(px, gy - ph);
    ctx.moveTo(px - 14 * s, gy - ph + 8 * s); ctx.lineTo(px + 14 * s, gy - ph + 8 * s); ctx.stroke();
  }
  const wy = t => gy - ph + 8 * s + 18 * s * Math.sin(Math.PI * t);
  const wire = () => { ctx.beginPath(); for (let i = 0; i <= 40; i++) { const t = i / 40, x = lerp(px1, px2, t); i ? ctx.lineTo(x, wy(t)) : ctx.moveTo(x, wy(t)); } ctx.stroke(); };
  const lw = 2.2 * s + glaze * 7 * s;
  if (glaze > 0) {
    ctx.strokeStyle = col([0.75, 0.95, 1.0], 0.9); ctx.lineWidth = lw; wire();
    ctx.fillStyle = col([0.80, 0.96, 1.0], 0.9);
    for (let k = 1; k < 12; k++) {
      const t = k / 12, x = lerp(px1, px2, t);
      const L = glaze * (10 + 9 * ((k * 37) % 5) / 4) * s, y = wy(t) + lw / 2 - 1;
      ctx.beginPath(); ctx.moveTo(x - 2.6 * s, y); ctx.lineTo(x + 2.6 * s, y); ctx.lineTo(x, y + L); ctx.closePath(); ctx.fill();
    }
  }
  ctx.strokeStyle = col([0.15, 0.15, 0.17]); ctx.lineWidth = 2.2 * s; wire();
}

function drawSnowman(x, gy, s, a) {
  // total height ~37.5*s, under half of the 78*s power poles
  if (a <= 0.01) return;
  rec("obstacle", x - 17 * s, gy - 37.5 * s, x + 17 * s, gy, "snowman");
  ctx.save(); ctx.globalAlpha *= a;
  const white = col([0.97, 0.98, 1.0]), edge = col([0.70, 0.78, 0.90]);
  for (const [cy, r] of [[-8, 8], [-20, 6], [-29, 4.5]]) {
    circle(x, gy + cy * s, r * s); ctx.fillStyle = white; ctx.fill();
    ctx.strokeStyle = edge; ctx.lineWidth = 1 * s; ctx.stroke();
  }
  ctx.strokeStyle = col([0.42, 0.30, 0.20]); ctx.lineWidth = 1.4 * s; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x - 5 * s, gy - 21 * s); ctx.lineTo(x - 14 * s, gy - 27 * s); ctx.lineTo(x - 16 * s, gy - 30 * s);
  ctx.moveTo(x - 14 * s, gy - 27 * s); ctx.lineTo(x - 17 * s, gy - 26 * s);
  ctx.moveTo(x + 5 * s, gy - 21 * s); ctx.lineTo(x + 14 * s, gy - 27 * s); ctx.lineTo(x + 16 * s, gy - 30 * s);
  ctx.moveTo(x + 14 * s, gy - 27 * s); ctx.lineTo(x + 17 * s, gy - 26 * s);
  ctx.stroke();
  ctx.fillStyle = col([0.10, 0.10, 0.12]);
  for (const [dx, dy, r] of [[-1.6, -30, 0.8], [1.6, -30, 0.8], [0, -22, 0.9], [0, -18.5, 0.9], [0, -11, 1], [0, -6.5, 1]]) {
    circle(x + dx * s, gy + dy * s, r * s); ctx.fill();
  }
  ctx.fillStyle = col([0.95, 0.55, 0.15]);
  ctx.beginPath(); ctx.moveTo(x, gy - 28.6 * s); ctx.lineTo(x + 5 * s, gy - 28 * s); ctx.lineTo(x, gy - 27.4 * s); ctx.closePath(); ctx.fill();
  ctx.fillStyle = col([0.85, 0.25, 0.25]);
  ctx.fillRect(x - 4.5 * s, gy - 25.5 * s, 9 * s, 1.8 * s);
  ctx.fillRect(x + 1.5 * s, gy - 25 * s, 1.8 * s, 5 * s);
  ctx.fillStyle = col([0.10, 0.10, 0.12]);
  ctx.fillRect(x - 5 * s, gy - 33 * s, 10 * s, 1.3 * s);
  ctx.fillRect(x - 3.2 * s, gy - 37.5 * s, 6.4 * s, 4.6 * s);
  ctx.restore();
}

// o: { s, labels, gh, zeroFs, poles }
function drawColumn(sc, t, x0, y0, w, h, o = {}) {
  const s = o.s ?? 1, labels = o.labels ?? true, gh = o.gh ?? 46, poles = o.poles ?? [0.70, 0.94];
  const gy = y0 + h, zy = z => y0 + (ZTOP - z) / ZTOP * h;
  const g = ctx.createLinearGradient(0, y0, 0, gy);
  g.addColorStop(0, col([0.09, 0.14, 0.24])); g.addColorStop(1, col([0.15, 0.22, 0.34]));
  ctx.fillStyle = g; ctx.fillRect(x0, y0, w, h);
  zoneTint(sc, x0, y0, w, h);

  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, w, h + gh); ctx.clip();
  ctx.fillStyle = col([0.55, 0.60, 0.68], 0.95);
  for (let i = 0; i <= 9; i++) { circle(x0 + w * i / 9, y0 + 4 * s, (34 + 14 * Math.sin(i * 1.7)) * s); ctx.fill(); }
  ctx.fillRect(x0, y0, w, 8 * s);
  ctx.restore();

  for (const zc of sc.cr) {
    const y = zy(zc);
    ctx.setLineDash([10 * s, 7 * s]); ctx.strokeStyle = col([1, 1, 1], 0.55); ctx.lineWidth = 1.6 * s;
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + w, y); ctx.stroke(); ctx.setLineDash([]);
    if (labels) {
      // drop the label below the line if it would touch the result badge above it
      const zf = o.zeroFs ?? 20, below = o.avoidY != null && y - 8 - zf < o.avoidY + 8;
      text("0°C", x0 + w - 10, below ? y + zf + 6 : y - 8, zf, TXT, true, "right", 0.85);
    }
  }

  const prog = clamp((t - sc.thit + 1.0) / 8.0);
  ctx.fillStyle = col(GROUND); ctx.fillRect(x0, gy, w, gh);
  ctx.fillStyle = col([0.33, 0.30, 0.26]); ctx.fillRect(x0, gy, w, 4 * s);

  const kind = sc.kind;
  if (kind === "snow") {
    const th = 16 * s * prog;
    if (th > 0.3) {
      ctx.fillStyle = col([0.95, 0.97, 1.0]); ctx.beginPath(); ctx.moveTo(x0, gy + 2);
      for (let i = 0; i <= 60; i++) ctx.lineTo(x0 + w * i / 60, gy - th * (1 + 0.25 * Math.sin(i * 1.3)));
      ctx.lineTo(x0 + w, gy + 2); ctx.closePath(); ctx.fill();
    }
  }
  if (kind === "frz") {
    const th = 9 * s * prog;
    if (th > 0.3) {
      ctx.fillStyle = col([0.62, 0.90, 0.98], 0.75); ctx.fillRect(x0, gy - th, w, th + 2);
      ctx.strokeStyle = col([1, 1, 1], 0.8); ctx.lineWidth = 1.5 * s;
      ctx.beginPath(); ctx.moveTo(x0, gy - th + 1); ctx.lineTo(x0 + w, gy - th + 1); ctx.stroke();
    }
  }
  if (kind === "rain") {
    ctx.fillStyle = col(DROP, 0.45);
    for (let k = 0; k < 7; k++) {
      const px = x0 + w * (0.08 + 0.13 * k + 0.03 * Math.sin(k * 3));
      const pw = (30 + 20 * ((k * 7) % 3)) * s * prog;
      if (pw > 1) { flatEllipse(px, gy + 8 * s, pw, pw * 0.18); ctx.fill(); }
    }
  }
  drawPowerline(x0, w, gy, s, kind === "frz" ? prog : 0, poles);
  if (kind === "snow") drawSnowman(x0 + w * 0.28, gy, s, ease((prog - 0.15) / 0.5));

  const thit = sc.thit;
  const life = thit + (kind === "sleet" ? 9 : 0.7);
  const iMin = Math.max(0, Math.floor((t - life - SPAWN_T0) / SPAWN_DT) - 1);
  const iMax = Math.floor((t - SPAWN_T0) / SPAWN_DT) + 1;
  for (let i = iMin; i <= iMax; i++) {
    const P = particle(i), tau = t - P.spawn;
    if (tau < 0) continue;
    let x = x0 + P.x * w; const sz = P.size * s;
    if (tau < thit) {
      const z = z_of(sc, tau);
      if (z > ZTOP) continue;
      const [m, f, sup] = state(sc, z), y = zy(z);
      x += (1 - m) * 7 * s * Math.sin(tau * 2.2 + P.ph);
      if (m < 1) snowflake(x, y, 9 * sz * (1 - 0.55 * m), P.rot + tau * 0.8, 1 - m);
      if (m > 0) {
        const r = 4.6 * sz * (0.45 + 0.55 * m);
        if (kind === "sleet" && f > 0) pellet(x, y, r * (1 - 0.1 * f), f, m);
        else if (sup) drop(x, y, r, m, DROP, [0.65, 0.97, 1.0]);
        else drop(x, y, r, m);
      }
    } else {
      const tl = tau - thit;
      if (kind === "snow") {
        if (tl < 0.6) snowflake(x, gy - 3 * s, 6 * sz, P.rot, 1 - tl / 0.6);
      } else if (kind === "sleet") {
        const r = 4.2 * sz, bt = 0.55;
        if (tl < bt) {
          const u = tl / bt;
          pellet(x + P.bx * 14 * s * u, gy - r - 30 * s * 4 * u * (1 - u), r, 1);
        } else if (tl < 9) {
          circle(x + P.bx * 14 * s, gy - r * 0.8, r * 0.85);
          ctx.fillStyle = col(ICE, 0.95); ctx.fill();
          ctx.strokeStyle = col([1, 1, 1]); ctx.lineWidth = 1; ctx.stroke();
        }
      } else if (kind === "frz") {
        if (tl < 0.6) {
          const u = tl / 0.6, c = [0, 1, 2].map(k => lerp(DROP[k], ICE[k], u));
          const rr = (4 + 9 * ease(u * 2)) * s;
          flatEllipse(x, gy - 2 * s, rr, rr * 0.3); ctx.fillStyle = col(c, 1 - 0.6 * u); ctx.fill();
          if (u > 0.4) {
            const a = 1 - (u - 0.4) / 0.6, L = 6 * s;
            ctx.strokeStyle = col([1, 1, 1], a); ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(x - L, gy - 6 * s); ctx.lineTo(x + L, gy - 6 * s);
            ctx.moveTo(x, gy - 6 * s - L); ctx.lineTo(x, gy - 6 * s + L); ctx.stroke();
          }
        }
      } else if (kind === "rain") {
        if (tl < 0.4) {
          const u = tl / 0.4, rr = (3 + 14 * u) * s;
          flatEllipse(x, gy, rr, rr * 0.3); ctx.strokeStyle = col(DROP, 0.8 * (1 - u)); ctx.lineWidth = 1.6; ctx.stroke();
          ctx.fillStyle = col(DROP, 1 - u);
          for (const d of [-1, 1]) { circle(x + d * 12 * s * u, gy - 16 * s * 4 * u * (1 - u), 1.8 * s); ctx.fill(); }
        }
      }
    }
  }
}

function profileSegments(sc, tx, zy, zstop, widths) {
  const n = 200;
  ctx.lineCap = "round";
  for (const [lw, colorFn] of widths) {
    ctx.lineWidth = lw;
    for (let i = 0; i < n; i++) {
      const z1 = ZTOP * (1 - i / n);
      let z2 = ZTOP * (1 - (i + 1) / n);
      if (z1 <= zstop) break;
      z2 = Math.max(z2, zstop);
      const T1 = T_at(sc, z1), T2 = T_at(sc, z2);
      ctx.strokeStyle = colorFn((T1 + T2) / 2);
      ctx.beginPath(); ctx.moveTo(tx(T1), zy(z1)); ctx.lineTo(tx(T2), zy(z2)); ctx.stroke();
    }
  }
}

// L: profile part of the scenario layout
function drawProfile(sc, x0, y0, w, h, drawFrac, L) {
  const TMIN = -14, TMAX = 10;
  const tx = T => x0 + (T - TMIN) / (TMAX - TMIN) * w, zy = z => y0 + (ZTOP - z) / ZTOP * h;
  ctx.fillStyle = col(PANEL); ctx.fillRect(x0, y0, w, h);
  zoneTint(sc, x0, y0, w, h);
  ctx.lineWidth = 1; ctx.strokeStyle = col([1, 1, 1], 0.07);
  ctx.beginPath();
  for (let T = -12; T <= 10; T += 4) { ctx.moveTo(tx(T), y0); ctx.lineTo(tx(T), y0 + h); }
  for (const z of [1, 2]) { ctx.moveTo(x0, zy(z)); ctx.lineTo(x0 + w, zy(z)); }
  ctx.stroke();
  ctx.setLineDash([10, 7]); ctx.strokeStyle = col([1, 1, 1], 0.7); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(tx(0), y0); ctx.lineTo(tx(0), y0 + h); ctx.stroke();
  ctx.strokeStyle = col([1, 1, 1], 0.35); ctx.lineWidth = 1.6;
  for (const zc of sc.cr) { ctx.beginPath(); ctx.moveTo(x0, zy(zc)); ctx.lineTo(x0 + w, zy(zc)); ctx.stroke(); }
  ctx.setLineDash([]);

  const zstop = ZTOP - drawFrac * ZTOP;
  profileSegments(sc, tx, zy, zstop, [[5, T => col(T > 0 ? WARM : COLD)]]);
  if (drawFrac < 1) { circle(tx(T_at(sc, zstop)), zy(zstop), 7); ctx.fillStyle = col([1, 1, 1]); ctx.fill(); }

  ctx.strokeStyle = col([1, 1, 1], 0.25); ctx.lineWidth = 1.5; ctx.strokeRect(x0, y0, w, h);
  for (let T = L.tickFrom; T <= 10; T += L.tickStep) text(`${T}`, tx(T), y0 + h + L.tickDy, L.tickFs, MUTED, false, "center");
  text("Temperature (°C)", x0 + w / 2, y0 + h + L.axisDy, L.axisFs, TXT, true, "center");
  for (let z = 0; z <= 3; z++) text(`${z}`, x0 - L.altTickDx, zy(z) + L.altTickFs * 0.35, L.altTickFs, MUTED, false, "right");
  ctx.save(); ctx.translate(x0 - L.altTitleDx, y0 + h / 2); ctx.rotate(-Math.PI / 2);
  setFont(L.axisFs, true);
  const aw = ctx.measureText("Altitude (km)").width;
  text("Altitude (km)", 0, 0, L.axisFs, TXT, true, "center"); ctx.restore();
  rec("text", x0 - L.altTitleDx - L.axisFs * 0.76, y0 + h / 2 - aw / 2, x0 - L.altTitleDx + L.axisFs * 0.22, y0 + h / 2 + aw / 2, "Altitude (km)");
  if (L.notePos === "top") text("0°C = 32°F", tx(0) + 8, y0 + L.noteFs * 1.45, L.noteFs, TXT, false, "left", 0.8);
  else text("0°C = 32°F", x0 + w / 2, y0 + h + L.noteDy, L.noteFs, TXT, false, "center", 0.8);
}

// pill label with optional line wrap
function pill(lines, x, yc, fs, edge, a, padX) {
  const lh = Math.round(fs * 1.15), tw = Math.max(...lines.map(l => textW(l, fs, true)));
  const bh = lines.length === 1 ? fs + 18 : lines.length * lh + 14, bw = tw + 2 * padX;
  const by = yc - bh / 2;
  rrect(x, by, bw, bh, Math.min(bh / 2, 18));
  ctx.fillStyle = col([0.05, 0.08, 0.14], 0.78 * a); ctx.fill();
  ctx.strokeStyle = col(edge, 0.9 * a); ctx.lineWidth = 2; ctx.stroke();
  if (a > 0.05) rec("box", x, by, x + bw, by + bh, lines.join(" "));
  const first = yc - (lines.length - 1) * lh / 2 + fs * 0.35;
  lines.forEach((l, j) => text(l, x + padX, first + j * lh, fs, TXT, true, "left", a));
}

function layerLabels(sc, x0, y0, w, h, a, fs, maxw, padX) {
  if (a <= 0) return;
  const zy = z => y0 + (ZTOP - z) / ZTOP * h;
  const items = {
    snow: [[1.5, "Below freezing all the way down", COLD]],
    sleet: [[2.78, "Cold: snow", COLD], [2.05, "Warm layer: melting", WARM], [1.0, "Deep cold layer: refreezing", COLD]],
    frz: [[2.4, "Cold: snow", COLD], [1.1, "Warm layer: melting", WARM], [0.2, "Shallow cold layer: supercooled", COLD]],
    rain: [[2.4, "Cold: snow", COLD], [0.9, "Warm layer: melting / rain", WARM]],
  }[sc.kind];
  for (const [z, s, c] of items) {
    const lines = textW(s, fs, true) > maxw ? bwrap(s, maxw, fs, true) : [s];
    pill(lines, x0 + 14, zy(z), fs, c, a, padX);
  }
}

function sceneIntro(t) {
  ctx.fillStyle = col(BG); ctx.fillRect(0, 0, W, H);
  const a = ease(t / 0.8);
  const items = [["Snowflake", "flake"], ["Raindrop", "drop"], ["Ice pellet (sleet)", "pellet"], ["Supercooled drop", "sup"]];
  const icon = (kind, cx, cy, ai) => {
    if (kind === "flake") snowflake(cx, cy, 34, t * 0.4, ai);
    else if (kind === "drop") drop(cx, cy + 10, 18, ai);
    else if (kind === "pellet") pellet(cx, cy, 17, 1, ai);
    else drop(cx, cy + 10, 18, ai, DROP, [0.65, 0.97, 1.0]);
  };
  const legend = [[WARM, "Red shading = above 0°C (32°F)"], [COLD, "Blue shading = below 0°C (32°F)"]];
  const a3 = ease((t - 2.8) / 0.6), a4 = ease((t - 4) / 0.6);
  const pulse = 0.65 + 0.35 * Math.sin(t * 2.5);

  if (COMP === "tall") {
    text("INTRODUCTION TO METEOROLOGY", W / 2, 150, F(26, 36), MUTED, true, "center", a);
    bwrap("Snow, Sleet, Freezing Rain & Rain", 1000, 72, true).forEach((ln, j) => text(ln, W / 2, 250 + j * 86, 72, TXT, true, "center", a));
    const sf = F(32, 40);
    bwrap("How the vertical temperature profile decides what reaches the ground", 980, sf).forEach((ln, j) => text(ln, W / 2, 440 + j * 50, sf, MUTED, false, "center", a));
    const lf = F(26, 40);
    items.forEach(([lab, kind], i) => {
      const ai = ease((t - 1.2 - i * 0.3) / 0.6);
      if (ai <= 0) return;
      const cx = W / 2 + (i % 2 ? 250 : -250), cy = 640 + Math.floor(i / 2) * 250;
      rrect(cx - 230, cy - 90, 460, 220, 22); ctx.fillStyle = col(PANEL, ai); ctx.fill();
      if (ai > 0.05) rec("box", cx - 230, cy - 90, cx + 230, cy + 130, lab);
      icon(kind, cx, cy - 5, ai);
      text(lab, cx, cy + 90, lf, TXT, true, "center", ai);
    });
    if (a3 > 0) {
      const ff = F(28, 38);
      legend.forEach(([c, lab], j) => {
        const tw = textW(lab, ff, false), y = 1150 + j * 60, x = W / 2 - (tw + 44) / 2;
        rrect(x, y - ff * 0.8, 28, 28, 6); ctx.fillStyle = col(c, 0.55 * a3); ctx.fill();
        text(lab, x + 44, y, ff, TXT, false, "left", a3);
      });
    }
    if (a4 > 0) text("Press Next to begin", W / 2, 1300, F(24, 38), MUTED, false, "center", a4 * pulse);
    return;
  }

  text("INTRODUCTION TO METEOROLOGY", W / 2, 250, F(26, 38), MUTED, true, "center", a);
  text("Snow, Sleet, Freezing Rain & Rain", W / 2, 340, 72, TXT, true, "center", a);
  text("How the vertical temperature profile decides what reaches the ground", W / 2, 410, F(32, 40), MUTED, false, "center", a);
  const cx0 = W / 2 - 3 * 220, cardW = BIG ? 420 : 360, lf = F(26, 40);
  items.forEach(([lab, kind], i) => {
    const ai = ease((t - 1.2 - i * 0.3) / 0.6);
    if (ai <= 0) return;
    const cx = cx0 + i * 440, cy = 600;
    rrect(cx - cardW / 2, cy - 90, cardW, 220, 22); ctx.fillStyle = col(PANEL, ai); ctx.fill();
    if (ai > 0.05) rec("box", cx - cardW / 2, cy - 90, cx + cardW / 2, cy + 130, lab);
    icon(kind, cx, cy, ai);
    text(lab, cx, cy + 90, lf, TXT, true, "center", ai);
  });
  if (a3 > 0) {
    if (!BIG) {
      for (const [cx, c, lab] of [[W / 2 - 330, WARM, legend[0][1]], [W / 2 + 330, COLD, legend[1][1]]]) {
        const tw = textW(lab, 28, false);
        rrect(cx - tw / 2 - 44, 834, 28, 28, 6); ctx.fillStyle = col(c, 0.55 * a3); ctx.fill();
        text(lab, cx - tw / 2, 858, 28, TXT, false, "left", a3);
      }
    } else {
      // measured placement so the two larger items never touch
      const ff = F(28, 40), w0 = textW(legend[0][1], ff), w1 = textW(legend[1][1], ff), gap = 110;
      let x = W / 2 - (w0 + w1 + 88 + gap) / 2;
      legend.forEach(([c, lab], j) => {
        rrect(x, 858 - ff * 0.8, 28, 28, 6); ctx.fillStyle = col(c, 0.55 * a3); ctx.fill();
        text(lab, x + 44, 858, ff, TXT, false, "left", a3);
        x += 44 + (j ? w1 : w0) + gap;
      });
    }
  }
  if (a4 > 0) text("Press Next to begin", W / 2, 990, F(24, 40), MUTED, false, "center", a4 * pulse);
}

function sceneScenario(idx, lt) {
  const sc = SC[idx], L = scenarioLayout();
  ctx.fillStyle = col(BG); ctx.fillRect(0, 0, W, H);

  // header
  const pl = `SCENARIO ${idx + 1}`;
  const pw = L.pillW ?? textW(pl, L.pillFs, true) + 40, ph = L.pillH ?? L.pillFs + 22;
  rrect(L.pillX, L.pillY, pw, ph, ph / 2); ctx.fillStyle = col(sc.color, 0.18); ctx.fill();
  text(pl, L.pillX + pw / 2, L.pillY + ph / 2 + L.pillFs * 0.36, L.pillFs, sc.color, true, "center");
  const tx0 = L.pillX + pw + 20;
  const nw = text(sc.name, tx0, L.titleY, L.titleFs, TXT, true);
  const sub = "—  " + sc.sub;
  if (L.tall) {
    bwrap(sc.sub, L.subMaxW, L.subFs).forEach((ln, j) => text(ln, L.pillX, L.subY + j * L.subLH, L.subFs, MUTED));
  } else {
    const sx = tx0 + nw + 24;
    const sf = BIG ? fitSize(sub, L.subFs, false, W - 50 - sx, 28) : L.subFs;
    text(sub, sx, L.subY, sf, MUTED);
  }

  const { SX, SY, SW, SH, PX, PW } = L;
  const avoidY = (L.badge === "top" && lt >= 5.5) ? SY + 24 - (BIG ? 4 : 0) + L.badgeFs + 26 : null;
  drawColumn(sc, lt, SX, SY, SW, SH, { zeroFs: L.zeroFs, poles: L.poles, avoidY });
  layerLabels(sc, SX, SY, SW, SH, ease((lt - 1.5) / 0.6), L.labFs, L.labMaxW, L.labPad);
  text("Ground", SX + 16, SY + SH + 23 + L.groundFs * 0.36, L.groundFs, MUTED, true);

  // profile title: centred on the panel, nudged in if it would run off the canvas
  const ptw = textW("Temperature profile", L.profTitleFs, true);
  const ptx = Math.min(PX + PW / 2, W - 20 - ptw / 2);
  text("Temperature profile", ptx, L.profTitleY, L.profTitleFs, TXT, true, "center");
  drawProfile(sc, PX, SY, PW, SH, ease(lt / 2.2), L.prof);

  // caption
  let cur = null;
  for (const c of sc.caps) if (lt >= c[0]) cur = c;
  if (cur) {
    const ca = ease((lt - cur[0]) / 0.4);
    const lines = cur[1].split("\n").flatMap(p => bwrap(p, L.capMaxW, L.capFs));
    const y = L.tall ? L.capY : (lines.length === 1 ? L.capY : L.capY2);
    lines.forEach((ln, j) => text(ln, W / 2, y + j * L.capLH, L.capFs, TXT, false, "center", ca));
  }

  // result badge
  const ra = ease((lt - 6.0) / 0.5);
  if (ra > 0) {
    const bf = L.badgeFs;
    if (L.badge === "top") {
      const lab = "Reaches the ground as: " + sc.result, tw = textW(lab, bf, true), bx = SX + SW - tw - 60;
      const bh = bf + 26, by = SY + 24 - (BIG ? 4 : 0);
      rrect(bx, by, tw + 40, bh, bh / 2);
      ctx.fillStyle = col([0.05, 0.08, 0.14], 0.85 * ra); ctx.fill();
      ctx.strokeStyle = col(sc.color, ra); ctx.lineWidth = 2.5; ctx.stroke();
      if (ra > 0.05) rec("box", bx, by, bx + tw + 40, by + bh, lab);
      text(lab, bx + 20, by + bh / 2 + bf * 0.36, bf, sc.color, true, "left", ra);
    } else {
      // tall layout: two-line badge directly under the ground strip
      const l1 = "Reaches the ground as:", l2 = sc.result, lh = Math.round(bf * 1.2);
      const tw = Math.max(textW(l1, bf, true), textW(l2, bf, true)), bw = tw + 40, bh = 2 * lh + 18;
      const bx = SX, by = SY + SH + 46 + 14;
      rrect(bx, by, bw, bh, 22);
      ctx.fillStyle = col([0.05, 0.08, 0.14], 0.85 * ra); ctx.fill();
      ctx.strokeStyle = col(sc.color, ra); ctx.lineWidth = 2.5; ctx.stroke();
      if (ra > 0.05) rec("box", bx, by, bx + bw, by + bh, l1 + " " + l2);
      text(l1, bx + 20, by + 9 + bf * 0.95, bf, sc.color, true, "left", ra);
      text(l2, bx + 20, by + 9 + bf * 0.95 + lh, bf, sc.color, true, "left", ra);
    }
  }
}

function drawReindeer(x, y, t, ph, shade) {
  const body = col([0.78 * shade, 0.56 * shade, 0.34 * shade]);
  const g = Math.sin(t * 14 + ph);
  ctx.strokeStyle = body; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x - 12, y + 6); ctx.lineTo(x - 18 - 6 * g, y + 20);
  ctx.moveTo(x - 8, y + 6); ctx.lineTo(x - 4 + 6 * g, y + 20);
  ctx.moveTo(x + 10, y + 6); ctx.lineTo(x + 18 + 6 * g, y + 18);
  ctx.moveTo(x + 14, y + 6); ctx.lineTo(x + 6 - 6 * g, y + 20);
  ctx.stroke();
  flatEllipse(x, y, 20, 9); ctx.fillStyle = body; ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 14, y - 4); ctx.lineTo(x + 24, y - 16); ctx.lineWidth = 7; ctx.stroke();
  flatEllipse(x + 28, y - 18, 8, 5.5); ctx.fill();
  circle(x + 35, y - 17, 2.2); ctx.fillStyle = col([0.15, 0.1, 0.08]); ctx.fill();
  circle(x - 20, y - 4, 3); ctx.fillStyle = col([0.95, 0.92, 0.85]); ctx.fill();
  ctx.strokeStyle = col([0.80 * shade, 0.68 * shade, 0.48 * shade]); ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 25, y - 22); ctx.lineTo(x + 20, y - 36); ctx.moveTo(x + 22, y - 30); ctx.lineTo(x + 15, y - 34);
  ctx.moveTo(x + 21, y - 33); ctx.lineTo(x + 25, y - 40);
  ctx.moveTo(x + 28, y - 23); ctx.lineTo(x + 30, y - 37); ctx.moveTo(x + 29, y - 31); ctx.lineTo(x + 35, y - 35);
  ctx.stroke();
}

function drawSleigh(t, left, right, baseY, k) {
  const DUR = 4.5, LEN = 420, SPAN = (right - left) / k;
  if (t < 0 || t > DUR) return;
  const X = lerp(-LEN - 40, SPAN + 40, t / DUR);
  const Y = 6 * Math.sin(t * 2.2);
  ctx.save();
  ctx.translate(left, baseY); ctx.scale(k, k);
  for (let j = 1; j <= 14; j++) {
    const tk = t - j * 0.06, tx = lerp(-LEN - 40, SPAN + 40, tk / DUR) - 6;
    const ty = 6 * Math.sin(tk * 2.2) + 22 + 6 * Math.sin(j * 1.9 + t * 9);
    circle(tx, ty, 2.6 * (1 - j / 15)); ctx.fillStyle = col([1, 0.92, 0.6], 0.8 * (1 - j / 15)); ctx.fill();
  }
  const deer = [X + 175, X + 255, X + 335, X + 415];
  ctx.strokeStyle = col([0.85, 0.75, 0.40], 0.9); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(X + 62, Y - 2);
  deer.forEach((dx, i) => ctx.lineTo(dx + 12, Y - 4 + 2 * Math.sin(t * 7 + i)));
  ctx.stroke();
  deer.forEach((dx, i) => drawReindeer(dx, Y + 2 * Math.sin(t * 7 + i), t, i * 1.3, i % 2 ? 0.85 : 1));
  circle(X + 42, Y - 6, 13); ctx.fillStyle = col([0.80, 0.12, 0.14]); ctx.fill();
  circle(X + 45, Y - 24, 7.5); ctx.fillStyle = col([0.96, 0.80, 0.68]); ctx.fill();
  flatEllipse(X + 46, Y - 16, 8, 6); ctx.fillStyle = col([0.97, 0.97, 0.97]); ctx.fill();
  ctx.fillStyle = col([0.80, 0.12, 0.14]);
  ctx.beginPath(); ctx.moveTo(X + 36, Y - 28); ctx.lineTo(X + 54, Y - 28); ctx.lineTo(X + 34, Y - 42); ctx.closePath(); ctx.fill();
  ctx.fillStyle = col([0.97, 0.97, 0.97]);
  ctx.fillRect(X + 36, Y - 30, 18, 3.5); circle(X + 34, Y - 42, 3); ctx.fill();
  circle(X + 16, Y - 10, 12); ctx.fillStyle = col([0.30, 0.55, 0.32]); ctx.fill();
  ctx.fillStyle = col([0.72, 0.10, 0.12]);
  ctx.beginPath();
  ctx.moveTo(X, Y - 8); ctx.lineTo(X + 6, Y + 14); ctx.lineTo(X + 72, Y + 14);
  ctx.quadraticCurveTo(X + 88, Y + 12, X + 86, Y - 6); ctx.lineTo(X + 74, Y - 2); ctx.lineTo(X + 64, Y + 2);
  ctx.lineTo(X + 14, Y + 2); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = col([0.95, 0.78, 0.30]); ctx.lineWidth = 2; ctx.stroke();
  ctx.lineWidth = 3; ctx.beginPath();
  ctx.moveTo(X - 4, Y + 24); ctx.lineTo(X + 84, Y + 24); ctx.quadraticCurveTo(X + 100, Y + 24, X + 98, Y + 12);
  ctx.moveTo(X + 20, Y + 14); ctx.lineTo(X + 20, Y + 24); ctx.moveTo(X + 62, Y + 14); ctx.lineTo(X + 62, Y + 24);
  ctx.stroke();
  ctx.restore();
}

function drawSkater(x, y, dir, phase, speed, coat, hat) {
  ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
  const sw = 4.5 * Math.sin(phase) * speed, lift = 2 * speed;
  const feet = [[sw, -Math.max(0, Math.sin(phase)) * lift], [-sw, -Math.max(0, -Math.sin(phase)) * lift]];
  ctx.lineCap = "round";
  for (const [fx, fy] of feet) {
    ctx.strokeStyle = col([0.18, 0.20, 0.26]); ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(fx, fy - 2); ctx.stroke();
    ctx.strokeStyle = col([0.85, 0.88, 0.92]); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(fx - 3.5, fy); ctx.lineTo(fx + 3, fy); ctx.quadraticCurveTo(fx + 4.5, fy, fx + 4.2, fy - 1.5); ctx.stroke();
  }
  ctx.strokeStyle = col(coat); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(2, -19); ctx.lineTo(-4, -14 + 2 * Math.sin(phase)); ctx.stroke();
  ctx.lineWidth = 5.5;
  ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(2.2, -20); ctx.stroke();
  circle(3, -24, 3.2); ctx.fillStyle = col([0.95, 0.80, 0.68]); ctx.fill();
  ctx.fillStyle = col(hat);
  ctx.beginPath(); ctx.arc(3, -24.6, 3.4, Math.PI, 0); ctx.closePath(); ctx.fill();
  circle(3, -28.6, 1.4); ctx.fill();
  ctx.restore();
}

function drawSkaters(t, left, w, groundY) {
  if (t < 0) return;
  let X, v;
  const enterT = 1.6, x0 = -0.12 * w, xc = 0.30 * w, A = 0.17 * w, om = 0.9;
  if (t < enterT) { const u = t / enterT; X = lerp(x0, xc, u * (2 - u)); v = (xc - x0) * (2 - 2 * u) / enterT; }
  else { const tt = t - enterT; X = xc + A * Math.sin(tt * om); v = A * om * Math.cos(tt * om); }
  const dir = v >= 0 ? 1 : -1, speed = clamp(Math.abs(v) / (A * om));
  const phase = t * 5.5;
  const xa = left + X, xb = left + X - 13 * dir, y = groundY;
  ctx.strokeStyle = col([0.95, 0.80, 0.68]); ctx.lineWidth = 1.6; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(xa + 2 * dir, y - 18); ctx.quadraticCurveTo((xa + xb) / 2, y - 13, xb + 2 * dir, y - 18); ctx.stroke();
  drawSkater(xb, y, dir, phase + Math.PI, Math.max(0.35, speed), [0.55, 0.35, 0.80], [0.95, 0.85, 0.30]);
  drawSkater(xa, y, dir, phase, Math.max(0.35, speed), [0.85, 0.22, 0.25], [0.97, 0.97, 0.97]);
}

// mini column with profile overlay, used by the summary panels
function miniPanel(sc, lt, cx, cy, cw, ch, zeroFs) {
  const gh = 30;
  ctx.save(); rrect(cx, cy, cw, ch + gh, 10); ctx.clip();
  drawColumn(sc, lt + 6, cx, cy, cw, ch, { s: 0.62, labels: false, gh, poles: [0.70, 0.94] });
  if (sc.kind === "snow") drawSleigh(lt - 3.6, cx, cx + cw, cy + ch * 0.36, 0.45);
  if (sc.kind === "frz") drawSkaters(lt - 3.6, cx, cw, cy + ch - 9 * 0.62 * clamp((lt + 6 - sc.thit + 1) / 8));
  ctx.restore();
  const TMIN = -14, TMAX = 10;
  const tx = T => cx + (T - TMIN) / (TMAX - TMIN) * cw, zy = z => cy + (ZTOP - z) / ZTOP * ch;
  ctx.setLineDash([8, 6]); ctx.strokeStyle = col([1, 1, 1], 0.6); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(tx(0), cy); ctx.lineTo(tx(0), cy + ch); ctx.stroke(); ctx.setLineDash([]);
  profileSegments(sc, tx, zy, 0, [[9, () => col([0.03, 0.05, 0.1], 0.8)], [5, T => col(T > 0 ? WARM : COLD)]]);
  // place "0°C" beside the dashed line where the profile curve isn't, below the cloud and above the poles
  const lw = textW("0°C", zeroFs, true), dT = (lw + 10) / cw * (TMAX - TMIN);
  const zTop = ZTOP - (BIG ? 36 : 27) / ch * ZTOP;   // just below the cloud
  let best = null;
  for (let z = zTop; z > 0.9 && !best; z -= 0.05) {
    const zLo = z - (zeroFs * 1.1) / ch * ZTOP;
    for (const side of [-1, 1]) {
      let ok = true;
      for (let k = 0; k <= 6 && ok; k++) {
        const T = T_at(sc, lerp(z, zLo, k / 6));
        if (side < 0 ? (T > -dT - 1.2 && T < 0.6) : (T > -0.6 && T < dT + 1.2)) ok = false;
      }
      if (ok) { best = { z, side }; break; }
    }
  }
  best = best || { z: zTop, side: 1 };
  const ly = zy(best.z) + zeroFs * 0.9;
  // in the Snow panel, fade the label out while Santa's sleigh flies past it
  const la = sc.kind === "snow" ? 1 - clamp(Math.min((lt - 3.4) / 0.3, (8.4 - lt) / 0.3)) : 1;
  if (la <= 0.01) return;
  ctx.save(); ctx.globalAlpha *= la;
  if (BIG) {   // small dark backing so the label stays readable over snowflakes when drawn small
    const bx = best.side < 0 ? tx(0) - 6 - lw - 6 : tx(0) + 6 - 6;
    rrect(bx, ly - zeroFs * 0.85, lw + 12, zeroFs * 1.05, 6); ctx.fillStyle = col([0.05, 0.08, 0.14], 0.7); ctx.fill();
  }
  text("0°C", tx(0) + best.side * 6, ly, zeroFs, TXT, true, best.side < 0 ? "right" : "left", 0.9);
  ctx.restore();
}

function sceneSummary(lt) {
  ctx.fillStyle = col(BG); ctx.fillRect(0, 0, W, H);

    const rowH = 254, gap = 14, top = 150, dFs = F(25, 37), fFs = F(23, 36), tFs = F(38, 42);
    SC.forEach((sc, i) => {
      const a = ease((lt - 0.5 - i * 0.5) / 0.6);
      if (a <= 0) return;

      ctx.save(); ctx.globalAlpha = a;
      rrect(x0, y0, rw, rowH, 18); ctx.fillStyle = col(PANEL); ctx.fill();
      miniPanel(sc, lt, x0 + 16, y0 + 14, 300, rowH - 28 - 30, F(17, 34));
      const tx0 = x0 + 340, tw = rw - 340 - 20;

      dl.forEach((ln, j) => text(ln, tx0, y0 + 30 + tFs + dFs * 0.95 + j * lh, dFs, TXT, false, "left"));

    });

    return;
  }

  text(title, W / 2, 80, 46, TXT, true, "center", ta);

    const pw = 405, gap = 40, xs = (W - (4 * pw + 3 * gap)) / 2;
    SC.forEach((sc, i) => {
      const a = ease((lt - 0.5 - i * 0.5) / 0.6);
      if (a <= 0) return;
      const x0 = xs + i * (pw + gap), y0 = 130;
      ctx.save(); ctx.globalAlpha = a;
      rrect(x0, y0, pw, 860, 20); ctx.fillStyle = col(PANEL); ctx.fill();
      text(sc.result, x0 + pw / 2, y0 + 56, 38, sc.color, true, "center");
      miniPanel(sc, lt, x0 + 22, y0 + 90, pw - 44, 470, 17);
      wrap(sc.summary, pw - 50, 25).forEach((ln, j) => text(ln, x0 + pw / 2, y0 + 650 + j * 34, 25, TXT, false, "center"));
      text(FACT[sc.kind], x0 + pw / 2, y0 + 820, 23, sc.color, true, "center");
      ctx.restore();
    });
    text(key, W / 2, 1045, 32, TXT, true, "center", ka);
    return;
  }

  // larger text: wider panels, shorter mini columns, text block sized to the longest panel
  const pw = 445, gap = 20, xs = (W - (4 * pw + 3 * gap)) / 2, y0 = 130, phh = 860;
  const tFs = F(38, 42), dFs = F(25, 38), fFs = F(23, 36), dLH = Math.round(dFs * 1.2), fLH = Math.round(fFs * 1.2);
  const dLines = SC.map(sc => wrap(sc.summary, pw - 40, dFs));
  const fLines = SC.map(sc => textW(FACT[sc.kind], fFs, true) > pw - 30 ? wrap(FACT[sc.kind], pw - 30, fFs, true) : [FACT[sc.kind]]);
  const nD = Math.max(...dLines.map(l => l.length)), nF = Math.max(...fLines.map(l => l.length));
  const bottom = y0 + phh - 22, factTop = bottom - nF * fLH, descTop = factTop - 18 - nD * dLH;
  const cy = y0 + 84, ch = descTop - 22 - 30 - cy;
  SC.forEach((sc, i) => {
    const a = ease((lt - 0.5 - i * 0.5) / 0.6);
    if (a <= 0) return;
    const x0 = xs + i * (pw + gap);
    ctx.save(); ctx.globalAlpha = a;
    rrect(x0, y0, pw, phh, 20); ctx.fillStyle = col(PANEL); ctx.fill();
    text(sc.result, x0 + pw / 2, y0 + 58, tFs, sc.color, true, "center");
    miniPanel(sc, lt, x0 + 20, cy, pw - 40, ch, F(17, 36));
    dLines[i].forEach((ln, j) => text(ln, x0 + pw / 2, descTop + dFs * 0.95 + j * dLH, dFs, TXT, false, "center"));
    fLines[i].forEach((ln, j) => text(ln, x0 + pw / 2, factTop + fFs * 0.95 + j * fLH, fFs, sc.color, true, "center"));
    ctx.restore();
  });
  const kf = fitSize(key, F(32, 40), true, W - 80, 30);
  text(key, W / 2, 1045, kf, TXT, true, "center", ka);
}

// ---------- scene descriptions (screen readers and the Text panel) ----------

     <li><strong>Freezing rain:</strong> a shallow surface cold layer. Drops stay liquid (supercooled) and freeze on impact. Surface cold layer: shallow.</li>

// ---------- player ----------
const N = SCENES.length;
const DONE_T = [6, 14, 14, 14, 14, 14];        // a moment when each scene has finished building
let scene = 0, sceneTime = 0, paused = false, last = null, fadeT = 1;
const mqReduce = matchMedia("(prefers-reduced-motion: reduce)");
let reduceMotion = mqReduce.matches;

const $ = id => document.getElementById(id);
const dots = $("dots"), prevB = $("prev"), nextB = $("next"), pauseB = $("pause"), replayB = $("replay");
const fsB = $("fs"), textB = $("textBtn"), counter = $("counter"), live = $("st-live"), stText = $("scene-text");
const ctl = $("controls"), stageBox = $("stageBox"), skip = $("skip"), closeB = $("closeText"), spacer = ctl.querySelector(".spacer");

SCENES.forEach((name, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "dot"; b.id = "dot" + i;
  b.textContent = i === 0 ? "T" : i === N - 1 ? "S" : String(i);
  b.title = name; b.setAttribute("aria-label", `Go to scene ${i + 1} of ${N}: ${name.replace(/^\d /, "")}`);
  b.addEventListener("click", () => go(i));
  dots.appendChild(b);
});

// fullscreen only where the browser supports it (not iPhone Safari)
const fsEl = document.documentElement;
const fsSupported = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) && !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
if (!fsSupported) fsB.hidden = true;
function toggleFs() {
  if (!fsSupported) return;
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const r = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl); if (r && r.catch) r.catch(() => {}); }
  } catch (e) {}
}

// remembered Text choice
let textOn = false;
try { textOn = localStorage.getItem("wp-text") === "1"; } catch (e) {}
function setText(on, persist = true) {
  textOn = on;
  if (persist) { try { localStorage.setItem("wp-text", on ? "1" : "0"); } catch (e) {} }
  applyTextVisibility();
}
function applyTextVisibility() {
  const show = MODE === "port" || textOn;
  stText.classList.toggle("sr-only", !show);
  textB.setAttribute("aria-pressed", textOn ? "true" : "false");
  textB.setAttribute("aria-label", textOn ? "Text: hide scene description" : "Text: show scene description");
  fit();
}

function setDesc() { live.innerHTML = DESC[scene]; }
function updateUI() {
  prevB.disabled = scene === 0; nextB.disabled = scene === N - 1;
  [...dots.children].forEach((d, i) => { if (i === scene) d.setAttribute("aria-current", "step"); else d.removeAttribute("aria-current"); });
  counter.textContent = `${scene + 1} of ${N}`;
  pauseB.setAttribute("aria-label", paused ? "Play" : "Pause");
  pauseB.querySelector(".lbl").textContent = paused ? "Play" : "Pause";
  pauseB.querySelector(".ic-pause").style.display = paused ? "none" : "";
  pauseB.querySelector(".ic-play").style.display = paused ? "" : "none";
  nextB.setAttribute("aria-label", scene === N - 1 ? "Next scene (this is the last scene)" : `Next scene: ${SCENES[scene + 1].replace(/^\d /, "")}`);
  prevB.setAttribute("aria-label", scene === 0 ? "Back (this is the first scene)" : `Back: ${SCENES[scene - 1].replace(/^\d /, "")}`);
}
function enterScene() {
  if (reduceMotion) { sceneTime = DONE_T[scene]; paused = true; fadeT = 1; }
  else { sceneTime = 0; paused = false; fadeT = 0; }
}
function go(i) {
  i = Math.max(0, Math.min(N - 1, i));
  if (i === scene) return;
  scene = i; enterScene(); updateUI(); setDesc();
}
function replay() { sceneTime = 0; fadeT = reduceMotion ? 1 : 0; paused = false; updateUI(); }
function togglePause() { paused = !paused; updateUI(); }
mqReduce.addEventListener?.("change", e => { reduceMotion = e.matches; if (reduceMotion) { sceneTime = DONE_T[scene]; paused = true; fadeT = 1; updateUI(); } });

nextB.onclick = () => go(scene + 1);
prevB.onclick = () => go(scene - 1);
replayB.onclick = replay;
pauseB.onclick = togglePause;
fsB.onclick = toggleFs;
textB.onclick = () => setText(!textOn);
closeB.onclick = () => { setText(false); textB.focus(); };
skip.addEventListener("click", e => {
  e.preventDefault();
  if (!textOn && MODE !== "port") { textOn = true; applyTextVisibility(); }   // shown now, not saved as a preference
  stText.focus();
});

document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = e.target.tagName;
  // a focused button or link already acts on Space/Enter; don't trigger twice
  if ((tag === "BUTTON" || tag === "A") && (e.key === " " || e.key === "Enter")) return;
  switch (e.key) {
    case "ArrowRight": case " ": case "PageDown": e.preventDefault(); go(scene + 1); break;
    case "ArrowLeft": case "PageUp": e.preventDefault(); go(scene - 1); break;
    case "Home": e.preventDefault(); go(0); break;
    case "End": e.preventDefault(); go(N - 1); break;
    case "r": case "R": replay(); break;
    case "p": case "P": togglePause(); break;
    case "t": case "T": setText(!textOn); break;
    case "f": case "F": toggleFs(); break;
    case "Escape": if (textOn && MODE === "land") { setText(false); textB.focus(); } break;
  }
});

// mouse: a click on the picture advances (as before). Touch: swipe, or tap the right side / far left.
let lastTouch = 0, tStart = null;
cv.addEventListener("click", e => {
  if (Date.now() - lastTouch < 800 || (e.pointerType && e.pointerType !== "mouse")) return;
  go(scene + 1);
});
cv.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse") return;
  tStart = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
});
cv.addEventListener("pointercancel", () => { tStart = null; });
cv.addEventListener("pointerup", e => {
  if (e.pointerType === "mouse" || !tStart || e.pointerId !== tStart.id) return;
  lastTouch = Date.now();
  const dx = e.clientX - tStart.x, dy = e.clientY - tStart.y, dt = performance.now() - tStart.t;
  tStart = null;
  if (Math.abs(dx) > 45 && Math.abs(dx) > 1.4 * Math.abs(dy) && dt < 900) { go(scene + (dx < 0 ? 1 : -1)); return; }
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 350) {
    const r = cv.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width;
    if (fx > 0.5) go(scene + 1);
    else if (fx < 0.25) go(scene - 1);
  }
});

// ---------- layout modes ----------
const mqLand = matchMedia("(orientation: landscape) and (max-height: 560px)");
const mqPort = matchMedia("(orientation: portrait) and (max-width: 640px)");
let MODE = "";
const ORDER = {
  desk: ["prev", "dots", "next", "replay", "pause", "fs", "textBtn"],
  land: ["counter", "textBtn", "replay", "pause", "fs", "spacer", "prev", "next"],
  port: ["prev", "replay", "pause", "next"],
};
function arrangeControls() {
  const byId = { dots, counter, spacer };
  for (const id of ORDER[MODE]) ctl.appendChild(byId[id] || $(id));
}
function setMode() {
  const m = mqLand.matches ? "land" : mqPort.matches ? "port" : "desk";
  if (m === MODE) return false;
  MODE = m;
  document.documentElement.classList.remove("land", "port", "desk");
  document.documentElement.classList.add(m);
  arrangeControls();
  const comp = m === "port" ? "tall" : "wide";
  if (comp !== COMP) {
    COMP = comp;
    W = comp === "tall" ? 1080 : 1920; H = comp === "tall" ? 1350 : 1080;
    cv.width = W; cv.height = H;
  }
  applyTextVisibility();
  return true;
}
function fit() {
  if (!MODE) return;
  let bw, bh;
  if (MODE === "port") {
    bw = document.documentElement.clientWidth - (parseFloat(getComputedStyle($("app")).paddingLeft) + parseFloat(getComputedStyle($("app")).paddingRight));
    bh = Math.min(bw * H / W, window.innerHeight * 0.58);
    stageBox.style.height = Math.round(bh) + "px";
  } else {
    stageBox.style.height = "";
    bw = stageBox.clientWidth; bh = stageBox.clientHeight;
  }
  const sc = Math.max(0.05, Math.min(bw / W, bh / H));
  cv.style.width = Math.floor(W * sc) + "px";
  cv.style.height = Math.floor(H * sc) + "px";
  SCALE = sc;
  BIG = COMP === "tall" || SCALE < 0.55;
}
function onResize() { setMode(); fit(); }
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", () => setTimeout(onResize, 120));
if (window.ResizeObserver) new ResizeObserver(() => fit()).observe(stageBox);
mqLand.addEventListener?.("change", onResize); mqPort.addEventListener?.("change", onResize);

function render() {
  const t = sceneTime;
  if (REC.on) REC.items = [];
  if (scene === 0) sceneIntro(t);
  else if (scene <= 4) sceneScenario(scene - 1, t);
  else sceneSummary(t);
  if (fadeT < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - ease(fadeT)})`; ctx.fillRect(0, 0, W, H); }
}
function frame(now) {
  if (last === null) last = now;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!paused) sceneTime += dt;
  fadeT = Math.min(1, fadeT + dt / 0.4);
  render();
  requestAnimationFrame(frame);
}

// test hook used during development checks; harmless for students
window.__wp = { go: i => { scene = i; enterScene(); updateUI(); setDesc(); }, seek: t => { sceneTime = t; fadeT = 1; paused = true; render(); },
  rec: on => { REC.on = on; }, items: () => REC.items, info: () => ({ MODE, COMP, BIG, SCALE, W, H }) };

setMode(); fit();
enterScene(); updateUI(); setDesc();
let started = false;
const start = () => { if (!started) { started = true; fit(); requestAnimationFrame(frame); } };
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('700 40px "Inter"'), document.fonts.load('400 40px "Inter"')]).then(start, start);
  setTimeout(start, 1500);
} else start();
})();
</script>
