      '<div class="words" style="left:140px;top:990px;width:700px"><p class="note">Simplified illustration</p></div></div>'));
    this.pf = puffs(root.querySelector('.pf'), PUFFS);
    this.cl = root.querySelector('.cl'); this.lb = root.querySelector('.lb'); this.ld = root.querySelector('.ld');
    this.bg = [...root.querySelectorAll('.bgf')]; this.note = root.querySelector('.note').style;
    textRefs(this, root);
  },
  render(t) {
    textRender(this, t, 1.2);
    this.note.opacity = eo(seg(t, 1.6, 2.2));
    this.pf(t * 20 + 3640 + seg(t, 4.8, 8) * 160 + Math.max(0, t - 8) * 40, t * 12 + 168);
    const zin = eio(seg(t, 0.3, 2.4)), zout = eio(seg(t, 4.6, 6.6));
    const sc = lerp(lerp(1, 1.18, zin), 0.62, zout);
    const idle = seg(t, 8, 9.5);
    const fall = eio(seg(t, 4.6, 8)) * 140 + Math.sin((t - 8) * 0.8) * 12 * idle;
    const rc = 12 * eio(seg(t, 0, 8)) + 4 * Math.max(0, t - 8) * idle;
    this.cl.setAttribute('transform', 'translate(' + C[0] + ' ' + (C[1] + fall).toFixed(2) + ') rotate(' + rc.toFixed(3) + ') scale(' + sc.toFixed(4) + ')');
    this.lb.style.opacity = eo(seg(t, 2.4, 2.9)) * (1 - eo(seg(t, 4.4, 4.9)));
    this.ld.setAttribute('d', 'M' + (C[0] + 190 * sc).toFixed(1) + ' ' + (C[1] - 110 * sc).toFixed(1) + ' L1520 260');
    this.bg.forEach((g, i) => {
      const b = this.BG[i];
      let y = (b.y0 + b.v * t) % 1180; y -= 60;
      g.setAttribute('transform', 'translate(' + (b.x + Math.sin(t * 0.8 + i) * 14).toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' + (b.r + t * 9).toFixed(1) + ')');
      g.style.opacity = eo(seg(t, 4.8 + (i % 3) * 0.25, 5.6 + (i % 3) * 0.25)) * 0.85;
    });
  },
});

scene('recap', 'Recap', 7, {
  init(root) {
    let fz = '';
    [[0, .4], [1, .7], [2, .3], [3, .6], [4, .5], [5, .2]].forEach(b => {
      const a = ICE.rot(0, -76, b[0] * 60), c = ICE.rot(0, -76, b[0] * 60 + 60), n = ICE.rot(0, -6, b[0] * 60 + 30);
      fz += '<circle class="frozen" style="stroke-width:2.5px" cx="' + (a[0] + (c[0] - a[0]) * b[1] + n[0]).toFixed(1) + '" cy="' + (a[1] + (c[1] - a[1]) * b[1] + n[1]).toFixed(1) + '" r="8"/>';
    });
    const icoA = '<polygon class="ice" style="stroke-width:3px" points="' + ICE.pstr(ICE.hexPts(76)) + '"/>' + fz + '<circle class="drop" cx="40" cy="108" r="9"/><circle class="drop" cx="-62" cy="96" r="7"/>';
    let icoB = '';
    ICE.P.forEach((p, i) => { const x = p.plate[0] * 0.95 + Math.sin(i * 2.1) * 14, y = p.plate[1] * 0.95 + Math.cos(i * 1.3) * 14; icoB += '<polygon class="ice" style="stroke-width:3px" points="' + ICE.pstr(p.pts) + '" transform="scale(0.5) translate(' + (x * 1.1).toFixed(1) + ' ' + (y * 1.1).toFixed(1) + ') rotate(' + (p.plate[2] + (i % 2 ? 30 : -25)) + ')"/>'; });
    const icoC = '<g transform="scale(0.48)">' + ICE.flakeSVG() + '</g>';
    let ci = 0;
    const card = (x, ico, head, eq) => '<div class="card rc rc' + (ci++) + '" style="left:' + x + 'px;top:420px;width:520px;height:520px;display:flex;flex-direction:column;align-items:center;gap:20px;padding:40px 36px;text-align:center">' +
      '<svg class="ri" width="230" height="230" viewBox="-115 -115 230 230" style="flex:none;overflow:visible">' + ico + '</svg>' +
      '<div class="words" style="position:static;align-items:center"><p class="line" style="font-size:58px">' + head + '</p><p class="eq">' + eq + '</p></div></div>';
    root.append(h('<div class="ground"><svg class="art" viewBox="0 0 1920 1080"><g class="pf"></g></svg>' +
      '<div class="words" style="left:140px;top:120px;width:1400px"><p class="tag">Recap</p><h2 class="line hd" style="font-size:96px">From crystal to snowflake</h2><div class="rule"></div></div>' +
      card(140, icoA, 'Accretion', 'Supercooled droplets freeze onto an ice crystal') +
      card(700, icoB, 'Shattering', 'A large crystal breaks into slivers and pieces') +
      card(1260, icoC, 'Aggregation', 'Pieces collide and bond into a snowflake') + '</div>'));
    this.pf = puffs(root.querySelector('.pf'), PUFFS);
    this.tagS = root.querySelector('.tag').style; this.hd = root.querySelector('.hd'); this.rule = root.querySelector('.rule').style;
    this.cards = [...root.querySelectorAll('.rc')].map(e => e.style); this.icons = [...root.querySelectorAll('.ri')].map(e => e.style);
  },
  render(t) {
    this.tagS.opacity = eo(seg(t, 0.1, 0.6));
    fadeFromRight(this.hd, t, 0.2);
    this.rule.transformOrigin = '0 50%'; this.rule.transform = 'scaleX(' + eo(seg(t, 0.9, 1.4)) + ')';
    this.pf(0, t * 10);
    this.cards.forEach((c, i) => {
      const p = seg(t, 1.0 + i * 0.45, 1.7 + i * 0.45);
      c.opacity = eo(p); c.transform = 'translateY(' + lerp(40, 0, eo(p)) + 'px)';
      const s = t > 1.0 + i * 0.45 ? eob(seg(t, 1.2 + i * 0.45, 1.9 + i * 0.45), 1.6) : 0;
      this.icons[i].transform = 'rotate(' + (Math.sin(t * 0.9 + i) * 4).toFixed(2) + 'deg) scale(' + s.toFixed(3) + ')';
    });
  },
});

// ---------- scene text (shown on screen and read by screen readers) ----------
const META = {
  cloud: { still: 5, cap: { tag: 'Introduction to meteorology', line: 'Accretion and aggregation', sub: 'How ice crystals grow into snowflakes' },
    desc: 'This animation shows how ice crystals grow into snowflakes through two processes, accretion and aggregation. Inside a cold cloud, a small ice crystal appears. It is a flat, six-sided crystal called a hexagonal plate. The view zooms in on it.' },
  fall: { still: 5, cap: { tag: 'Inside the cloud, below 0 °C', line: 'Supercooled droplets', sub: 'Tiny droplets of liquid water stay unfrozen well below 0 °C. The heavier ice crystal falls past them.' },
    desc: 'The view falls along with the ice crystal, a hexagonal plate. The cloud around it is full of tiny droplets of liquid water. They are supercooled: they stay unfrozen even though the air is well below 0 °C. The ice crystal is heavier, so it falls past the droplets, which makes them appear to stream upward. An arrow labeled “Falls” points down beside the crystal.' },
  hit: { still: 7, cap: { tag: 'Accretion', line: 'Collide and freeze', sub: 'A supercooled droplet strikes the ice crystal and freezes on contact, adding its water to the crystal.' },
    desc: 'This is accretion. A supercooled droplet strikes the edge of the ice crystal and freezes on contact. It stays stuck to the crystal as a frozen droplet, adding its water to the crystal. Three more droplets hit the crystal and freeze in the same way.' },
  grow: { still: 7, cap: { tag: 'Accretion', line: 'Growing larger', sub: 'More droplets collide and freeze on. Droplet by droplet, the ice crystal grows larger and heavier.' },
    desc: 'Accretion continues. Many more droplets collide with the crystal, freeze on and become part of the ice. Droplet by droplet, the hexagonal plate grows larger and heavier, and a bar labeled “Crystal size” fills up.' },
  shatter: { still: 6, cap: { tag: 'Shattering', line: 'It breaks apart', sub: 'Grown large and fragile, the crystal fractures into slivers and uniquely shaped pieces of ice.' },
    desc: 'Cracks spread across the large plate. Grown large and fragile, the crystal fractures into slivers and uniquely shaped pieces of ice: a small six-sided center piece, six long slivers and twelve shorter slivers. A few tiny chips fly away.' },
  drift: { still: 6, cap: { tag: 'Fragments', line: 'Drifting apart', sub: 'Each sliver and piece now drifts and tumbles on its own through the cold cloud.' },
    desc: 'The pieces separate. Each sliver and piece now drifts and tumbles on its own through the cold cloud.' },
  stick: { still: 8, cap: { tag: 'Aggregation', line: 'Collide and stick', sub: 'The pieces collide and bond. A thin, liquid-like layer on the ice and interlocking edges hold them together, aided by weak electrical attraction.' },
    desc: 'This is aggregation. The pieces collide and bond. The center piece arrives first. The six long slivers attach to it as arms, and then the shorter slivers attach to the arms as side branches. A thin, liquid-like layer on the ice and interlocking edges hold the pieces together, aided by weak electrical attraction.' },
  flake: { still: 3.6, cap: { tag: 'Aggregation', line: 'A snowflake', sub: 'Bonded together, the pieces form a six-pointed snowflake that keeps falling toward the ground.', note: 'Simplified illustration' },
    desc: 'Bonded together, the pieces form a six-pointed snowflake, labeled “six points, bonded pieces.” It turns slowly and keeps falling toward the ground as other snowflakes appear around it. A note at the bottom says this is a simplified illustration.' },
  recap: { still: 7, cap: { tag: 'Recap', line: 'From crystal to snowflake' },
    desc: 'Recap: from crystal to snowflake. Accretion: supercooled droplets freeze onto an ice crystal. Shattering: a large crystal breaks into slivers and pieces. Aggregation: pieces collide and bond into a snowflake.' },
};
SCENES.forEach(s => Object.assign(s, META[s.id]));

// ---------- player ----------
const $ = id => document.getElementById(id);
const stage = $('stage'), frame = $('frame'), body = document.body;
SCENES.forEach(s => { s.root = document.createElement('div'); s.root.className = 'layer'; stage.appendChild(s.root); s.init(s.root); });

const mqPort = matchMedia('(orientation: portrait) and (max-width: 640px)');
const mqLand = matchMedia('(orientation: landscape) and (max-height: 560px)');
const mqReduce = matchMedia('(prefers-reduced-motion: reduce)');
let mode = 'desk';
function fit() {
  const m = mqPort.matches ? 'port' : mqLand.matches ? 'land' : 'desk';
  if (m !== mode) { body.classList.remove('desk', 'land', 'port'); mode = m; }
  body.classList.add(mode);
  const port = mode === 'port';
  const s = frame.clientWidth / (port ? 1120 : 1920);
  if (!s) return;
  stage.style.transform = 'scale(' + s + ')' + (port ? ' translateX(-800px)' : '');
  stage.classList.toggle('port', port);
  const big = s < 0.55;
  stage.classList.toggle('big', big);
  const px = (target, lo, hi) => Math.min(hi, Math.max(lo, target / s)).toFixed(1) + 'px';
  stage.style.setProperty('--lab', px(14, 28, 48));
  stage.style.setProperty('--sub', px(15, 34, 46));
  stage.style.setProperty('--tag', px(13, 24, 42));
  stage.style.setProperty('--eq', px(14, 30, 44));
  stage.style.setProperty('--note', px(13, 24, 40));
  applyText();
}
new ResizeObserver(fit).observe(frame);
[mqPort, mqLand].forEach(q => q.addEventListener ? q.addEventListener('change', fit) : q.addListener(fit));
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 250));

// scene text panel
let textOn = false;
try { textOn = localStorage.getItem('aa-text') === '1'; } catch (e) {}
const desc = $('desc'), textB = $('textB');
function applyText() {
  const shown = mode === 'port' || textOn;
  desc.classList.toggle('sr-only', !shown);
  textB.setAttribute('aria-expanded', textOn ? 'true' : 'false');
  textB.setAttribute('aria-label', textOn ? 'Hide scene text' : 'Show scene text');
}
function setText(on) { textOn = on; try { localStorage.setItem('aa-text', on ? '1' : '0'); } catch (e) {} applyText(); }
textB.onclick = () => setText(!textOn);
$('closeText').onclick = () => { setText(false); textB.focus(); };
$('skip').addEventListener('click', e => { e.preventDefault(); if (mode !== 'port') setText(true); desc.focus(); });

// scene navigation
const dots = $('dots'), title = $('title'), count = $('count'), nextB = $('next'), backB = $('back');
SCENES.forEach((s, i) => { const b = document.createElement('button'); b.setAttribute('aria-label', 'Go to scene ' + (i + 1) + ': ' + s.name); b.onclick = () => go(i); dots.appendChild(b); });
const esc = x => x.replace(/&/g, '&amp;').replace(/</g, '&lt;');
let cur = -1, start = performance.now(), prev = null, prevT = 0, fadeStart = 0, paused = false, pausedAt = 0, still = false;
const FADE = 0.4;
function sceneTime(now) { return ((paused ? pausedAt : now) - start) / 1000; }
function setPaused(p) {
  const now = performance.now();
  if (p === paused) return;
  if (paused) { start += now - pausedAt; paused = false; } else { pausedAt = now; paused = true; }
  $('pauseTxt').textContent = paused ? 'Play' : 'Pause';
  $('pause').setAttribute('aria-label', paused ? 'Play' : 'Pause');
  $('pauseIco').innerHTML = paused ? '<path d="M7 5l12 7-12 7z"/>' : '<path d="M8 5v14M16 5v14"/>';
}
function go(i) {
  if (i < 0 || i >= SCENES.length) return;
  const now = performance.now();
  const reduce = mqReduce.matches;
  if (i !== cur && cur >= 0 && !reduce) { prev = cur; prevT = sceneTime(now); fadeStart = now; } else prev = null;
  cur = i;
  const s = SCENES[i];
  if (reduce) {
    setPaused(false); start = now - s.still * 1000; setPaused(true); still = true;
  } else { start = now; if (paused) pausedAt = now; still = false; }
  title.textContent = 'Scene ' + (i + 1) + ' of ' + SCENES.length + ': ' + s.name;
  count.textContent = (i + 1) + ' of ' + SCENES.length;
  $('dTitle').textContent = 'Scene ' + (i + 1) + ' of ' + SCENES.length + ': ' + s.name;
  const c = s.cap;
  $('cap').innerHTML = '<p class="cap-tag">' + esc(c.tag) + '</p><p class="cap-line">' + esc(c.line) + '</p>' +
    (c.sub ? '<p class="cap-sub">' + esc(c.sub) + '</p>' : '') + (c.note ? '<p class="cap-note">' + esc(c.note) + '</p>' : '');
  $('dText').textContent = s.desc;
  [...dots.children].forEach((d, k) => { d.className = k === i ? 'on' : k < i ? 'done' : ''; if (k === i) d.setAttribute('aria-current', 'step'); else d.removeAttribute('aria-current'); });
  if (document.activeElement === backB && i === 0) nextB.focus();
  if (document.activeElement === nextB && i === SCENES.length - 1) backB.focus();
  backB.disabled = i === 0;
  nextB.disabled = i === SCENES.length - 1;
  if (mode === 'port') desc.scrollTop = 0;
}
function frameLoop(now) {
  const t = sceneTime(now);
  const fp = prev === null ? 1 : clamp01((now - fadeStart) / 1000 / FADE);
  SCENES.forEach((s, k) => { s.root.style.display = (k === cur || (k === prev && fp < 1)) ? 'block' : 'none'; });
  if (prev !== null && fp < 1) { const ps = SCENES[prev]; ps.root.style.opacity = 1 - fp; ps.root.style.zIndex = 1; ps.render(prevT + (now - fadeStart) / 1000); }
  else prev = null;
  const s = SCENES[cur];
  s.root.style.opacity = fp; s.root.style.zIndex = 2;
  s.render(Math.max(0, t));
  nextB.classList.toggle('ready', (t >= s.dur || still) && cur < SCENES.length - 1);
  requestAnimationFrame(frameLoop);
}
nextB.onclick = () => go(cur + 1);
backB.onclick = () => go(cur - 1);
$('replay').onclick = () => { prev = null; still = false; setPaused(false); start = performance.now(); };
$('pause').onclick = () => setPaused(!paused);

// full screen, hidden where the browser can't do it (such as Safari on iPhone)
const app = $('app');
const fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) && !!(app.requestFullscreen || app.webkitRequestFullscreen);
if (!fsOK) body.classList.add('no-fs');
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
$('full').onclick = () => {
  try {
    if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const r = (app.requestFullscreen || app.webkitRequestFullscreen).call(app); if (r && r.catch) r.catch(() => {}); }
  } catch (e) {}
};
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { $('full').setAttribute('aria-label', fsEl() ? 'Exit full screen' : 'Full screen'); fit(); }));

// keyboard
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const onButton = e.target.closest && e.target.closest('button, a');
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); go(cur + 1); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(cur - 1); }
  else if (k === ' ' || k === 'Spacebar') { if (!onButton) { e.preventDefault(); go(cur + 1); } }
  else if (k === 'Home') { e.preventDefault(); go(0); }
  else if (k === 'End') { e.preventDefault(); go(SCENES.length - 1); }
  else if (k === 'r' || k === 'R') $('replay').click();
  else if (k === 'p' || k === 'P') $('pause').click();
  else if ((k === 'f' || k === 'F') && fsOK) $('full').click();
  else if (k === 't' || k === 'T') setText(!textOn);
  else if (k === 'Escape' && textOn && mode === 'land') { setText(false); textB.focus(); }
});

// touch: swipe left/right, tap the right side for next and the far left for back (mouse clicks ignored)
let tp = null;
frame.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch') return; tp = { x: e.clientX, y: e.clientY, t: performance.now() }; });
frame.addEventListener('pointercancel', () => { tp = null; });
frame.addEventListener('pointerup', e => {
  if (e.pointerType !== 'touch' || !tp) return;
  const dx = e.clientX - tp.x, dy = e.clientY - tp.y, dt = performance.now() - tp.t; tp = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 800) { go(cur + (dx < 0 ? 1 : -1)); return; }
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 350) {
    const r = frame.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width;
    if (fx > 0.5) go(cur + 1); else if (fx < 0.25) go(cur - 1);
  }
});

// test hook: AA.go(i), AA.seek(seconds) freezes the current scene at a moment
window.AA = { go, seek(t) { setPaused(false); start = performance.now() - t * 1000; prev = null; setPaused(true); }, scenes: SCENES.length };

fit();
go(0);
requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
