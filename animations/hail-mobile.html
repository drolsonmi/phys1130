(function () {
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const eo = p => 1 - Math.pow(1 - p, 3);
  const ei = p => p * p * p;
  const eio = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const eob = (p, s) => { s = s == null ? 1.70158 : s; const q = p - 1; return 1 + (s + 1) * q * q * q + s * q * q; };
  const lerp = (a, b, p) => a + (b - a) * p;
  const rng = seed => { let a = seed >>> 0 || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };

<script>window.HAIL = {
  svg(n, r, grow) {

};</script>

    kit.stage.append(kit.h('<div class="ground">' +
      '<svg class="art" viewBox="0 0 1920 1080">' +
      '<g class="sl-l"><path class="ice-clear" d="M0 ' + (-R) + ' A' + R + ' ' + R + ' 0 0 0 0 ' + R + ' Z"/><path class="ice-edge" d="M0 ' + (-R) + ' A' + R + ' ' + R + ' 0 0 0 0 ' + R + ' Z"/></g>' +
      '<g transform="translate(' + SL.cx + ' ' + SL.cy + ')"><path class="ice-clear sl-d"/><path class="ice-edge sl-de"/><path class="sl-sh" style="fill:color-mix(in srgb, var(--main) 12%, transparent)"/></g>' +
      '<g class="sl-f">' + window.HAIL.svg(4, R) + '<circle class="ice-edge" r="' + R + '" style="stroke-width:4"/></g>' +
      '<line class="sl-cut" x1="' + SL.cx + '" y1="200" x2="' + SL.cx + '" y2="880" pathLength="1" style="stroke:var(--accent);stroke-width:8;stroke-linecap:round;stroke-dasharray:1 1"/>' +
      leader('sl-g0', 1372, 405, 1520, 330) + leader('sl-g1', 1353, 603, 1520, 700) + leader('sl-g2', SL.cx, SL.cy, SL.cx, 880) + '</svg>' +
      '<div class="lbl sl-t0" style="left:1535px;top:300px">Clear ice</div>' +
      '<div class="lbl sl-t1" style="left:1535px;top:672px">Cloudy ice</div>' +
      '<div class="lbl sl-t2" style="left:' + (SL.cx - 70) + 'px;top:892px;color:var(--accent)">Embryo</div>' +
      '<div class="words" style="left:130px;top:330px;width:620px"><h2 class="line sl-line">Slice it open</h2>' +
      '<p class="sub sl-sub">Each ring records one trip up and down through the cloud</p></div></div>'));
    const q = s => kit.stage.querySelector(s);
    this.lh = q('.sl-l'); this.d = q('.sl-d'); this.de = q('.sl-de'); this.sh = q('.sl-sh'); this.f = q('.sl-f');
    this.cut = q('.sl-cut').style;
    this.g = [0, 1, 2].map(i => q('.sl-g' + i)); this.gl = this.g.map(g => g.querySelector('line').style);
    this.tx = [0, 1, 2].map(i => q('.sl-t' + i).style);
    this.line = q('.sl-line'); this.sub = q('.sl-sub').style;
  },
  render(t) {
    const R = SL.R;
    TextFx.fadeFromRight(this.line, t, -0.4);
    this.sub.opacity = eo(seg(t, 3.7, 4.3));
    const pc = eio(seg(t, 0.5, 1.0));
    this.cut.strokeDashoffset = 1 - pc; this.cut.opacity = 1 - eo(seg(t, 1.1, 1.4));
    const pd = seg(t, 1.2, 2.1);
    this.lh.setAttribute('transform', 'translate(' + (SL.cx - 30 * eo(pd)) + ' ' + (SL.cy + 820 * ei(pd)) + ') rotate(' + (-14 * ei(pd)) + ')');
    this.lh.style.opacity = pd < 1 ? 1 : 0;
    const ph = eio(seg(t, 2.0, 3.6)) * Math.PI / 2;
    const rx = Math.max(0.01, R * Math.cos(ph)), fx = Math.max(0.001, Math.sin(ph));
    const dd = 'M0 ' + (-R) + ' A' + rx.toFixed(2) + ' ' + R + ' 0 0 1 0 ' + R + ' Z';
    this.d.setAttribute('d', dd); this.de.setAttribute('d', dd);
    this.sh.setAttribute('d', 'M0 ' + (-R) + ' A' + (rx * 0.45).toFixed(2) + ' ' + R + ' 0 0 1 0 ' + R + ' A' + rx.toFixed(2) + ' ' + R + ' 0 0 0 0 ' + (-R) + ' Z');
    this.f.setAttribute('transform', 'translate(' + SL.cx + ' ' + SL.cy + ') scale(' + fx + ' 1)');
    this.f.style.opacity = ph > 0.02 ? 1 : 0;
    for (let i = 0; i < 3; i++) {
      const a = 4.2 + i * 0.8, p = eo(seg(t, a, a + 0.4));
      this.gl[i].strokeDashoffset = 1 - p; this.g[i].style.opacity = p > 0 ? 1 : 0;

});
})();</script>
<script>(function(){
const { seg, eo, eob, lerp, TextFx } = kit;
kit.scene('end', {
  init(kit) {
    kit.stage.append(kit.h('<div class="ground">' +
      '<svg class="art" viewBox="0 0 1920 1080"><g class="end-st">' + window.HAIL.svg(4, 190) + '</g>' +
      '<line class="end-ul" x1="760" y1="448" x2="1060" y2="448" pathLength="1" style="stroke:var(--accent);stroke-width:10;stroke-linecap:round;stroke-dasharray:1 1"/></svg>' +
      '<div class="words" style="left:760px;top:270px;width:1040px"><h2 class="big end-line" style="font-size:160px">Hail</h2>' +
      '<p class="sub end-s1" style="margin-top:52px;font-size:42px">Hail forms one layer at a time.</p>' +
      '<p class="sub end-s2" style="font-size:42px">Hail grows until the updraft can no longer hold it up.</p></div></div>'));
    const q = s => kit.stage.querySelector(s);
    this.st = q('.end-st'); this.ul = q('.end-ul').style; this.line = q('.end-line');
    this.s = [q('.end-s1').style, q('.end-s2').style];
  },
  render(t) {
    const p = seg(t, 0, 0.7);
    const s = (p <= 0 ? 0.001 : eob(p, 1.7)) * (1 + 0.012 * Math.sin(t * 2));
    this.st.setAttribute('transform', 'translate(440 540) rotate(' + t * 5 + ') scale(' + s + ')');
    TextFx.fadeFromRight(this.line, t, 0.2);
    this.ul.strokeDashoffset = 1 - eo(seg(t, 0.7, 1.1));
    this.s.forEach((st, i) => { const a = 0.9 + i * 0.6, q = eo(seg(t, a, a + 0.5)); st.opacity = q; st.transform = 'translateX(' + lerp(26, 0, q) + 'px)'; });

<script>
(function () {
  const ORDER = [["title", "How hail forms", 5], ["embryo", "The embryo", 7], ["cycle", "Up and down", 33.5], ["heavy", "Too heavy to lift", 8], ["hard", "Hail or graupel", 6], ["slice", "Slice it open", 9], ["end", "Hail", 4]];
  const TEXT = {
    title: '<p>This is the title scene for Introduction to Meteorology. The title reads “How hail forms,” with the subtitle “A hailstone grows one layer at a time.”</p>' +
      '<p>A tall thunderstorm cloud with a wide, flat top rises on the right, and small hailstones fall from the bottom of the cloud.</p>',
    embryo: '<p>Every hailstone starts as an embryo: a small particle that water can freeze around.</p>' +
      '<p>Three panels show possible embryos: graupel, a frozen raindrop, and particles (including dust and insects). A ring of ice then forms around each one, showing where ice builds up around the embryo.</p>',
    cycle: '<p>This is a cut-away view of a storm cloud. A dashed line splits it in two: the freezing layer is in the upper part of the cloud, and supercooled water is in the lower part. An orange updraft arrow points up through the middle of the cloud, and a downdraft arrow points down on its right side.</p>' +
      '<p>The hailstone travels in a loop between the two parts of the cloud. A close-up on the right shows it growing, and a box lists each step as it happens. Each layer forms in three steps:</p>' +
      '<ol><li>It falls into the supercooled water and grows, picking up a coat of water.</li><li>It is caught by the updraft and lifted back to the freezing layer.</li><li>The collected water freezes into a new layer of ice.</li></ol>' +
      '<p>The loop repeats four times, and the close-up gains a new ring of ice each time. After layer 4, the box adds: “This process continues until the stone is too heavy.” The hailstone keeps circling until you go to the next scene.</p>',
    heavy: '<p>The hailstone is now too heavy to lift. The box lists what happens:</p>' +
      '<ol><li>It falls through the cloud again.</li><li>The updraft can no longer lift the hailstone, so it rises only a little as it drifts toward the downdraft.</li><li>The hailstone falls as it is caught by the downdraft.</li><li>It falls out of the cloud to the ground as hail.</li></ol>',
    hard: '<p>Hail or graupel? Tap it. A small hammer taps each one as it sits on a flat surface.</p>' +
      '<p>On the left is hail: solid, layered ice. It is hard and holds firm, so the hammer bounces off and the hailstone stays whole.</p>' +
      '<p>On the right is graupel: soft, airy rime. It is brittle, so it crunches into small pieces. Tapping it is one way to tell hail and graupel apart.</p>',
    slice: '<p>The hailstone is cut straight down the middle. One half drops away, and the other half turns to face you so you can see inside.</p>' +
      '<p>Inside are rings of ice around an orange embryo at the center. The rings alternate between clear ice and cloudy ice. Each ring records one trip up and down through the cloud.</p>',
    end: '<p>Hail forms one layer at a time. Hail grows until the updraft can no longer hold it up.</p>' +
      '<p>A hailstone with four rings of ice around its embryo is shown beside these words.</p>'
  };
  const $ = id => document.getElementById(id);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const defs = window.__defs, scaler = $('scaler'), frame = $('frame'), view = $('view'), body = document.body;
  const scenes = ORDER.map(([id, name, dur]) => {
    const el = document.createElement('div'); el.className = 'stage'; scaler.appendChild(el);
    window.kit.stage = el; const def = defs[id]; def.init.call(def, window.kit);
    return { id, name, dur, el, def };
  });
  const N = scenes.length;
  scenes.forEach(() => $('dots').appendChild(document.createElement('i')));
  const mqLand = matchMedia('(orientation: landscape) and (max-height: 560px)');
  const mqPort = matchMedia('(orientation: portrait) and (max-width: 640px)');
  const mqRM = matchMedia('(prefers-reduced-motion: reduce)');

  // ----- clock -----
  let cur = 0, playing = true, startAt = performance.now(), heldT = 0, dirty = true;
  const sceneT = () => playing ? (performance.now() - startAt) / 1000 : heldT;
  function setPlaying(on) {
    if (on && !playing) { startAt = performance.now() - heldT * 1000; playing = true; }
    else if (!on && playing) { heldT = sceneT(); playing = false; }
    const b = $('pause');
    b.setAttribute('aria-label', playing ? 'Pause animation' : 'Play animation');
    b.querySelector('.t').textContent = playing ? 'Pause' : 'Play';
    b.querySelector('.ic-pause').style.display = playing ? '' : 'none';
    b.querySelector('.ic-play').style.display = playing ? 'none' : '';
    dirty = true;
  }

  // ----- scene changes -----
  const P = 6.5, A = 0.5, g = x => x - A * Math.sin(2 * Math.PI * x) / (2 * Math.PI);
  const inv = v => { let a = 0, b = 1; for (let i = 0; i < 40; i++) { const m = (a + b) / 2; if (g(m) < v) a = m; else b = m; } return (a + b) / 2; };
  const XF = inv(0.375);
  function go(i, fromUser) {
    i = clamp(i, 0, N - 1);
    const none = { skip: 0, wait: 0, u0: 0 };
    if (scenes[cur].id === 'cycle' && scenes[i].id === 'heavy' && !mqRM.matches) {
      const tc = sceneT(), s = (tc - 1) / P, u = s - Math.floor(s);
      window.HV_ENTRY = tc < 1 ? none : (u < XF ? { skip: u * P, wait: 0, u0: 0 } : { skip: 0, wait: (1 - u) * P, u0: u });
    } else window.HV_ENTRY = none;
    const changed = i !== cur || !fromUser;
    scenes[cur].el.classList.remove('on'); cur = i; scenes[cur].el.classList.add('on');
    if (mqRM.matches) { playing = false; heldT = scenes[cur].dur; setPlaying(false); }
    else { playing = false; heldT = 0; setPlaying(true); }
    const sc = scenes[cur];
    $('where').innerHTML = '<b>' + sc.name + '</b>&nbsp;&nbsp;' + (cur + 1) + ' of ' + N;
    $('counter').textContent = (cur + 1) + ' of ' + N;
    [...$('dots').children].forEach((d, k) => d.classList.toggle('on', k === cur));
    $('back').setAttribute('aria-disabled', cur === 0 ? 'true' : 'false');
    $('next').setAttribute('aria-disabled', cur === N - 1 ? 'true' : 'false');
    if (changed) {
      $('descBody').innerHTML = '<h2>' + sc.name + '</h2><p class="count">Scene ' + (cur + 1) + ' of ' + N + '</p>' + TEXT[sc.id];
      $('desc').scrollTop = 0;
    }
    dirty = true;
  }
  function replay() {
    window.HV_ENTRY = { skip: 0, wait: 0, u0: 0 };
    playing = false; heldT = 0; setPlaying(true);
  }

  // ----- text panel -----
  let textOn = false;
  try { textOn = localStorage.getItem('hailText') === '1'; } catch (e) {}
  function setText(on, save) {
    textOn = on; body.classList.toggle('text-on', on);
    $('textBtn').setAttribute('aria-pressed', on ? 'true' : 'false');
    $('close').hidden = !on;
    if (save) { try { localStorage.setItem('hailText', on ? '1' : '0'); } catch (e) {} }
    requestAnimationFrame(fit);
  }

  // ----- layout -----
  function fit() {
    let w, hh;
    if (mqPort.matches) { w = view.clientWidth - parseFloat(getComputedStyle(view).paddingLeft) - parseFloat(getComputedStyle(view).paddingRight); hh = w * 9 / 16; }
    else {
      const cs = getComputedStyle(view);
      const aw = view.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const ah = view.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      const s0 = Math.max(0.05, Math.min(aw / 1920, ah / 1080)); w = 1920 * s0; hh = 1080 * s0;
    }
    w = Math.max(1, Math.floor(w)); hh = Math.max(1, Math.floor(hh));
    const s = w / 1920;
    frame.style.width = w + 'px'; frame.style.height = hh + 'px';
    scaler.style.transform = 'scale(' + s + ')';
    const big = s < 0.55;
    window.BIG = big; scaler.classList.toggle('big', big);
    dirty = true;
  }
  new ResizeObserver(fit).observe(view);
  addEventListener('resize', fit);
  [mqLand, mqPort].forEach(m => m.addEventListener && m.addEventListener('change', () => requestAnimationFrame(fit)));

  // ----- render loop -----
  let lastT = -1;
  function tick() {
    const t = sceneT();
    if (dirty || playing || t !== lastT) {
      const sc = scenes[cur];
      try { sc.def.render.call(sc.def, t); } catch (e) { console.error(e); }
      lastT = t; dirty = false;
    }
    requestAnimationFrame(tick);
  }

  // ----- full screen -----
  const de = document.documentElement;
  const fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) && !!(de.requestFullscreen || de.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  if (!fsOK) $('full').hidden = true;
  function toggleFull() {
    if (!fsOK) return;
    if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const r = (de.requestFullscreen || de.webkitRequestFullscreen).call(de); if (r && r.catch) r.catch(() => {}); }
  }
  const fsLabel = () => { const on = !!fsEl(); $('full').setAttribute('aria-label', on ? 'Exit full screen' : 'Full screen'); $('full').querySelector('.t').textContent = on ? 'Exit full screen' : 'Full screen'; };
  document.addEventListener('fullscreenchange', fsLabel); document.addEventListener('webkitfullscreenchange', fsLabel);

  // ----- buttons -----
  const next = () => { if (cur < N - 1) go(cur + 1, true); };
  const back = () => { if (cur > 0) go(cur - 1, true); };
  $('next').addEventListener('click', next);
  $('back').addEventListener('click', back);
  $('replay').addEventListener('click', replay);
  $('pause').addEventListener('click', () => setPlaying(!playing));
  $('full').addEventListener('click', toggleFull);
  $('textBtn').addEventListener('click', () => { const on = !textOn; setText(on, true); if (on && mqLand.matches) $('close').focus(); });
  $('close').addEventListener('click', () => { setText(false, true); $('textBtn').focus(); });
  $('skip').addEventListener('click', e => { e.preventDefault(); if (!textOn && !mqPort.matches) setText(true, false); $('desc').focus(); });

  // ----- keyboard -----
  addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const tgt = e.target;
    const onControl = tgt && tgt.closest && tgt.closest('button, a, input, textarea, select, [contenteditable="true"]');
    const inDesc = tgt && tgt.closest && tgt.closest('#desc');
    const k = e.key;
    let done = true;
    if (k === ' ' || k === 'Spacebar') { if (onControl || inDesc) return; next(); }
    else if (k === 'ArrowRight' || k === 'PageDown') next();
    else if (k === 'ArrowLeft' || k === 'PageUp') back();
    else if (k === 'Home') go(0, true);
    else if (k === 'End') go(N - 1, true);
    else if (k === 'r' || k === 'R') replay();
    else if (k === 'p' || k === 'P') setPlaying(!playing);
    else if (k === 't' || k === 'T') { if (!mqPort.matches) setText(!textOn, true); }
    else if (k === 'f' || k === 'F') toggleFull();
    else if (k === 'Escape' && textOn && mqLand.matches) { setText(false, true); $('textBtn').focus(); }
    else done = false;
    if (done) e.preventDefault();
  });

  // ----- touch gestures (touch only; mouse clicks are ignored) -----
  let tp = null;
  frame.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch' || !e.isPrimary) return; tp = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now() }; });
  frame.addEventListener('pointercancel', () => { tp = null; });
  frame.addEventListener('pointerup', e => {
    if (!tp || e.pointerId !== tp.id) return;
    const dx = e.clientX - tp.x, dy = e.clientY - tp.y, dt = performance.now() - tp.t, sx = tp.x; tp = null;
    if (Math.abs(dx) >= 45 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 900) { if (dx < 0) next(); else back(); return; }
    if (dt < 350 && Math.hypot(dx, dy) < 12) {
      const r = frame.getBoundingClientRect(), fx = (sx - r.left) / r.width;
      if (fx >= 0.5) next(); else if (fx <= 0.25) back();
    }
  });

  setText(textOn, false);
  fit(); go(0, false); requestAnimationFrame(tick);
})();
</script>
