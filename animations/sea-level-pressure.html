<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sea Level Pressure</title>
<meta name="description" content="An animated, scene-by-scene explanation of how station pressures are corrected to sea level pressure and turned into a surface pressure map.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&family=Zilla+Slab:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --page: #e9edf4; --bar: #ffffff; --ink: #25282b; --muted: #5d6470; --edge: #cfd6e2;
  --brand: #1e376c; --accent: #f47920; --btn: #f1f4f9; --btn-ink: #1e376c; --focus: #c2410c;
  color-scheme: light;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0e1320; --bar: #171e2e; --ink: #e8ecf3; --muted: #a9b2c1; --edge: #2c3650;
    --brand: #a9c0ef; --btn: #222b40; --btn-ink: #dbe5fa; --focus: #ffb27a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0e1320; --bar: #171e2e; --ink: #e8ecf3; --muted: #a9b2c1; --edge: #2c3650;
  --brand: #a9c0ef; --btn: #222b40; --btn-ink: #dbe5fa; --focus: #ffb27a; color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; background: var(--page); overflow-x: hidden; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100%; background: var(--page); color: var(--ink); font-family: "Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -100px; z-index: 50; background: var(--bar); color: var(--brand); font-weight: 700; padding: 12px 16px; border-radius: 8px; border: 2px solid var(--brand); }
.skip:focus { top: calc(12px + env(safe-area-inset-top, 0px)); outline: 3px solid var(--focus); outline-offset: 2px; }

#app { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; min-height: 100vh; background: var(--page); }
#main { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; }
#frame { width: min(100%, calc((100vh - 140px) * 16 / 9)); aspect-ratio: 16 / 9; position: relative; overflow: hidden; border-radius: 10px; background: #ffffff; box-shadow: 0 1px 3px rgba(0,0,0,.12); touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#app:fullscreen #frame { width: min(100%, calc((100vh - 100px) * 16 / 9)); }
#turn { display: none; }

/* ---------- the animation (fixed light picture, like the other 1130 animations) ---------- */
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #ffffff;
  --ground:#ffffff; --main:#1e376c; --second:#25282b; --accent:#f47920; --stn:#c8322a; --slp:#1667c4;
  color: var(--second); font-family: "Nunito Sans", system-ui, sans-serif; }
.layer { position: absolute; inset: 0; display: none; }
.ground { position: absolute; inset: 0; background: var(--ground); }
.words { position: absolute; margin: 0; display: flex; flex-direction: column; gap: 22px; }
.words > * { margin: 0; }
.line { font-family: "Zilla Slab", Georgia, serif; font-size: 84px; line-height: 1.04; font-weight: 700; color: var(--main); }
.line .w { display: inline-block; white-space: pre; }
.sub { font-size: 34px; line-height: 1.4; color: color-mix(in srgb, var(--second) 82%, var(--ground)); }
.sub b.r { color: var(--stn); } .sub b.b { color: var(--slp); }
.tag { font-size: 24px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.rule { width: 96px; height: 4px; background: var(--accent); border-radius: 2px; }
.art { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.label { font-family: "Nunito Sans", system-ui, sans-serif; font-size: 28px; font-weight: 700; fill: var(--main); }
.val { font-family: "Nunito Sans", system-ui, sans-serif; font-size: 40px; font-weight: 700; }
.halo { stroke: #ffffff; stroke-width: 8px; paint-order: stroke; stroke-linejoin: round; }
.lead { fill: none; stroke: var(--main); stroke-width: 2.5; stroke-dasharray: 6 6; }
.hut { fill: #ffffff; stroke: var(--main); stroke-width: 4; stroke-linejoin: round; }
.card { position: absolute; border-radius: 16px; background: color-mix(in srgb, var(--main) 6%, var(--ground)); border: 2px solid color-mix(in srgb, var(--main) 18%, var(--ground)); }
.note { font-size: 24px; color: color-mix(in srgb, var(--second) 60%, var(--ground)); }
#stage.big .label { font-size: var(--lab); }
#stage.big .val { font-size: var(--val); }
#stage.big .sub { font-size: var(--sub); }
#stage.big .tag { font-size: var(--tag); }
#stage.big .note { font-size: var(--note); }
#stage.big .rc { top: 400px !important; height: 580px !important; padding: 34px 26px !important; gap: 16px !important; }
#stage.big .ri { width: 200px; height: 200px; }
/* upright phone: the picture shows the right part of the scene; its text is shown below */
#stage.port .ground > .words { display: none; }
#stage.port .rc { left: 830px !important; width: 1060px !important; height: 320px !important; flex-direction: row !important; text-align: left !important; padding: 0 40px !important; gap: 40px !important; }
#stage.port .rc0 { top: 30px !important; } #stage.port .rc1 { top: 380px !important; } #stage.port .rc2 { top: 730px !important; }
#stage.port .rc .words { align-items: flex-start !important; gap: 14px !important; }
#stage.port .ri { width: 220px; height: 220px; }

/* ---------- scene text ---------- */
#desc { width: min(100%, calc((100vh - 140px) * 16 / 9)); background: var(--bar); border: 1px solid var(--edge); border-radius: 10px; padding: 16px 20px 18px; }
#desc:focus { outline: 3px solid var(--focus); outline-offset: 2px; }
.dhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
#dTitle { margin: 0 0 6px; font-size: 18px; line-height: 1.3; color: var(--brand); }
#dText { margin: 0; font-size: 17px; line-height: 1.6; max-width: 72ch; }
#closeText { display: none; }
#cap { display: none; }
.cap-tag { margin: 0 0 2px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.cap-line { margin: 0 0 6px; font-family: "Zilla Slab", Georgia, serif; font-size: 24px; line-height: 1.15; color: var(--brand); }
.cap-sub { margin: 0 0 4px; font-size: 16px; line-height: 1.5; }
.cap-box { margin: 10px 0 4px; padding: 10px 12px; border-radius: 8px; background: var(--bar); border: 1px solid var(--edge); }
.cap-note { margin: 0; font-size: 14px; color: var(--muted); }

/* ---------- controls ---------- */
#bar { width: min(100%, calc((100vh - 140px) * 16 / 9)); display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: var(--bar); border: 1px solid var(--edge); border-radius: 10px; padding: 6px 8px; }
#app:fullscreen #bar, #app:fullscreen #desc { width: min(100%, calc((100vh - 100px) * 16 / 9)); }
button { font: inherit; font-weight: 700; font-size: 15px; color: var(--btn-ink); background: var(--btn); border: 1px solid var(--edge);
  border-radius: 8px; min-height: 44px; min-width: 44px; padding: 0 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; touch-action: manipulation; }
button:hover { border-color: var(--brand); }
button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
button svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#next { background: var(--brand); color: var(--bar); border-color: var(--brand); padding: 0 20px; }
#next.ready { background: var(--accent); border-color: var(--accent); color: #25282b; }
#where { flex: 1; min-width: 400px; display: flex; flex-direction: column; gap: 0; padding: 0 4px; }
#title { font-size: 15px; font-weight: 700; color: var(--ink); padding-left: 9px; }
#dots { display: flex; flex-wrap: nowrap; }
#wtop { display: flex; align-items: baseline; gap: 12px; padding-right: 4px; }
#wtop .hint { margin-left: auto; }
#dots button { min-height: 44px; height: 44px; width: 38px; min-width: 38px; padding: 0; border: 0; background: transparent; border-radius: 6px; }
#dots button::before { content: ""; width: 24px; height: 8px; border-radius: 4px; background: var(--edge); }
#dots button.on::before { background: var(--brand); }
#dots button.done::before { background: color-mix(in srgb, var(--brand) 45%, var(--edge)); }
#count { display: none; font-size: 14px; font-weight: 700; color: var(--ink); text-align: center; white-space: nowrap; }
.hint { font-size: 13px; color: var(--muted); }
#textB[aria-expanded="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.no-fs #full { display: none !important; }

/* ---------- phone held sideways ---------- */
body.land #app { flex-direction: row; align-items: stretch; justify-content: center; gap: 8px; min-height: 0;
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  padding: 6px max(6px, env(safe-area-inset-right, 0px)) 6px max(6px, env(safe-area-inset-left, 0px)); }
body.land #main { flex: 1; min-width: 0; justify-content: center; }
body.land #frame { width: min(100%, calc((100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 12px) * 16 / 9));
  width: min(100%, calc((100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 12px) * 16 / 9)); border-radius: 8px; }
body.land #bar { width: 76px; flex: none; flex-direction: column; flex-wrap: nowrap; align-items: stretch; padding: 6px; gap: 5px; overflow-y: auto; }
body.land #bar .t, body.land #where, body.land .hint { display: none; }
body.land #count { display: block; order: 0; padding: 4px 0; }
body.land #replay { order: 1; } body.land #pause { order: 2; } body.land #full { order: 3; } body.land #textB { order: 4; }
body.land #spacer { order: 5; flex: 1; min-height: 4px; }
body.land #back { order: 6; } body.land #next { order: 7; min-height: 64px; padding: 0; }
body.land #next svg { width: 28px; height: 28px; }
body.land button { padding: 0; }
body.land #desc { position: fixed; z-index: 20; width: auto; overflow-y: auto;
  top: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-height: calc(100% - 20px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  left: calc(max(6px, env(safe-area-inset-left, 0px)) + 10px); right: calc(max(6px, env(safe-area-inset-right, 0px)) + 96px);
  box-shadow: 0 6px 24px rgba(0,0,0,.25); padding: 12px 16px; }
body.land #closeText { display: inline-flex; flex: none; padding: 0 16px; }
body.land #dText { font-size: 16px; line-height: 1.55; }

/* ---------- phone held upright ---------- */
body.port #app { justify-content: flex-start; align-items: stretch; gap: 0; padding: 0; min-height: 0;
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
body.port #main { flex: none; padding: 0 env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); }
body.port #frame { width: 100%; aspect-ratio: 1120 / 1080; border-radius: 0; box-shadow: none; }
body.port #turn { display: block; margin: 0; width: 100%; padding: 6px 16px; font-size: 14px; color: var(--muted); text-align: center; border-bottom: 1px solid var(--edge); }
body.port #desc { width: auto; flex: 1; min-height: 0; overflow-y: auto; border: 0; border-radius: 0; background: var(--page); padding: 12px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
body.port #desc.sr-only { position: static !important; width: auto; height: auto; margin: 0; overflow-y: auto; clip: auto; white-space: normal; }
body.port #cap { display: block; margin: 4px 0 12px; padding-bottom: 12px; border-bottom: 1px solid var(--edge); }
body.port #dText { font-size: 16px; }
body.port #bar { width: auto; flex: none; flex-wrap: nowrap; border: 0; border-top: 1px solid var(--edge); border-radius: 0; gap: 8px;
  padding: 8px max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px)); }
body.port #where, body.port .hint, body.port #textB { display: none; }
body.port #replay, body.port #pause, body.port #full { padding: 0; }
body.port #replay .t, body.port #pause .t { display: none; }
body.port #back, body.port #next { flex: 1; min-height: 52px; font-size: 17px; }
body.port #back { order: 0; } body.port #replay { order: 1; } body.port #pause { order: 2; } body.port #full { order: 3; } body.port #next { order: 4; }
body.port #spacer { display: none; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<body>


<a class="skip" href="#desc" id="skip">Skip to scene text</a>
<div id="app">
  <div id="main">
    <div id="frame" aria-hidden="true"><div id="stage"></div></div>
    <p id="turn">Turn your phone sideways for a bigger picture.</p>
  </div>
  <section id="desc" tabindex="-1" aria-labelledby="dTitle" class="sr-only">
    <div class="dhead">
      <div id="live" aria-live="polite" aria-atomic="true"><h2 id="dTitle"></h2><div id="cap" aria-hidden="true"></div><p id="dText"></p></div>
      <button id="closeText" aria-label="Close scene text">Close</button>
    </div>
  </section>
  <nav id="bar" aria-label="Animation controls">
    <button id="back" aria-label="Previous scene"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span class="t">Back</span></button>
    <button id="replay" aria-label="Replay this scene"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg><span class="t">Replay</span></button>
    <button id="pause" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true" id="pauseIco"><path d="M8 5v14M16 5v14"/></svg><span class="t" id="pauseTxt">Pause</span></button>
    <div id="where"><div id="wtop"><div id="title" aria-hidden="true"></div><span class="hint" aria-hidden="true">Arrow keys or Space</span></div><div id="dots" role="group" aria-label="Scenes"></div></div>
    <div id="count" aria-hidden="true"></div>
    <button id="full" aria-label="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button id="textB" aria-label="Show scene text" aria-controls="desc" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 10h14M5 14h10M5 18h7"/></svg><span class="t">Text</span></button>
    <div id="spacer" aria-hidden="true"></div>
    <button id="next" aria-label="Next scene"><span class="t">Next</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </nav>
</div>

<script>
(function () {
document.documentElement.lang = 'en';
// ---------- helpers ----------
const clamp01 = x => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const sq = v => v * v;
const fmt = n => n.toLocaleString('en-US');
const NS = 'http://www.w3.org/2000/svg';
function h(html) { const tp = document.createElement('template'); tp.innerHTML = html.trim(); return tp.content.firstElementChild; }
function fadeFromRight(el, t, t0) {
  if (!el._w) {
    const words = el.textContent.split(' ');
    el.textContent = '';
    el._w = words.map((w, i) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w + (i < words.length - 1 ? ' ' : ''); el.appendChild(s); return s; });
  }
  el._w.forEach((s, i) => { const p = eo(seg(t, t0 + i * .11, t0 + i * .11 + .5)); s.style.opacity = p; s.style.transform = 'translateX(' + ((1 - p) * 26).toFixed(1) + 'px)'; });
}
function subIn(st, t, a) { const p = eo(seg(t, a, a + .6)); st.opacity = p; st.transform = 'translateX(' + lerp(26, 0, p) + 'px)'; }
const nb = x => x && x.replace(/(\d) (m|mb)\b/g, '$1\u00a0$2');
const textBlock = (top, tag, line, sub) =>
  '<div class="words" style="left:140px;top:' + top + 'px;width:640px">' +
  '<p class="tag">' + tag + '</p><h2 class="line">' + nb(line) + '</h2>' + (sub ? '<p class="sub">' + nb(sub) + '</p>' : '') + '</div>';
function textRefs(self, root) { self.tagS = root.querySelector('.words .tag').style; self.line = root.querySelector('.words .line'); const s = root.querySelector('.words .sub'); self.subS = s && s.style; }
function textRender(self, t, subAt) { self.tagS.opacity = eo(seg(t, 0.2, 0.7)); fadeFromRight(self.line, t, 0.4); if (self.subS) subIn(self.subS, t, subAt); }
const op = (el, v) => { el.style.opacity = v; };
let SCALE = 0.6;   // current stage scale, used for canvas text size

// ================= 2D cross-section: two stations =================
const SLY = 820, K2 = 0.3, XA = 1150, XB = 1580;
const A2 = { z: 50, P: 1008 }, B2 = { z: 1500, P: 866 };
A2.S = A2.P + A2.z / 10; B2.S = B2.P + B2.z / 10;
function z2(x) {
  if (x < 1010) return -260 * Math.min(1, (1010 - x) / 120);
  const b = 30 + 0.12 * (x - 1010), bb = 30 + 0.12 * (XB - 1010);
  return b + (1500 - bb) * Math.exp(-sq((x - XB) / 170));
}
const y2 = x => SLY - z2(x) * K2;
const YA = SLY - A2.z * K2, YB = SLY - B2.z * K2;
function hut(x, y, cls) {
  return '<g class="' + (cls || '') + '" transform="translate(' + x + ' ' + y + ')"><rect class="hut" x="-20" y="-32" width="40" height="32"/>' +
    '<polygon class="hut" points="-27,-32 0,-54 27,-32"/><rect x="-6" y="-18" width="12" height="18" fill="#1e376c"/></g>';
}
function crossSVG(extraBack, extraFront) {
  let d = 'M840 1080 L840 ' + y2(840).toFixed(1);
  for (let x = 846; x <= 1920; x += 6) d += ' L' + x + ' ' + y2(x).toFixed(1);
  d += ' L1920 1080 Z';
  // air: more dots near the ground, fewer higher up
  let dots = '', q = 5; const r = () => { q = (q * 16807) % 2147483647; return (q - 1) / 2147483646; };
  for (let i = 0; i < 420; i++) {
    const x = 860 + r() * 1040, f = r(), y = 140 + (1 - Math.pow(f, 1.8)) * 0 + Math.pow(f, 0.55) * 700;
    if (y < y2(x) - 10) dots += '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="3.2"/>';
  }
  return '<svg class="art" viewBox="0 0 1920 1080">' +
    '<g class="air" fill="#c9d3e6">' + dots + '</g>' + (extraBack || '') +
    '<path d="' + d + '" fill="#e6dccb" stroke="#1e376c" stroke-width="3"/>' +
    '<rect x="840" y="' + SLY + '" width="172" height="260" fill="#9fc4ea" opacity=".85"/>' +
    '<line class="slline" x1="840" x2="1920" y1="' + SLY + '" y2="' + SLY + '" stroke="#1e376c" stroke-width="3" stroke-dasharray="12 9"/>' +
    '<text class="label halo" x="860" y="' + (SLY - 14) + '">Sea level</text>' +
    hut(XA, YA) + hut(XB, YB) + (extraFront || '') + '</svg>';
}
// label stack above a station: name, altitude, pressure (anchored at its bottom)
function stack(x, yb, name, alt, P, cls) {
  return '<text class="' + cls + '" x="' + x + '" y="' + yb + '" text-anchor="middle">' +
    '<tspan class="label" x="' + x + '" dy="-2.5em" style="font-size:inherit">' + name + '</tspan>' +
    '<tspan x="' + x + '" dy="1.15em" style="font-weight:400">Altitude ' + alt + '</tspan>' +
    '<tspan class="pv" x="' + x + '" dy="1.35em" fill="#c8322a" style="font-weight:700">' + P + '</tspan></text>';
}
const stackA = (c) => stack(XA, YA - 72, 'Station A', '50 m', A2.P + ' mb', 'label halo ' + (c || 'sa'));
const stackB = (c) => stack(XB, YB - 72, 'Station B', '1,500 m', B2.P + ' mb', 'label halo ' + (c || 'sb'));

// ================= 3D terrain =================
const coastX = y => 95 + 18 * Math.sin(y / 60) + 10 * Math.sin(y / 23);
const g2 = (x, y, cx, cy, sx, sy) => Math.exp(-sq((x - cx) / sx) - sq((y - cy) / sy));
function elevXY(x, y) {
  const xc = coastX(y);
  if (x < xc) return -1;
  const u = Math.min(1, (x - xc) / 520);
  let z = 40 + 1350 * Math.pow(u, 1.15);
  const xr = 300 + 25 * Math.sin(y / 90);
  z += 1900 * Math.exp(-sq((x - xr) / 46)) * (0.78 + 0.22 * Math.sin(y / 55 + 1));
  z -= 520 * g2(x, y, 465, 290, 55, 160);
  z += 650 * g2(x, y, 640, 120, 45, 70);
  z *= Math.min(1, (x - xc) / 25 + 0.15);
  return Math.max(0, z);

}

// ---------- pencils drawing the isobars on the flat map ----------
const PENCIL = (function () {
  // isobars as connected lines (marching squares, then chained), in map pixels
  const NU = 176, NV = 120;
  function lines(level) {
    const v = [];
    for (let j = 0; j <= NV; j++) { v[j] = []; for (let i = 0; i <= NU; i++) v[j][i] = slpUV(i / NU, j / NV) - level; }
    const pt = k => { const [tp, i, j] = k.split(','), I = +i, J = +j;
      if (tp === 'h') { const a = v[J][I], b = v[J][I + 1], f = a / (a - b); return [(I + f) / NU, J / NV]; }
      const a = v[J][I], b = v[J + 1][I], f = a / (a - b); return [I / NU, (J + f) / NV]; };
    const segs = [];
    for (let j = 0; j < NV; j++) for (let i = 0; i < NU; i++) {
      const a = v[j][i] > 0, b = v[j][i + 1] > 0, c = v[j + 1][i + 1] > 0, d = v[j + 1][i] > 0;
      const Tk = 'h,' + i + ',' + j, Bk = 'h,' + i + ',' + (j + 1), Lk = 'v,' + i + ',' + j, Rk = 'v,' + (i + 1) + ',' + j, e = [];
      if (a !== b) e.push(Tk); if (b !== c) e.push(Rk); if (c !== d) e.push(Bk); if (d !== a) e.push(Lk);
      if (e.length === 2) segs.push(e);
      else if (e.length === 4) { const ctr = (v[j][i] + v[j][i + 1] + v[j + 1][i + 1] + v[j + 1][i]) > 0; if (ctr === a) { segs.push([Tk, Rk]); segs.push([Bk, Lk]); } else { segs.push([Tk, Lk]); segs.push([Rk, Bk]); } }
    }
    const adj = new Map(); segs.forEach((sg, n) => sg.forEach(k => { if (!adj.has(k)) adj.set(k, []); adj.get(k).push(n); }));
    const used = segs.map(() => false), out = [];
    const walk = (st, from) => { const o = []; let k = from, cur = st;
      while (true) { used[cur] = true; const sg = segs[cur], nk = sg[0] === k ? sg[1] : sg[0]; o.push(nk); const nx = (adj.get(nk) || []).find(n => !used[n]); if (nx === undefined) break; cur = nx; k = nk; }
      return o; };
    for (let n = 0; n < segs.length; n++) { if (used[n]) continue; const f = walk(n, segs[n][0]); used[n] = false; const bk = walk(n, segs[n][1]); out.push(bk.reverse().concat(f).map(pt)); }
    return out;
  }
  const SPEED = 520, MOVE = 0.5, START = 3.2, PARK = [[1900, 1000], [880, 40]];
  const jobs = [];
  T.FIELDS.B.levels.forEach((L, li) => {
    lines(L).map(uv => uv.map(q => { const r = proj(q[0], q[1], 0, VMAP); return [r[0], r[1]]; }))
      .map(pts => { const cum = [0]; for (let k = 1; k < pts.length; k++) cum.push(cum[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1])); return { li, pts, cum, len: cum[cum.length - 1] }; })
      .filter(j => j.len > 30).sort((a, b) => b.len - a.len).forEach(j => jobs.push(j));
  });
  // schedule: the first pencil starts at the low and works outward; after its first three isobars,
  // a second pencil starts at the high and works outward until the two meet
  const pens = [{ free: START, at: PARK[0], plan: [], on: START - 0.6 }, { free: Infinity, at: PARK[1], plan: [], on: Infinity }];
  const NL = T.FIELDS.B.levels.length, byLevel = T.FIELDS.B.levels.map((_, li) => jobs.filter(j => j.li === li));
  function doLevel(pen, li) {
    byLevel[li].forEach(j => {
      const t0 = pen.free + MOVE, t1 = t0 + j.len / SPEED;
      pen.plan.push({ type: 'move', t0: pen.free, t1: t0, a: pen.at, b: j.pts[0] });
      pen.plan.push({ type: 'draw', t0, t1, j });
      j.t0 = t0; j.t1 = t1; pen.free = t1; pen.at = j.pts[j.pts.length - 1];
    });
  }
  let lo = 0, hi = NL - 1;
  for (; lo < 3; lo++) doLevel(pens[0], lo);
  pens[1].free = pens[0].free - 2.2; pens[1].on = pens[1].free - 0.4;   // second pencil joins near the end of the third line
  while (lo <= hi) {
    if (pens[0].free <= pens[1].free) doLevel(pens[0], lo++);
    else doLevel(pens[1], hi--);
  }
  pens.forEach((pen, k) => { pen.plan.push({ type: 'move', t0: pen.free, t1: pen.free + MOVE * 1.6, a: pen.at, b: PARK[k] }); pen.off = pen.free + MOVE * 1.6; });
  const levelDone = T.FIELDS.B.levels.map((_, li) => Math.max(...jobs.filter(j => j.li === li).map(j => j.t1)));
  const END = Math.max(...levelDone);
  function at(j, d) { // point at distance d along a job's line
    let k = 1; while (k < j.cum.length - 1 && j.cum[k] < d) k++;
    const f = (d - j.cum[k - 1]) / Math.max(1e-6, j.cum[k] - j.cum[k - 1]);
    return [lerp(j.pts[k - 1][0], j.pts[k][0], clamp01(f)), lerp(j.pts[k - 1][1], j.pts[k][1], clamp01(f))];
  }
  function drawPencil(ctx, x, y, body, alpha, lift) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x + lift * 10, y - lift * 18); ctx.rotate(-0.95);
    const sc = Math.max(1, Math.min(1.5, 0.6 / SCALE)); ctx.scale(sc, sc);
    ctx.lineJoin = 'round'; ctx.strokeStyle = '#1e376c'; ctx.lineWidth = 2.5;
    ctx.fillStyle = 'rgba(30,55,108,.18)'; ctx.beginPath(); ctx.ellipse(70, 26, 110, 8, 0, 0, 2 * Math.PI); ctx.fill();   // shadow
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(40, -13); ctx.lineTo(40, 13); ctx.closePath(); ctx.fillStyle = '#e9c99b'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(13, -4.3); ctx.lineTo(13, 4.3); ctx.closePath(); ctx.fillStyle = '#1e376c'; ctx.fill();
    ctx.fillStyle = body; ctx.fillRect(40, -13, 150, 26); ctx.strokeRect(40, -13, 150, 26);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(42, -11, 146, 7);
    ctx.fillStyle = '#b9c1cf'; ctx.fillRect(190, -14, 18, 28); ctx.strokeRect(190, -14, 18, 28);
    ctx.beginPath(); ctx.moveTo(208, -13); ctx.lineTo(222, -13); ctx.quadraticCurveTo(230, -13, 230, -5); ctx.lineTo(230, 5); ctx.quadraticCurveTo(230, 13, 222, 13); ctx.lineTo(208, 13); ctx.closePath();
    ctx.fillStyle = '#f2a1a8'; ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  function render(ctx, t) {
    const lw = Math.max(3, fpx(1.6, 3, 6));
    ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = '#1667c4'; ctx.lineWidth = lw;
    jobs.forEach(j => {
      if (t <= j.t0) return;
      const d = Math.min(j.len, (t - j.t0) * SPEED);
      ctx.beginPath(); ctx.moveTo(j.pts[0][0], j.pts[0][1]);
      for (let k = 1; k < j.pts.length && j.cum[k] <= d; k++) ctx.lineTo(j.pts[k][0], j.pts[k][1]);
      const e = at(j, d); ctx.lineTo(e[0], e[1]); ctx.stroke();
    });
  }
  function labels(ctx, t) {
    const L = labelsFor('B', VMAP, 'map');
    T.FIELDS.B.levels.forEach((lv, li) => {
      const a = eo(seg(t, levelDone[li], levelDone[li] + 0.5));
      if (!a || !L[li]) return;
      ctx.globalAlpha = a; label(ctx, lv + ' mb', L[li][0], L[li][1], '#1667c4', fpx(12, 24, 40), 'center'); ctx.globalAlpha = 1;
    });
  }
  function pencils(ctx, t) {
    const cols = ['#f6c544', '#f47920'];
    pens.forEach((pen, k) => {
      if (t < pen.on || t > pen.off + 0.3) return;
      let pos = PARK[k], lift = 1;
      const st = pen.plan.find(p => t >= p.t0 && t < p.t1);
      if (!st) { pos = t < pen.on + 0.6 ? PARK[k] : pen.plan[0].a; if (pen.plan.length) pos = t >= pen.off ? PARK[k] : pen.plan[0].a; }
      else if (st.type === 'move') { const f = eio(seg(t, st.t0, st.t1)); pos = [lerp(st.a[0], st.b[0], f), lerp(st.a[1], st.b[1], f)]; lift = Math.sin(Math.PI * f) * 1.2 + (f < 0.5 ? 0 : 0); }
      else { pos = at(st.j, (t - st.t0) * SPEED); lift = 0; }
      const fade = Math.min(eo(seg(t, pen.on, pen.on + 0.5)), 1 - seg(t, pen.off, pen.off + 0.3));
      drawPencil(ctx, pos[0], pos[1], cols[k], fade, lift);
    });
  }
  return { render, labels, pencils, END, secondAt: pens[1].on };
})();

scene('recap', 'Recap', 7, {
  init(root) {
    const icoA = '<rect x="-100" y="40" width="200" height="60" fill="#e6dccb" stroke="#1e376c" stroke-width="3"/><path d="M-100 40 L-30 40 L20 -70 L70 40 Z" fill="#e6dccb" stroke="#1e376c" stroke-width="3"/>' +
      '<g transform="translate(-65 40) scale(.8)"><rect class="hut" x="-20" y="-32" width="40" height="32"/><polygon class="hut" points="-27,-32 0,-54 27,-32"/></g>' +
      '<g transform="translate(20 -70) scale(.8)"><rect class="hut" x="-20" y="-32" width="40" height="32"/><polygon class="hut" points="-27,-32 0,-54 27,-32"/></g>' +
      '<text x="-65" y="-30" text-anchor="middle" fill="#c8322a" style="font:700 30px Nunito Sans,sans-serif">1008</text><text x="80" y="-100" text-anchor="middle" fill="#c8322a" style="font:700 30px Nunito Sans,sans-serif">866</text>';
    const icoB = '<rect x="-22" y="-90" width="44" height="170" fill="#1667c4" fill-opacity=".5" stroke="#f47920" stroke-width="4" stroke-dasharray="9 6"/><line x1="-90" x2="90" y1="80" y2="80" stroke="#1e376c" stroke-width="4" stroke-dasharray="10 8"/>' +
      '<text x="36" y="0" fill="#d4610c" style="font:700 30px Nunito Sans,sans-serif">+1 mb</text><text x="36" y="34" fill="#1e376c" style="font:700 24px Nunito Sans,sans-serif">per 10 m</text>';
    const icoC = '<rect x="-100" y="-90" width="200" height="180" rx="10" fill="#f1f4f9" stroke="#1e376c" stroke-width="3"/>' +
      '<ellipse cx="-40" cy="-30" rx="40" ry="32" fill="none" stroke="#1667c4" stroke-width="4"/><ellipse cx="-40" cy="-30" rx="75" ry="62" fill="none" stroke="#1667c4" stroke-width="4"/>' +
      '<ellipse cx="50" cy="40" rx="30" ry="26" fill="none" stroke="#1667c4" stroke-width="4"/><text x="-40" y="-18" text-anchor="middle" fill="#1667c4" style="font:700 40px Nunito Sans,sans-serif">H</text><text x="50" y="54" text-anchor="middle" fill="#c8322a" style="font:700 36px Nunito Sans,sans-serif">L</text>';
    let ci = 0;
    const card = (x, ico, head, sub) => '<div class="card rc rc' + (ci++) + '" style="left:' + x + 'px;top:420px;width:520px;height:520px;display:flex;flex-direction:column;align-items:center;gap:20px;padding:40px 36px;text-align:center">' +
      '<svg class="ri" width="230" height="230" viewBox="-115 -115 230 230" style="flex:none;overflow:visible">' + ico + '</svg>' +
      '<div class="words" style="position:static;align-items:center;gap:12px"><p class="line" style="font-size:48px">' + head + '</p><p class="sub" style="font-size:28px">' + sub + '</p></div></div>';
    root.append(h('<div class="ground"><div class="words" style="left:140px;top:110px;width:1500px"><p class="tag">Recap</p><h2 class="line">From barometer to weather map</h2><div class="rule"></div></div>' +
      card(140, icoA, 'Station pressure', 'Depends mostly on altitude') + card(700, icoB, 'Correct it', 'Add 1 mb for every 10 m') + card(1260, icoC, 'Sea level map', 'Isobars show the weather') + '</div>'));
    this.tagS = root.querySelector('.tag').style; this.line = root.querySelector('.line'); this.rule = root.querySelector('.rule').style;
    this.cards = [...root.querySelectorAll('.card')];
  },
  render(t) {
    this.tagS.opacity = eo(seg(t, 0, 0.5)); fadeFromRight(this.line, t, 0.2);
    this.rule.transformOrigin = '0 50%'; this.rule.transform = 'scaleX(' + eo(seg(t, 0.8, 1.3)) + ')';
    this.cards.forEach((c, i) => { const p = eo(seg(t, 1.4 + i * 0.6, 2.1 + i * 0.6)); c.style.opacity = p; c.style.transform = 'translateY(' + lerp(30, 0, p) + 'px)'; });
  },
});

// ---------- scene text (shown on screen and read by screen readers) ----------
const sI = byId('I'), sO = byId('O'), sL = byId('L');
const corrDesc = s => 'Station ' + s.id + ', ' + s.name + ', is ' + fmt(s.z) + ' m above sea level and its barometer reads ' + s.P + ' mb. The other stations fade. A dashed column drops from the station straight down through the ground to sea level, and fills as a counter adds 1 mb for every 10 m: ' + fmt(s.z) + ' m ÷ 10 = ' + s.C + ' mb. So ' + s.P + ' + ' + s.C + ' = ' + s.S + ' mb, and the +' + s.C + ' mb stays at the bottom of the column with the sea level pressure, ' + s.S + ' mb, written in blue right under it at sea level.';
const META = {
  title: { still: 5, cap: { tag: 'Introduction to meteorology', line: 'Sea level pressure', sub: 'Comparing barometers at different altitudes' },
    desc: 'This animation shows why weather stations at different altitudes can\'t compare their barometer readings directly, how each reading is corrected to sea level, and how the corrected values become a surface pressure map. The picture shows a coast with a mountain behind it, and two weather stations.' },
  two: { still: 7, cap: { tag: 'Two weather stations', line: 'Different altitudes', sub: 'Station A is near the coast at 50 m. Station B is on a mountain at 1,500 m. Each barometer reads the station pressure (red).' },
    desc: 'A side view of the coast and a mountain, with sea level marked as a dashed line. Station A sits near the coast at an altitude of 50 m and its barometer reads 1008 mb. Station B sits on top of the mountain at 1,500 m and reads 866 mb. These are station pressures, shown in red.' },
  compare: { still: 8, cap: { tag: 'Station pressure', line: 'Not comparable', sub: 'Higher stations have less air above them, so their pressure is lower. The difference is mostly altitude, not weather.' },
    desc: 'The two readings are 142 mb apart: 1008 mb versus 866 mb. A bracket shows the air above Station A, reaching from the station to the top of the atmosphere. The lowest part of it, highlighted in orange, is an extra 1,450 m of air that Station B does not have above it, because B sits higher. That extra air is why A reads so much higher. The difference is mostly altitude, not weather.' },
  fix2d: { still: 11, cap: { tag: 'The correction', line: 'Add 1 mb per 10 m', sub: 'Imagine each station\'s air column continues down to sea level. Every 10 m of extra air adds about 1 mb.' },
    desc: 'A dashed column drops from Station B straight down through the mountain to sea level. It fills as a counter climbs from +0 to +150 mb, because 1,500 m ÷ 10 = 150 mb. So B: 866 mb + 150 = 1016 mb, its sea level pressure, shown in blue. Station A needs only a tiny column: 50 m ÷ 10 = 5 mb, so A: 1008 mb + 5 = 1013 mb.' },
  compare2: { still: 6, cap: { tag: 'Sea level pressure', line: 'Now comparable', sub: 'Both readings now describe the same level. Station B has the higher sea level pressure, even though its station pressure was much lower.' },
    desc: 'The sea level line turns blue, and both sea level pressures sit on it: 1013 mb for Station A and 1016 mb for Station B. Now they can be compared. Station B actually has the higher pressure, by 3 mb, even though its station pressure was 142 mb lower.' },
  many: { still: 7, cap: { tag: 'A whole region', line: 'Many stations', sub: 'A region with a coast, a mountain range, a basin and a high plateau. Each pin shows a station pressure (red) in mb.' },
    desc: 'A 3D view of a region. An ocean is on the left, then a coastal plain, a north–south mountain range, a basin and a high plateau on the right. The terrain rises up, and twelve weather stations appear as pins. Each pin is labeled with its station pressure in red, from about 790 mb on the high ridge to about 1015 mb at sea.' },
  terrain: { still: 10, cap: { tag: 'Station pressure', line: 'Contours trace the terrain', sub: 'Brown lines connect equal altitude. Red lines connect equal station pressure. They have the same shape, so station pressure mostly shows the mountains.' },
    desc: 'Brown elevation contours appear at 500, 1,000, 1,500 and 2,000 m, circling the mountains. Then red contours of equal station pressure appear at 950, 900, 850 and 800 mb. They run right alongside the brown lines and have the same shape. A map of station pressure is basically a map of the terrain, so it can\'t show the weather.' },
  fixI: { still: 8.5, cap: { tag: 'Correcting station I', line: sI.name + ', ' + fmt(sI.z) + ' m', sub: 'Imagine the air column continuing ' + fmt(sI.z) + ' m down to sea level. At 1 mb per 10 m that adds ' + sI.C + ' mb: ' + sI.P + ' + ' + sI.C + ' = ' + sI.S + ' mb.' }, desc: corrDesc(sI) },
  fixO: { still: 8.5, cap: { tag: 'Correcting station O', line: sO.name + ', ' + fmt(sO.z) + ' m', sub: 'Imagine the air column continuing ' + fmt(sO.z) + ' m down to sea level. At 1 mb per 10 m that adds ' + sO.C + ' mb: ' + sO.P + ' + ' + sO.C + ' = ' + sO.S + ' mb.' }, desc: corrDesc(sO) },
  fixL: { still: 8.5, cap: { tag: 'Correcting station L', line: sL.name + ', ' + fmt(sL.z) + ' m', sub: 'Imagine the air column continuing ' + fmt(sL.z) + ' m down to sea level. At 1 mb per 10 m that adds ' + sL.C + ' mb: ' + sL.P + ' + ' + sL.C + ' = ' + sL.S + ' mb.' }, desc: corrDesc(sL) },
  allfix: { still: 6, cap: { tag: 'Same rule everywhere', line: 'Every station', sub: 'Each station gets the same correction: add 1 mb for every 10 m of altitude. Every pin now also shows its sea level pressure (blue).' },
    desc: 'The rest of the stations are corrected the same way, one after another. Each pin now shows two numbers: station pressure in red at the top of the pin and sea level pressure in blue at its foot. The station pressures spanned more than 200 mb; the sea level pressures span only about 30 mb.' },
  flat: { still: 9, cap: { tag: 'Seen from above', line: 'A flat map', sub: 'The 3D view tips over into a map seen from straight above. Then the station pressures (red) fade away, leaving only the sea level pressures (blue).' },
    desc: 'The 3D view tips over and flattens into a map seen from straight above. The terrain stays faintly shaded underneath. Each station is a dot with two numbers, station pressure in red and sea level pressure in blue. Then the red station pressures fade away, leaving only the sea level pressures to work with.' },
  isobars: { still: 40, cap: { tag: 'Surface pressure map', line: 'Draw the isobars', sub: 'Blue lines connect equal sea level pressure, every 4 mb. They cross the mountains freely: they show the weather, not the terrain.', box: ['What is a contour?', CONTOUR_NOTE] },
    desc: 'On the flat map, a pencil draws the blue isobars one line at a time, starting at the low and working outward. After its first three lines, a second pencil starts at the high and works outward until the two pencils meet. The isobars are drawn every 4 mb from 996 to 1024 mb, connecting equal sea level pressures between the stations. Unlike the red station pressure contours, they don\'t follow the mountains. They form rings around a high pressure center, marked H at 1025 mb, over the ocean in the northwest, and a low pressure center, marked L at 994 mb, over the basin. The result is a surface pressure map.' },
  recap: { still: 7, cap: { tag: 'Recap', line: 'From barometer to weather map' },
    desc: 'Recap. Station pressure depends mostly on altitude. Correct it to sea level by adding 1 mb for every 10 m. Isobars of sea level pressure show the weather pattern.' },
};
SCENES.forEach(s => Object.assign(s, META[s.id]));

// ---------- player ----------
const $ = id => document.getElementById(id);
const stage = $('stage'), frame = $('frame'), body = document.body;
SCENES.forEach(s => { s.root = document.createElement('div'); s.root.className = 'layer'; stage.appendChild(s.root); s.init(s.root); });

const mqPort = matchMedia('(orientation: portrait) and (max-width: 640px)');
const mqLand = matchMedia('(orientation: landscape) and (max-height: 560px)');
const mqReduce = matchMedia('(prefers-reduced-motion: reduce)');
let mode = 'desk';
function fit() {
  const m = mqPort.matches ? 'port' : mqLand.matches ? 'land' : 'desk';
  if (m !== mode) { body.classList.remove('desk', 'land', 'port'); mode = m; }
  body.classList.add(mode);
  const port = mode === 'port';
  const s = frame.clientWidth / (port ? 1120 : 1920);
  if (!s) return;
  SCALE = s;
  stage.style.transform = 'scale(' + s + ')' + (port ? ' translateX(-800px)' : '');
  stage.classList.toggle('port', port);
  const big = s < 0.55;
  stage.classList.toggle('big', big);
  const px = (target, lo, hi) => Math.min(hi, Math.max(lo, target / s)).toFixed(1) + 'px';
  stage.style.setProperty('--lab', px(14, 28, 48));
  stage.style.setProperty('--val', px(18, 40, 64));
  stage.style.setProperty('--sub', px(15, 34, 46));
  stage.style.setProperty('--tag', px(13, 24, 42));
  stage.style.setProperty('--note', px(13, 24, 40));
  Object.keys(LABCACHE).forEach(k => delete LABCACHE[k]);
  applyText();
}
new ResizeObserver(fit).observe(frame);
[mqPort, mqLand].forEach(q => q.addEventListener ? q.addEventListener('change', fit) : q.addListener(fit));
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 250));

// scene text panel
let textOn = false;
try { textOn = localStorage.getItem('slp-text') === '1'; } catch (e) {}
const desc = $('desc'), textB = $('textB');
function applyText() {
  const shown = mode === 'port' || textOn;
  desc.classList.toggle('sr-only', !shown);
  textB.setAttribute('aria-expanded', textOn ? 'true' : 'false');
  textB.setAttribute('aria-label', textOn ? 'Hide scene text' : 'Show scene text');
}
function setText(on) { textOn = on; try { localStorage.setItem('slp-text', on ? '1' : '0'); } catch (e) {} applyText(); }
textB.onclick = () => setText(!textOn);
$('closeText').onclick = () => { setText(false); textB.focus(); };
$('skip').addEventListener('click', e => { e.preventDefault(); if (mode !== 'port') setText(true); desc.focus(); });

// scene navigation
const dots = $('dots'), title = $('title'), count = $('count'), nextB = $('next'), backB = $('back');
SCENES.forEach((s, i) => { const b = document.createElement('button'); b.setAttribute('aria-label', 'Go to scene ' + (i + 1) + ': ' + s.name); b.onclick = () => go(i); dots.appendChild(b); });
const esc = x => x.replace(/&/g, '&amp;').replace(/</g, '&lt;');
let cur = -1, start = performance.now(), prev = null, prevT = 0, fadeStart = 0, paused = false, pausedAt = 0, still = false;
const FADE = 0.4;
function sceneTime(now) { return ((paused ? pausedAt : now) - start) / 1000; }
function setPaused(p) {
  const now = performance.now();
  if (p === paused) return;
  if (paused) { start += now - pausedAt; paused = false; } else { pausedAt = now; paused = true; }
  $('pauseTxt').textContent = paused ? 'Play' : 'Pause';
  $('pause').setAttribute('aria-label', paused ? 'Play' : 'Pause');
  $('pauseIco').innerHTML = paused ? '<path d="M7 5l12 7-12 7z"/>' : '<path d="M8 5v14M16 5v14"/>';
}
function go(i) {
  if (i < 0 || i >= SCENES.length) return;
  const now = performance.now();
  const reduce = mqReduce.matches;
  if (i !== cur && cur >= 0 && !reduce) { prev = cur; prevT = sceneTime(now); fadeStart = now; } else prev = null;
  cur = i;
  const s = SCENES[i];
  if (reduce) { setPaused(false); start = now - s.still * 1000; setPaused(true); still = true; }
  else { start = now; if (paused) pausedAt = now; still = false; }
  title.textContent = 'Scene ' + (i + 1) + ' of ' + SCENES.length + ': ' + s.name;
  count.textContent = (i + 1) + ' of ' + SCENES.length;
  $('dTitle').textContent = 'Scene ' + (i + 1) + ' of ' + SCENES.length + ': ' + s.name;
  const c = s.cap;
  $('cap').innerHTML = '<p class="cap-tag">' + esc(c.tag) + '</p><p class="cap-line">' + esc(c.line) + '</p>' +
    (c.sub ? '<p class="cap-sub">' + esc(c.sub) + '</p>' : '') + (c.box ? '<div class="cap-box"><p class="cap-tag" style="color:var(--brand)">' + esc(c.box[0]) + '</p><p class="cap-sub">' + esc(c.box[1]) + '</p></div>' : '') + (c.note ? '<p class="cap-note">' + esc(c.note) + '</p>' : '');
  $('dText').textContent = s.desc;
  [...dots.children].forEach((d, k) => { d.className = k === i ? 'on' : k < i ? 'done' : ''; if (k === i) d.setAttribute('aria-current', 'step'); else d.removeAttribute('aria-current'); });
  if (document.activeElement === backB && i === 0) nextB.focus();
  if (document.activeElement === nextB && i === SCENES.length - 1) backB.focus();
  backB.disabled = i === 0;
  nextB.disabled = i === SCENES.length - 1;
  if (mode === 'port') desc.scrollTop = 0;
}
function frameLoop(now) {
  const t = sceneTime(now);
  const fp = prev === null ? 1 : clamp01((now - fadeStart) / 1000 / FADE);
  SCENES.forEach((s, k) => { s.root.style.display = (k === cur || (k === prev && fp < 1)) ? 'block' : 'none'; });
  if (prev !== null && fp < 1) { const ps = SCENES[prev]; ps.root.style.opacity = 1 - fp; ps.root.style.zIndex = 1; ps.render(prevT + (now - fadeStart) / 1000); }
  else prev = null;
  const s = SCENES[cur];
  s.root.style.opacity = fp; s.root.style.zIndex = 2;
  s.render(Math.max(0, t));
  nextB.classList.toggle('ready', (t >= s.dur || still) && cur < SCENES.length - 1);
  requestAnimationFrame(frameLoop);
}
nextB.onclick = () => go(cur + 1);
backB.onclick = () => go(cur - 1);
$('replay').onclick = () => { prev = null; still = false; setPaused(false); start = performance.now(); };
$('pause').onclick = () => setPaused(!paused);

// full screen, hidden where the browser can't do it (such as Safari on iPhone)
const app = $('app');
const fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) && !!(app.requestFullscreen || app.webkitRequestFullscreen);
if (!fsOK) body.classList.add('no-fs');
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
$('full').onclick = () => {
  try {
    if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const r = (app.requestFullscreen || app.webkitRequestFullscreen).call(app); if (r && r.catch) r.catch(() => {}); }
  } catch (e) {}
};
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { $('full').setAttribute('aria-label', fsEl() ? 'Exit full screen' : 'Full screen'); fit(); }));

// keyboard
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const onButton = e.target.closest && e.target.closest('button, a');
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); go(cur + 1); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(cur - 1); }
  else if (k === ' ' || k === 'Spacebar') { if (!onButton) { e.preventDefault(); go(cur + 1); } }
  else if (k === 'Home') { e.preventDefault(); go(0); }
  else if (k === 'End') { e.preventDefault(); go(SCENES.length - 1); }
  else if (k === 'r' || k === 'R') $('replay').click();
  else if (k === 'p' || k === 'P') $('pause').click();
  else if ((k === 'f' || k === 'F') && fsOK) $('full').click();
  else if (k === 't' || k === 'T') setText(!textOn);
  else if (k === 'Escape' && textOn && mode === 'land') { setText(false); textB.focus(); }
});

// touch: swipe left/right, tap the right side for next and the far left for back (mouse clicks ignored)
let tp = null;
frame.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch') return; tp = { x: e.clientX, y: e.clientY, t: performance.now() }; });
frame.addEventListener('pointercancel', () => { tp = null; });
frame.addEventListener('pointerup', e => {
  if (e.pointerType !== 'touch' || !tp) return;
  const dx = e.clientX - tp.x, dy = e.clientY - tp.y, dt = performance.now() - tp.t; tp = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 800) { go(cur + (dx < 0 ? 1 : -1)); return; }
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 350) {
    const r = frame.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width;
    if (fx > 0.5) go(cur + 1); else if (fx < 0.25) go(cur - 1);
  }
});

// test hook: SLP.go(i), SLP.seek(seconds) freezes the current scene at a moment
window.SLP = { go, seek(t) { setPaused(false); start = performance.now() - t * 1000; prev = null; setPaused(true); }, scenes: SCENES.length, ST };

fit();
go(0);
requestAnimationFrame(frameLoop);
})();
</script>

</body>
</html>
