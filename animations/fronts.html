function mapFront(ctx, ctrl, type, side, prog) {

  const Ltot = cum[cum.length - 1] * prog, pts = all.filter((p, i) => cum[i] <= Ltot);
  if (pts.length < 2) return;
  const col = type === 'cold' ? FC.cold : type === 'warm' ? FC.warm : type === 'occ' ? FC.occ : FC.cold;
  line(ctx, pts, col, 6);
  if (type === 'stat') line(ctx, pts, FC.warm, 6, [40, 40]);
  for (let s = 22, k = 0; s < Ltot - 10; s += 40, k++) {
    let i = 1; while (i < cum.length - 1 && cum[i] < s) i++;
    const f = (s - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1), x = lerp(all[i - 1][0], all[i][0], f), y = lerp(all[i - 1][1], all[i][1], f);

    let c = col; if (type === 'stat') { c = semi ? FC.warm : FC.cold; if (semi) sd = -side; }
    const nx = -ty * sd, ny = tx * sd;
    if (semi) { const a0 = Math.atan2(ny, nx); ctx.beginPath(); ctx.arc(x, y, 12, a0 - Math.PI / 2, a0 + Math.PI / 2); ctx.closePath(); ctx.fillStyle = c; ctx.fill(); }
    else fillPts(ctx, [[x - tx * 12, y - ty * 12], [x + nx * 20, y + ny * 20], [x + tx * 12, y + ty * 12]], c);
  }
}

function occScene(ctx, t, s) {
  const xO = 1250, off = 40 * t, L = a => eo(seg(t, a, a + 0.8));

  const ghostA = merged ? 0.38 : 1, pre = 1 - sm(seg(t, tm - 0.2, tm + 1.4)), post = sm(seg(t, tm + 0.4, tm + 2.4));

  } else {

    fillPts(ctx, leftOf([...G.low, ...G.up]), W);
    fillPts(ctx, rightOf([...G.low, ...G.ws]), E);
  }
  land(ctx, off);
  // clouds: before the merge, a cold front's cumulonimbus and a warm front's layers; afterwards, see-through clouds
  if (pre > 0.01) {
    layered(ctx, xO, 0, 1, B_RAMP, [L(2), L(2.3), L(2.6), L(2.9)], pre, t, L(3.2) * pre);
    cumulonimbus(ctx, xc + 40, zy(1.7), zy(9.6), L(2.6), pre, 1);
    rain(ctx, xc - 14, xc + 94, zy(1.7) + 4, t, 10, L(3.6) * pre, 2.2);
  }
  if (post > 0.01 && G) {
    if (s < 0) { layered(ctx, G.Px, h, 1, B_RAMP, [1, 1, 1, 1], post * ghostA, t, post * 0.8); cumulonimbus(ctx, xO + 30, zy(1.7), zy(7.8), 1, post * 0.3, 1); rain(ctx, xO - 14, xO + 74, zy(1.7) + 4, t, 10, post * 0.8, 2); }

    if (gap > 90) flow(ctx, sp([[xO - 30, 0.5], [xc + 60, 0.7], [xc + 26, 2.6], [xc - 30, 5.6], [xc - 140, 7.6]]), t, FC.warm, fa * clamp01((gap - 90) / 120));
    flow(ctx, sp([[xO - 20, 1.0], [xO + 120, 2.6], ...[300, 480].map(u => [xO + u, u / B_RAMP + 0.9])]), t, FC.warm, fa, 45);
  } else {
    const a = L(tm + 1);
    flow(ctx, sp([[G.Px + 20, h + 0.8], ...[160, 320, 480].map(u => [G.Px + u, h + u / B_RAMP + 0.7])]), t, FC.warm, a, 45);
    if (s < 0) {
      flow(ctx, sp([[XL + 40, 0.32], [xO - 180, 0.32], [xO - 40, 0.35]]), t, '#163f78', a, 90);
      flow(ctx, sp([[xO + 300, 0.4], [xO + 60, 0.45], [xO + 14, h * 0.45], [G.Px + 20, h + 0.15]]), t, '#4f86c6', a, 50);
    } else {

}

  cold: { still: S_COLD, cap: { tag: 'Scene 1 · Cold front', line: 'Cold air plows ahead', sub: 'Dense cold air pushes under warmer air like a wedge. Friction slows the air touching the ground, so the front gets a steep, rounded nose. Warm air is shoved up fast and builds towering cumulonimbus clouds.' },
    desc: 'A side view, moving along with a cold front, so the front holds still and fields, trees and houses slide by from east to west underneath. The cloud base sits above the rooftops, and the rain falls in front of the houses and trees. A dome of cold, dense air fills the left side, and warm, humid air fills the right. Arrows near the ground in the cold air are short, and arrows higher up are longer: friction with the ground slows the air at the bottom, so the front gets a steep, rounded nose. Warm air streams in from the right, is shoved almost straight up at the nose, and arcs back over the top of the cold dome. A cumulonimbus cloud grows where the warm air rises, with an anvil at its top and heavy rain beneath it. Behind the front, small fair-weather cumulus clouds float in cooler, drier, clearing air.' },
  warm: { still: S_WARM, cap: { tag: 'Scene 2 · Warm front', line: 'Warm air glides up', sub: 'Warm air is lighter, so it can\'t push the cold air away. It slides up over a retreating wedge of cold air. The slope is very gentle, so the clouds spread far ahead of the front. In winter, the precipitation changes from snow to sleet to freezing rain to rain as the front nears.' },
    desc: 'A side view, moving along with a warm front, so the land slides slowly by underneath. A thin wedge of cold air lies on the right, slowly retreating to the east. Warm, humid air on the left flows toward it. Because warm air is lighter, it cannot push the cold air away, so it glides up over the wedge along a long, gentle slope, about 1 kilometer up for every 100 to 200 kilometers across. As the air climbs and cools, clouds form along the slope: thick nimbostratus near the front, then altostratus, then thin cirrostratus, and wispy cirrus highest and farthest ahead. The cold air at the ground is below freezing. Far ahead of the front, snow falls from the nimbostratus. Closer to the front, the snow melts in the warm air aloft: where the cold layer below is deep it refreezes into sleet, and where the cold layer is shallow the drops freeze on contact as freezing rain, coating the ground with ice. Right at the front, rain falls.' },
  stat: { still: S_STAT, cap: { tag: 'Scene 6 · Stationary front', line: 'Neither side wins', sub: 'The two air masses push with about the same strength, and the winds blow along the front instead of across it. The front stalls. Warm air keeps gliding up over the cold air, so the rain falls on the same places for days.' },
    desc: 'A side view of a stationary front. The front is not moving, so the land stays still too. Cold air lies on the left and warm air on the right. Symbols show the wind blowing along the front, out of the screen on the cold side and into the screen on the warm side, so neither air mass pushes the other away. Warm air slowly glides up over the cold air along a gentle slope, making nimbostratus and altostratus clouds. Rain keeps falling on the same spot, which is how stationary fronts can cause flooding.' },
  cocc: { still: S_OCC, cap: { tag: 'Scene 7 · Cold-occluded front', line: 'The coldest air digs under', sub: 'A fast cold front catches up to a slower warm front. Here the air behind the cold front is the coldest and densest, so it slides under the cool air ahead and lifts it. The warm air between them is pushed up off the ground. The clouds turn see-through so you can watch the fronts.' },
    desc: 'A side view, moving along with a warm front. Cool air lies ahead of the warm front on the right, and the coldest air lies behind a cold front on the left, with warm air between them at the ground. Arrows show the cold front moving about twice as fast as the warm front, so it catches up, squeezing the warm air between them. When the two fronts meet, the coldest air behind the cold front, being the densest, digs underneath the cool air and lifts it. The warm air is lifted completely off the ground. The clouds become see-through so the shapes of the fronts stay visible: the blue cold-front dome continues under the cool air, and the warm air sits high above.' },
  wocc: { still: S_OCC, cap: { tag: 'Scene 8 · Warm-occluded front', line: 'The milder air rides over', sub: 'Again the cold front catches up to the warm front. This time the air ahead of the warm front is colder, so the incoming air is lighter. It rides up over the coldest air, like warm air at a warm front, and the warm air is lifted aloft. The clouds turn see-through so you can watch the fronts.' },
    desc: 'A side view, moving along with a warm front. This time the coldest air lies ahead of the warm front on the right, and cool air lies behind the cold front on the left, with warm air between them. The cold front moves about twice as fast and catches up. When the fronts meet, the cool air behind the cold front is lighter than the coldest air ahead, so it rides up the gentle slope over it, the way warm air does at a warm front. The warm air is lifted off the ground and sits above both. The clouds become see-through so the shapes stay visible: the red ramp runs from the ground up under the cool air, and the blue cold front sits aloft.' },
  recap: { still: 8, cap: { tag: 'Recap', line: 'Five kinds of fronts', sub: 'The shape of each front comes from which air is denser and which air is moving.' },
    desc: 'Recap. Cold front: a steep, rounded nose and fast lifting, with cumulonimbus clouds and heavy showers. Warm front: a long, gentle slope and slow lifting, with layered clouds and steady rain. Stationary front: winds blow along it, so it stalls, and rain falls on the same places for days. Cold-occluded front: the coldest air behind digs under the cool air ahead. Warm-occluded front: the milder air behind rides over the coldest air ahead.' },
};

// text for the added and changed scenes
Object.assign(META, {
  map: { still: S_MAP, cap: { tag: 'Scene 1 · Surface map', line: 'All the fronts on one map', sub: 'Picture a storm, or mid-latitude cyclone, near each coast, with a stationary front stretched between them. Together they show every kind of front: cold, warm, stationary, and both kinds of occluded front. Near the west coast, mild ocean air often sits behind the cold front, making a warm-type occlusion. Farther inland, the coldest air is usually behind it, making a cold type.' },
    desc: 'A surface weather map of the United States, with the Pacific Ocean, the Atlantic Ocean, the Gulf of Mexico and the Great Lakes. A low-pressure center sits over the Pacific Northwest and another over the Northeast, with high pressure between them over the northern Plains. From each low, an occluded front runs out to a point where a warm front heads east and a cold front trails to the southwest. Warm air, tinted red, fills the area south of the fronts. A stationary front connects the western storm\'s warm front to the eastern storm\'s cold front. The western storm\'s occluded front is labeled warm-occluded, since mild ocean air often sits behind its cold front, and the eastern storm\'s is labeled cold-occluded, since the coldest air is often behind it farther inland.' },
  winds: { still: S_WIND, cap: { tag: 'Scene 2 · Winds around fronts', line: 'Which way the wind blows', sub: 'Ahead of a front, the wind blows along the front, toward the north. Behind it, the wind blows into the front and drives it forward. A stationary front is the exception: winds blow along it on both sides, in opposite directions.' },
    desc: 'Two maps of a front running from southwest to northeast, with north at the top. In the first, for cold, warm and occluded fronts, red arrows on the side ahead of the front point from southwest to northeast, along the front. Blue arrows on the side behind it point from northwest to southeast, straight into the front, pushing it along. In the second, a stationary front, the arrows on both sides run along the front: from southwest to northeast on the warm side and from northeast to southwest on the cold side, so neither side pushes the other.' },
  dry: { still: S_DRY, cap: { tag: 'Scene 5 · Dry line', line: 'No clouds, just a wind shift', sub: 'A dry line works like a warm front, but the air on both sides is hot and dry. The air still rises over the boundary, but it holds too little water to make clouds. When it passes, only the wind direction and the temperature change.' },
    desc: 'A wide side view, moving along with a dry line over tan, dry farmland under a hot sun. Even hotter, dry air on the left slides up a gentle ramp over hot, dry air on the right, just like a warm front. Arrows show the air rising along the ramp, but no clouds form because the air holds too little water. A wind symbol ahead of the line shows wind blowing along it, toward the north, and an arrow behind it shows wind pushing into the line from the west. Two thermometers show the temperature rising from 90 degrees Fahrenheit (32 degrees Celsius) ahead of the line to 100 degrees Fahrenheit (38 degrees Celsius) behind it.' },
});
META.title.cap.sub = 'Five fronts, seen from the side as the land rolls by beneath them';
META.title.desc = META.title.desc.replace('five kinds of weather fronts form: cold, warm, stationary, cold-occluded and warm-occluded.', 'five kinds of weather fronts form: cold, warm, stationary, cold-occluded and warm-occluded. It starts with a weather map showing all five fronts and a look at the winds around them.');
META.cold.cap = { tag: 'Scene 3 · Cold front', line: 'Cold air plows ahead', sub: 'Dense cold air pushes under warmer air like a wedge. Friction slows the air touching the ground, so the front gets a steep, rounded nose. Warm air is shoved up fast, and the cumulonimbus keeps growing as it rises, so rain falls on both sides of the front.' };
META.cold.desc = 'A side view, moving along with a cold front, so the front holds still and fields, trees and houses slide by from east to west underneath. A dome of cold, dense air fills the left side, and warm, humid air fills the right. Behind the front, an arrow shows wind pushing into the front; ahead of it, a symbol shows wind blowing along the front, toward the north. Arrows near the ground in the cold air are short, and arrows higher up are longer: friction with the ground slows the air at the bottom, so the front gets a steep, rounded nose. Warm air streams in from the right, is shoved almost straight up at the nose, and arcs back over the top of the cold dome. A cumulonimbus cloud builds where the warm air rises and keeps growing as the air climbs, so it leans back over the cold dome. Its base sits just above the rooftops, and rain falls in front of the houses on both sides of the front: heavy rain just ahead and just behind it, and lighter rain farther behind. Ahead of the front, lightning flashes and gust arrows show thunderstorms, showers and gusty winds. Behind the front, small fair-weather cumulus clouds float in cooler, drier, clearing air.';
META.warm.cap = { tag: 'Scene 4 · Warm front', line: 'Warm air glides up', sub: 'Warm air is lighter, so it can\'t push the cold air away. It slides up over a retreating wedge of cold air along a very gentle slope, so the clouds spread far ahead. In winter the precipitation changes from snow to sleet to freezing rain to rain as the front nears.' };
META.warm.desc = 'A wide side view, moving along with a warm front, so the land slides slowly by underneath. A thin wedge of cold, below-freezing air lies on the right, slowly retreating to the east. Warm, humid air on the left flows toward it. Behind the front, an arrow shows wind pushing into the front; ahead of it, a symbol shows wind blowing along the front, toward the north. Because warm air is lighter, it cannot push the cold air away, so it glides up over the wedge along a long, gentle slope, about 1 kilometer up for every 100 to 200 kilometers across. As the air climbs and cools, clouds form along the slope: thick nimbostratus near the front, then altostratus, then thin cirrostratus, and wispy cirrus highest and farthest ahead. Fog hugs the ground right where the front meets it, and lumpy stratocumulus clouds float in the warm air behind the front. Far ahead of the front, snow falls from the nimbostratus. Closer to the front, the snow melts in the warm air aloft: where the cold layer below is deep it refreezes into sleet, and where the cold layer is shallow the drops freeze on contact as freezing rain, coating the ground with ice. Right at the front, rain falls.';
META.cocc.desc += ' Behind the cold front, an arrow shows wind pushing into the front; ahead of the warm front, a symbol shows wind blowing along it, toward the north.';
META.wocc.desc += ' Behind the cold front, an arrow shows wind pushing into the front; ahead of the warm front, a symbol shows wind blowing along it, toward the north.';
META.recap.cap = { tag: 'Recap', line: 'Five kinds of fronts', sub: 'The shape of each front comes from which air is denser and which air is moving.' };
META.recap.desc = 'Recap. Cold front: a steep, rounded nose and fast lifting, with a cumulonimbus cloud and rain on both sides of the front. Warm front: a long, gentle slope and slow lifting, with layered clouds and steady rain. Stationary front: winds blow along it, so it stalls, and rain falls on the same places for days. Cold-occluded front: the coldest air behind digs under the cool air ahead. Warm-occluded front: the milder air behind rides over the coldest air ahead.';

SCENES.forEach(s => Object.assign(s, META[s.id]));

// ---------- player ----------
const $ = id => document.getElementById(id);
const stage = $('stage'), frame = $('frame'), body = document.body;
SCENES.forEach(s => { s.root = document.createElement('div'); s.root.className = 'layer'; stage.appendChild(s.root); s.init(s.root); });

const mqPort = matchMedia('(orientation: portrait) and (max-width: 640px)');
const mqLand = matchMedia('(orientation: landscape) and (max-height: 560px)');
const mqReduce = matchMedia('(prefers-reduced-motion: reduce)');
let mode = 'desk';
function fit() {
  const m = mqPort.matches ? 'port' : mqLand.matches ? 'land' : 'desk';
  if (m !== mode) { body.classList.remove('desk', 'land', 'port'); mode = m; }
  body.classList.add(mode);
  const port = mode === 'port';
  const wide = port && body.classList.contains('wide');
  const s = frame.clientWidth / (port ? (wide ? 1840 : 1120) : 1920);
  if (!s) return;
  SCALE = s;
  stage.style.transform = 'scale(' + s + ')' + (port ? (wide ? ' translate(-40px, -360px)' : ' translateX(-800px)') : '');
  stage.classList.toggle('port', port);
  stage.classList.toggle('big', s < 0.55);
  const px = (target, lo, hi) => Math.min(hi, Math.max(lo, target / s)).toFixed(1) + 'px';
  stage.style.setProperty('--sub', px(15, 34, 46));
  stage.style.setProperty('--tag', px(13, 24, 42));
  applyText();
}
new ResizeObserver(fit).observe(frame);
[mqPort, mqLand].forEach(q => q.addEventListener ? q.addEventListener('change', fit) : q.addListener(fit));
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 250));

// scene text panel
let textOn = false;
try { textOn = localStorage.getItem('wf-text') === '1'; } catch (e) {}
const desc = $('desc'), textB = $('textB');
function applyText() {
  const shown = mode === 'port' || textOn;
  desc.classList.toggle('sr-only', !shown);
  textB.setAttribute('aria-expanded', textOn ? 'true' : 'false');
  textB.setAttribute('aria-label', textOn ? 'Hide scene text' : 'Show scene text');
}
function setText(on) { textOn = on; try { localStorage.setItem('wf-text', on ? '1' : '0'); } catch (e) {} applyText(); }
textB.onclick = () => setText(!textOn);
$('closeText').onclick = () => { setText(false); textB.focus(); };
$('skip').addEventListener('click', e => { e.preventDefault(); if (mode !== 'port') setText(true); desc.focus(); });

// scene navigation
const dots = $('dots'), title = $('title'), count = $('count'), nextB = $('next'), backB = $('back');
SCENES.forEach((s, i) => { const b = document.createElement('button'); b.setAttribute('aria-label', 'Go to scene ' + (i + 1) + ': ' + s.name); b.onclick = () => go(i); dots.appendChild(b); });
const esc = x => x.replace(/&/g, '&amp;').replace(/</g, '&lt;');
let cur = -1, start = performance.now(), prev = null, prevT = 0, fadeStart = 0, paused = false, pausedAt = 0, still = false;
const FADE = 0.4;
function sceneTime(now) { return ((paused ? pausedAt : now) - start) / 1000; }
function setPaused(p) {
  const now = performance.now();
  if (p === paused) return;
  if (paused) { start += now - pausedAt; paused = false; } else { pausedAt = now; paused = true; }
  $('pauseTxt').textContent = paused ? 'Play' : 'Pause';
  $('pause').setAttribute('aria-label', paused ? 'Play' : 'Pause');
  $('pauseIco').innerHTML = paused ? '<path d="M7 5l12 7-12 7z"/>' : '<path d="M8 5v14M16 5v14"/>';
}
function go(i) {
  if (i < 0 || i >= SCENES.length) return;
  const now = performance.now();
  const reduce = mqReduce.matches;
  if (i !== cur && cur >= 0 && !reduce) { prev = cur; prevT = sceneTime(now); fadeStart = now; } else prev = null;
  cur = i;
  const s = SCENES[i];
  body.classList.toggle('wide', !!s.wide); fit();
  if (reduce) { setPaused(false); start = now - s.still * 1000; setPaused(true); still = true; }
  else { start = now; if (paused) pausedAt = now; still = false; }
  title.textContent = 'Scene ' + (i + 1) + ' of ' + SCENES.length + ': ' + s.name;
  count.textContent = (i + 1) + ' of ' + SCENES.length;
  $('dTitle').textContent = 'Scene ' + (i + 1) + ' of ' + SCENES.length + ': ' + s.name;
  const c = s.cap;
  $('cap').innerHTML = '<p class="cap-tag">' + esc(c.tag) + '</p><p class="cap-line">' + esc(c.line) + '</p>' +
    (c.sub ? '<p class="cap-sub">' + esc(c.sub) + '</p>' : '') + (c.box ? '<div class="cap-box"><p class="cap-tag" style="color:var(--brand)">' + esc(c.box[0]) + '</p><p class="cap-sub">' + esc(c.box[1]) + '</p></div>' : '');
  $('dText').textContent = s.desc;
  [...dots.children].forEach((d, k) => { d.className = k === i ? 'on' : k < i ? 'done' : ''; if (k === i) d.setAttribute('aria-current', 'step'); else d.removeAttribute('aria-current'); });
  if (document.activeElement === backB && i === 0) nextB.focus();
  if (document.activeElement === nextB && i === SCENES.length - 1) backB.focus();
  backB.disabled = i === 0;
  nextB.disabled = i === SCENES.length - 1;
  if (mode === 'port') desc.scrollTop = 0;
}
function frameLoop(now) {
  const t = sceneTime(now);
  const fp = prev === null ? 1 : clamp01((now - fadeStart) / 1000 / FADE);
  SCENES.forEach((s, k) => { s.root.style.display = (k === cur || (k === prev && fp < 1)) ? 'block' : 'none'; });
  if (prev !== null && fp < 1) { const ps = SCENES[prev]; ps.root.style.opacity = 1 - fp; ps.root.style.zIndex = 1; ps.render(prevT + (now - fadeStart) / 1000); }
  else prev = null;
  const s = SCENES[cur];
  s.root.style.opacity = fp; s.root.style.zIndex = 2;
  s.render(Math.max(0, t));
  nextB.classList.toggle('ready', (t >= s.dur || still) && cur < SCENES.length - 1);
  requestAnimationFrame(frameLoop);
}
nextB.onclick = () => go(cur + 1);
backB.onclick = () => go(cur - 1);
$('replay').onclick = () => { prev = null; still = false; setPaused(false); start = performance.now(); };
$('pause').onclick = () => setPaused(!paused);

// full screen, hidden where the browser can't do it (such as Safari on iPhone)
const app = $('app');
const fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) && !!(app.requestFullscreen || app.webkitRequestFullscreen);
if (!fsOK) body.classList.add('no-fs');
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
$('full').onclick = () => {
  try {
    if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const r = (app.requestFullscreen || app.webkitRequestFullscreen).call(app); if (r && r.catch) r.catch(() => {}); }
  } catch (e) {}
};
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { $('full').setAttribute('aria-label', fsEl() ? 'Exit full screen' : 'Full screen'); fit(); }));

// keyboard
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const onButton = e.target.closest && e.target.closest('button, a');
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); go(cur + 1); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(cur - 1); }
  else if (k === ' ' || k === 'Spacebar') { if (!onButton) { e.preventDefault(); go(cur + 1); } }
  else if (k === 'Home') { e.preventDefault(); go(0); }
  else if (k === 'End') { e.preventDefault(); go(SCENES.length - 1); }
  else if (k === 'r' || k === 'R') $('replay').click();
  else if (k === 'p' || k === 'P') $('pause').click();
  else if ((k === 'f' || k === 'F') && fsOK) $('full').click();
  else if (k === 't' || k === 'T') setText(!textOn);
  else if (k === 'Escape' && textOn && mode === 'land') { setText(false); textB.focus(); }
});

// touch: swipe left/right, tap the right side for next and the far left for back (mouse clicks ignored)
let tp = null;
frame.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch') return; tp = { x: e.clientX, y: e.clientY, t: performance.now() }; });
frame.addEventListener('pointercancel', () => { tp = null; });
frame.addEventListener('pointerup', e => {
  if (e.pointerType !== 'touch' || !tp) return;
  const dx = e.clientX - tp.x, dy = e.clientY - tp.y, dt = performance.now() - tp.t; tp = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 800) { go(cur + (dx < 0 ? 1 : -1)); return; }
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 350) {
    const r = frame.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width;
    if (fx > 0.5) go(cur + 1); else if (fx < 0.25) go(cur - 1);
  }
});

// test hook: WF.go(i), COR.seek(seconds) freezes the current scene at a moment
window.WF = { go, seek(t) { setPaused(false); start = performance.now() - t * 1000; prev = null; setPaused(true); }, scenes: SCENES.length };

fit();
go(0);
requestAnimationFrame(frameLoop);
})();
</script>

</body>
</html>
