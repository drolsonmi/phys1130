/* ---------- phone held upright ---------- */
body.port #app { justify-content: flex-start; align-items: stretch; gap: 0; padding: 0; min-height: 0;

<script>
(function () {
document.documentElement.lang = 'en';
// ---------- helpers ----------
const clamp01 = x => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const TAU = Math.PI * 2, DEG = Math.PI / 180;
function h(html) { const tp = document.createElement('template'); tp.innerHTML = html.trim(); return tp.content.firstElementChild; }
function fadeFromRight(el, t, t0) {
  if (!el._w) {
    const words = el.textContent.split(' ');
    el.textContent = '';
    el._w = words.map((w, i) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w + (i < words.length - 1 ? ' ' : ''); el.appendChild(s); return s; });
  }
  el._w.forEach((s, i) => { const p = eo(seg(t, t0 + i * .11, t0 + i * .11 + .5)); s.style.opacity = p; s.style.transform = 'translateX(' + ((1 - p) * 26).toFixed(1) + 'px)'; });
}
function subIn(st, t, a) { const p = eo(seg(t, a, a + .6)); st.opacity = p; st.transform = 'translateX(' + lerp(26, 0, p) + 'px)'; }
const textBlock = (top, tag, line, sub) =>
  '<div class="words" style="left:140px;top:' + top + 'px;width:640px">' +
  '<p class="tag">' + tag + '</p><h2 class="line">' + line + '</h2>' + (sub ? '<p class="sub">' + sub + '</p>' : '') + '</div>';
function textRefs(self, root) { self.tagS = root.querySelector('.words .tag').style; self.line = root.querySelector('.words .line'); const s = root.querySelector('.words .sub'); self.subS = s && s.style; }
function textRender(self, t, subAt) { self.tagS.opacity = eo(seg(t, 0.2, 0.7)); fadeFromRight(self.line, t, 0.4); if (self.subS) subIn(self.subS, t, subAt); }
let SCALE = 0.6;   // current stage scale, used for canvas text size
const fpx = (target, lo, hi) => Math.min(hi, Math.max(lo, target / SCALE));

// ---------- canvas drawing kit ----------
const C = { navy: '#1e376c', ink: '#25282b', orange: '#f47920', orangeDk: '#a84508', blue: '#1667c4', red: '#c8322a', grid: '#8fa7cc', sea: '#dbe8f6', grass: '#e4efd9', tree: '#a8cf94', treeEdge: '#5f8f4e', plate: '#f4f6fa', wedge: '#dfe6f2' };
const P = (cx, cy, r, a) => [cx + r * Math.cos(a), cy - r * Math.sin(a)];   // math angle (counterclockwise) to screen
function label(ctx, txt, x, y, color, size, align, weight) {
  ctx.font = (weight || 700) + ' ' + size + 'px "Nunito Sans", system-ui, sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.26; ctx.strokeStyle = 'rgba(255,255,255,.95)';
  ctx.strokeText(txt, x, y); ctx.fillStyle = color; ctx.fillText(txt, x, y);
  return ctx.measureText(txt).width;
}
function disc(ctx, x, y, r, fill, stroke, lw) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 3; ctx.stroke(); } }
function line(ctx, pts, color, w, dash) {
  if (pts.length < 2) return;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash(dash || []);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]); ctx.stroke(); ctx.setLineDash([]);
}
function head(ctx, x, y, ang, size, color) {   // arrowhead at (x,y) pointing along screen angle ang
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x, y);
  ctx.lineTo(x - size * Math.cos(ang - 0.45), y - size * Math.sin(ang - 0.45));
  ctx.lineTo(x - size * Math.cos(ang + 0.45), y - size * Math.sin(ang + 0.45)); ctx.closePath(); ctx.fill();
}
function arrow(ctx, x1, y1, x2, y2, color, w) {
  const L = Math.hypot(x2 - x1, y2 - y1); if (L < 3) return;
  const a = Math.atan2(y2 - y1, x2 - x1), hd = Math.min(w * 4, L * 0.7);
  line(ctx, [[x1, y1], [x2 - Math.cos(a) * hd * 0.7, y2 - Math.sin(a) * hd * 0.7]], color, w);
  head(ctx, x2, y2, a, hd, color);
}
function pathArrow(ctx, pts, color, w, dash) {   // a line with an arrowhead at its end
  if (pts.length < 2) return;
  const n = pts.length - 1; let k = n - 1;
  while (k > 0 && Math.hypot(pts[n][0] - pts[k][0], pts[n][1] - pts[k][1]) < w * 3) k--;
  const a = Math.atan2(pts[n][1] - pts[k][1], pts[n][0] - pts[k][0]), hd = w * 4;
  line(ctx, pts.slice(0, n).concat([[pts[n][0] - Math.cos(a) * hd * 0.7, pts[n][1] - Math.sin(a) * hd * 0.7]]), color, w, dash);
  head(ctx, pts[n][0], pts[n][1], a, hd, color);
}
function arcPts(cx, cy, r, a0, a1, n) { const o = []; for (let i = 0; i <= (n || 40); i++) o.push(P(cx, cy, r, lerp(a0, a1, i / (n || 40)))); return o; }
function badge(ctx, x, y, letter, on, alpha) {
  ctx.globalAlpha = alpha;
  disc(ctx, x, y, 28, on ? C.orange : '#ffffff', on ? C.orange : C.navy, 4);
  ctx.font = '700 32px "Nunito Sans", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = on ? '#ffffff' : C.navy; ctx.fillText(letter, x, y + 1);
  ctx.globalAlpha = 1;
}
function clear(ctx) { ctx.clearRect(0, 0, 1920, 1080); }

// ================= globe seen from the side, with its atmosphere on the right =================
const G = { cx: 1360, cy: 520, R: 350, H: 100 };
const COL = { hadley: '#7b4bb0', ferrel: '#2f7d4f', polar: '#1f7a99', wind: '#d4610c', aloft: '#1e376c', hi: '#1667c4', lo: '#c8322a', jet: '#f47920', land: '#e4efd9', landEdge: '#7da36a', sea: '#dbe8f6' };
const gy = lat => G.cy - G.R * Math.sin(lat * DEG);

    desc: 'This animation builds the model of global atmospheric circulation step by step. It starts from a simple Earth with three assumptions, then removes them one at a time. The picture shows Earth from the side, with its atmosphere drawn on the right, much thicker than it really is. Three loops of moving air sit in each hemisphere, and arrows on Earth’s surface show the trade winds, the westerlies and the polar easterlies.' },
  assume: { still: 6, cap: { tag: 'Start simple', line: 'Three assumptions', sub: '1. Earth is made only of water. 2. The Sun is always over the equator. 3. Earth is not turning.' },
    desc: 'To start, imagine a simpler Earth with three assumptions. One: Earth is made only of water, with no land. Two: the Sun is always directly over the equator. Three: Earth is not turning. The picture shows an all-water Earth, the Sun shining straight at the equator, and Earth’s spin arrow crossed out.' },
  onecell: { still: 8, cap: { tag: 'With all three assumptions', line: 'One giant cell', sub: 'Hot air rises at the equator and flows high up toward the pole. There it cools, sinks, and flows back along the surface. Surface winds blow from the poles to the equator.' },
    desc: 'With all three assumptions, each hemisphere has one giant loop of air, a single Hadley cell reaching from the equator to the pole. The Sun heats the equator most, so warm air rises there, leaving low pressure at the surface. High up, the air flows toward the pole. Over the pole it cools and sinks, building high pressure. Then it flows back along the surface toward the equator. In the picture, the loop runs up at the equator, toward the pole aloft, down at the pole and back along the surface. Surface wind arrows point straight from each pole toward the equator: south in the Northern Hemisphere and north in the Southern Hemisphere.' },
  spin: { still: 7, cap: { tag: 'Remove assumption 3', line: 'Earth turns', sub: 'The Coriolis effect returns. Moving air turns to the right in the Northern Hemisphere and to the left in the Southern Hemisphere.' },
    desc: 'Now let Earth turn. Seen from above the North Pole, Earth rotates counter-clockwise, shown by a curved arrow around Earth’s axis above the North Pole. The Coriolis effect returns: moving air turns to the right in the Northern Hemisphere and to the left in the Southern Hemisphere. The surface winds flowing from each pole toward the equator start out straight, then bend. In both hemispheres they bend toward the west.' },
  split: { still: 7, cap: { tag: 'Remove assumption 3', line: 'One cell becomes three', sub: 'The single cell breaks into three in each hemisphere: the Hadley cell (0–30°), the Ferrel cell (30–60°) and the Polar cell (60–90°).' },
    desc: 'Dividing lines appear at 30° and 60° latitude, and the single giant cell breaks into three cells in each hemisphere. The Hadley cell, from the equator to 30°, rises at the equator and sinks near 30°. The Polar cell, from 60° to the pole, rises near 60° and sinks at the pole. The Ferrel cell sits between them, from 30° to 60°. It turns the opposite way, like a gear driven by its neighbors: it sinks near 30°, flows poleward along the surface, and rises near 60°.' },
  winds: { still: 8, cap: { tag: 'At the surface', line: 'Three wind belts', sub: 'Each cell drives its own surface winds. Air flowing toward the equator turns west, and air flowing toward the poles turns east.' },
    desc: 'Each cell creates a belt of surface winds. In the Hadley cells, air flows toward the equator and turns west, making the northeast trade winds in the Northern Hemisphere and the southeast trade winds in the Southern Hemisphere. In the Ferrel cells, from 30° to 60°, air flows toward the poles and turns east, making the westerlies in both hemispheres. In the Polar cells, air flows away from the poles and turns west, making the polar easterlies.' },
  jets: { still: 12, cap: { tag: 'High above the cells', line: 'The jet streams', sub: 'Jets form where the temperature difference between cells is largest. Air aloft flows from the warm side toward the cold side, and the Coriolis effect turns it to the east: the polar jet (near 60°) and the subtropical jet (near 30°).' },
    desc: 'Jet streams are narrow bands of very fast wind near the top of the troposphere. They form where the temperature gradient, the difference in temperature from one place to the next, is largest. That happens where two cells meet: near 60°, where cold polar air meets milder air along the polar front, and near 30°, at the poleward edge of the warm Hadley cell. High up, air flows from the warmer side toward the colder side. In the picture, navy arrows start moving toward the pole, from the side labeled Warmer toward the side labeled Colder, then bend to the east as the Coriolis effect turns them, right in the Northern Hemisphere and left in the Southern Hemisphere. The result is fast winds blowing from west to east: the polar jet near 60°, usually the stronger one, about 9 to 12 km up, and the subtropical jet near 30°, about 10 to 16 km up. Orange dots mark the jets at the top of the atmosphere, and wavy orange ribbons show them flowing east in both hemispheres.' },
  pressure: { still: 10, cap: { tag: 'Rising and sinking air', line: 'Belts of high and low pressure', sub: 'Rising air leaves low pressure at the equator and near 60°. Sinking air builds high pressure near 30° and at the poles.', box: ['Why the names?', 'Doldrums: near the equator, winds are light and sailing ships could be stuck for days. Horse latitudes: near 30°, sinking air brings calm, dry weather. Legend says becalmed ships threw horses overboard to save water.'] },
    desc: 'Because of the three-cell model, belts of high and low pressure form around Earth. At the equator, air rises, leaving a belt of low pressure called the equatorial low, or ITCZ. The surface wind arrows from the wind-belt scene are shown faintly, evenly spaced, as a reminder: winds blow out of the highs and toward the lows. Its light, changing winds are known as the doldrums, with frequent showers and thunderstorms. Near 30° north and south, air sinks, building the subtropical highs. Here the weather is calm and dry, many of the world’s deserts are found, and the belt is known as the horse latitudes. Near 60°, air rises again, making the subpolar lows, with stormy weather. At the poles, cold air sinks, making the polar highs. Sailors named the doldrums because ships could be stuck for days in the light winds. Legend says ships becalmed in the horse latitudes threw horses overboard to save water.' },
  sun: { still: 3.5, cap: { tag: 'Remove assumption 2', line: 'The belts follow the Sun', sub: 'Earth’s tilt moves the overhead Sun between 23.5°N in June and 23.5°S in December. The cells and pressure belts shift north and south with it.' },
    desc: 'Now let Earth be tilted. Through the year, the point where the Sun is directly overhead moves between the Tropic of Cancer, 23.5°N, around June, and the Tropic of Capricorn, 23.5°S, around December. The Sun moves up and down beside the globe, and its direct ray tracks this point. The cells and the belts of high and low pressure shift north and south with the Sun, though not as far. The equatorial low, or ITCZ, moves north in the northern summer and south in the northern winter.' },
  land: { still: 10, cap: { tag: 'Remove assumption 1', line: 'Land breaks up the belts', sub: 'Land heats and cools faster than water, and mountains and rough ground add friction. The belts break into separate highs and lows that return to the same places each year.' },
    desc: 'Finally, add the continents. A world map first shows the smooth belts: lows at the equator and near 60°, highs near 30°. Then land appears. Land heats and cools much faster than water, and mountains and rough ground add friction, so the belts break into separate highs and lows that return to roughly the same places each year. The map shows a typical January, northern winter. Over the oceans near 30° sit the Pacific High and the Bermuda High in the north, and the South Pacific, South Atlantic and Indian Ocean Highs in the south. Over cold Asia sits the Siberian High. Near 60° north sit the Aleutian Low and the Icelandic Low. Over hot northern Australia sits the Australian Low. A dashed line marks the ITCZ, which dips south over the southern continents.' },
  monsoon: { still: 16, cap: { tag: 'Highs and lows shift', line: 'India’s monsoon flips', sub: 'In winter, the Siberian High sends cold, dry air down off the mountains. In summer, it is replaced by a Thermal Low near the Indian coast that pulls in moist ocean air: the monsoon rains.' },
    desc: 'The map changes from January to July as the Sun moves north. The Pacific and Bermuda Highs grow stronger and move north. The Aleutian and Icelandic Lows fade. The Southern Hemisphere highs strengthen, and the Australian Low is replaced by a high. The ITCZ moves north, reaching farthest north over India. Most strikingly, the Siberian High disappears, and a Thermal Low forms over northwest India near the Arabian Sea coast. The map then zooms in on India. In January, cold, dry air drains down off the Himalayas and blows from the northeast across India and out to sea. These katabatic winds bring little rain. In July, the Low pulls moist air in from the Indian Ocean, from the southwest. The air rises over India and brings the monsoon rains. This flip matches the general shift of highs and lows with the Sun, made stronger because land heats and cools faster than the ocean.' },
  rain: { still: 2.5, cap: { tag: 'On the ground', line: 'Rainforests and deserts', sub: 'Rising air near the equator cools and builds clouds and rain almost every day: the rainforests. Sinking air near 30° warms and dries out: the great deserts.' },
    desc: 'The globe from the previous scene stays in place, with its three cells and its belts of high and low pressure. Faint continents appear on it, and the globe turns counter-clockwise, as seen from above the North Pole, so every continent passes by. Rainforests, shown in green, line up along the equator, under the belt of rising air and low pressure. Rising air cools, its water vapor condenses into clouds, and it rains heavily almost every day: the Amazon, the Congo, and Southeast Asia, including Indonesia and New Guinea. Deserts, shown in tan, line up near 30° north and south, under the subtropical highs. Sinking air warms and dries out, so clouds and rain are rare: the Sahara, the Arabian, the Sonoran, the Kalahari, the Atacama and the Australian deserts.' },
  summary: { still: 7, cap: { tag: 'Putting it together', line: 'The big picture', list: ['Earth’s rotation splits the general circulation into three cells.', 'Rainforests form under steady low pressure, and deserts under steady high pressure.', 'These highs and lows shift with the time of year and with land and sea.'] },
    desc: 'Two world maps of typical pressure patterns. The top map shows January: the Pacific and Bermuda Highs, the Siberian High over Asia, the Aleutian and Icelandic Lows, the South Pacific, South Atlantic and Indian Ocean Highs, the Australian Low, and the ITCZ dipping south over the southern continents. The bottom map shows July: the Pacific and Bermuda Highs are stronger and farther north, the Siberian High is replaced by the Thermal Low over northwest India, the Aleutian and Icelandic Lows have faded, the Southern Hemisphere highs are stronger, an Australian High replaces the Australian Low, and the ITCZ has moved north. Summary. One: Earth’s rotation splits the general circulation into three cells in each hemisphere. Two: rainforests form in regions of steady low pressure, and deserts form in regions of steady high pressure. Three: these pressure systems shift with the time of year and with the land masses.' },
};
SCENES.forEach(s => Object.assign(s, META[s.id]));


// ---------- player ----------
const $ = id => document.getElementById(id);
const stage = $('stage'), frame = $('frame'), body = document.body;
SCENES.forEach(s => { s.root = document.createElement('div'); s.root.className = 'layer'; stage.appendChild(s.root); s.init(s.root); });

const mqPort = matchMedia('(orientation: portrait) and (max-width: 640px)');
const mqLand = matchMedia('(orientation: landscape) and (max-height: 560px)');
const mqReduce = matchMedia('(prefers-reduced-motion: reduce)');
let mode = 'desk';
function fit() {
  const m = mqPort.matches ? 'port' : mqLand.matches ? 'land' : 'desk';
  if (m !== mode) { body.classList.remove('desk', 'land', 'port'); mode = m; }
  body.classList.add(mode);
  const port = mode === 'port';
  const s = frame.clientWidth / (port ? 1120 : 1920);
  if (!s) return;
  SCALE = s;
  stage.style.transform = 'scale(' + s + ')' + (port ? ' translateX(-800px)' : '');
  stage.classList.toggle('port', port);
  stage.classList.toggle('big', s < 0.55);
  const px = (target, lo, hi) => Math.min(hi, Math.max(lo, target / s)).toFixed(1) + 'px';
  stage.style.setProperty('--sub', px(15, 34, 46));
  stage.style.setProperty('--tag', px(13, 24, 42));
  applyText();
}
new ResizeObserver(fit).observe(frame);
[mqPort, mqLand].forEach(q => q.addEventListener ? q.addEventListener('change', fit) : q.addListener(fit));
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 250));

// scene text panel
let textOn = false;
try { textOn = localStorage.getItem('gac-text') === '1'; } catch (e) {}
const desc = $('desc'), textB = $('textB');
function applyText() {
  const shown = mode === 'port' || textOn;
  desc.classList.toggle('sr-only', !shown);
  textB.setAttribute('aria-expanded', textOn ? 'true' : 'false');
  textB.setAttribute('aria-label', textOn ? 'Hide scene text' : 'Show scene text');
}
function setText(on) { textOn = on; try { localStorage.setItem('gac-text', on ? '1' : '0'); } catch (e) {} applyText(); }
textB.onclick = () => setText(!textOn);
$('closeText').onclick = () => { setText(false); textB.focus(); };
$('skip').addEventListener('click', e => { e.preventDefault(); if (mode !== 'port') setText(true); desc.focus(); });

// scene navigation
const dots = $('dots'), title = $('title'), count = $('count'), nextB = $('next'), backB = $('back');
SCENES.forEach((s, i) => { const b = document.createElement('button'); b.setAttribute('aria-label', 'Go to scene ' + (i + 1) + ': ' + s.name); b.onclick = () => go(i); dots.appendChild(b); });
const esc = x => x.replace(/&/g, '&amp;').replace(/</g, '&lt;');
let cur = -1, start = performance.now(), prev = null, prevT = 0, fadeStart = 0, paused = false, pausedAt = 0, still = false;
const FADE = 0.4;
function sceneTime(now) { return ((paused ? pausedAt : now) - start) / 1000; }
function setPaused(p) {
  const now = performance.now();
  if (p === paused) return;
  if (paused) { start += now - pausedAt; paused = false; } else { pausedAt = now; paused = true; }
  $('pauseTxt').textContent = paused ? 'Play' : 'Pause';
  $('pause').setAttribute('aria-label', paused ? 'Play' : 'Pause');
  $('pauseIco').innerHTML = paused ? '<path d="M7 5l12 7-12 7z"/>' : '<path d="M8 5v14M16 5v14"/>';
}
function go(i) {
  if (i < 0 || i >= SCENES.length) return;
  const now = performance.now();
  const reduce = mqReduce.matches;
  if (i !== cur && cur >= 0 && !reduce) { prev = cur; prevT = sceneTime(now); fadeStart = now; } else prev = null;
  cur = i;
  const s = SCENES[i];
  if (reduce) { setPaused(false); start = now - s.still * 1000; setPaused(true); still = true; }
  else { start = now; if (paused) pausedAt = now; still = false; }
  title.textContent = 'Scene ' + (i + 1) + ' of ' + SCENES.length + ': ' + s.name;
  count.textContent = (i + 1) + ' of ' + SCENES.length;
  $('dTitle').textContent = 'Scene ' + (i + 1) + ' of ' + SCENES.length + ': ' + s.name;
  const c = s.cap;
  $('cap').innerHTML = '<p class="cap-tag">' + esc(c.tag) + '</p><p class="cap-line">' + esc(c.line) + '</p>' +
    (c.sub ? '<p class="cap-sub">' + esc(c.sub) + '</p>' : '') + (c.list ? '<ol class="cap-list">' + c.list.map(x => '<li>' + esc(x) + '</li>').join('') + '</ol>' : '') + (c.box ? '<div class="cap-box"><p class="cap-tag" style="color:var(--brand)">' + esc(c.box[0]) + '</p><p class="cap-sub">' + esc(c.box[1]) + '</p></div>' : '');
  $('dText').textContent = s.desc;
  [...dots.children].forEach((d, k) => { d.className = k === i ? 'on' : k < i ? 'done' : ''; if (k === i) d.setAttribute('aria-current', 'step'); else d.removeAttribute('aria-current'); });
  if (document.activeElement === backB && i === 0) nextB.focus();
  if (document.activeElement === nextB && i === SCENES.length - 1) backB.focus();
  backB.disabled = i === 0;
  nextB.disabled = i === SCENES.length - 1;
  if (mode === 'port') desc.scrollTop = 0;
}
function frameLoop(now) {
  const t = sceneTime(now);
  const fp = prev === null ? 1 : clamp01((now - fadeStart) / 1000 / FADE);
  SCENES.forEach((s, k) => { s.root.style.display = (k === cur || (k === prev && fp < 1)) ? 'block' : 'none'; });
  if (prev !== null && fp < 1) { const ps = SCENES[prev]; ps.root.style.opacity = 1 - fp; ps.root.style.zIndex = 1; ps.render(prevT + (now - fadeStart) / 1000); }
  else prev = null;
  const s = SCENES[cur];
  s.root.style.opacity = fp; s.root.style.zIndex = 2;
  s.render(Math.max(0, t));
  nextB.classList.toggle('ready', (t >= s.dur || still) && cur < SCENES.length - 1);
  requestAnimationFrame(frameLoop);
}
nextB.onclick = () => go(cur + 1);
backB.onclick = () => go(cur - 1);
$('replay').onclick = () => { prev = null; still = false; setPaused(false); start = performance.now(); };
$('pause').onclick = () => setPaused(!paused);

// full screen, hidden where the browser can't do it (such as Safari on iPhone)
const app = $('app');
const fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) && !!(app.requestFullscreen || app.webkitRequestFullscreen);
if (!fsOK) body.classList.add('no-fs');
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
$('full').onclick = () => {
  try {
    if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const r = (app.requestFullscreen || app.webkitRequestFullscreen).call(app); if (r && r.catch) r.catch(() => {}); }
  } catch (e) {}
};
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { $('full').setAttribute('aria-label', fsEl() ? 'Exit full screen' : 'Full screen'); fit(); }));

// keyboard
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const onButton = e.target.closest && e.target.closest('button, a');
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); go(cur + 1); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(cur - 1); }
  else if (k === ' ' || k === 'Spacebar') { if (!onButton) { e.preventDefault(); go(cur + 1); } }
  else if (k === 'Home') { e.preventDefault(); go(0); }
  else if (k === 'End') { e.preventDefault(); go(SCENES.length - 1); }
  else if (k === 'r' || k === 'R') $('replay').click();
  else if (k === 'p' || k === 'P') $('pause').click();
  else if ((k === 'f' || k === 'F') && fsOK) $('full').click();
  else if (k === 't' || k === 'T') setText(!textOn);
  else if (k === 'Escape' && textOn && mode === 'land') { setText(false); textB.focus(); }
});

// touch: swipe left/right, tap the right side for next and the far left for back (mouse clicks ignored)
let tp = null;
frame.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch') return; tp = { x: e.clientX, y: e.clientY, t: performance.now() }; });
frame.addEventListener('pointercancel', () => { tp = null; });
frame.addEventListener('pointerup', e => {
  if (e.pointerType !== 'touch' || !tp) return;
  const dx = e.clientX - tp.x, dy = e.clientY - tp.y, dt = performance.now() - tp.t; tp = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 800) { go(cur + (dx < 0 ? 1 : -1)); return; }
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 350) {
    const r = frame.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width;
    if (fx > 0.5) go(cur + 1); else if (fx < 0.25) go(cur - 1);
  }
});

// test hook: GAC.go(i), COR.seek(seconds) freezes the current scene at a moment
window.GAC = { go, seek(t) { setPaused(false); start = performance.now() - t * 1000; prev = null; setPaused(true); }, scenes: SCENES.length };

fit();
go(0);
requestAnimationFrame(frameLoop);
})();
</script>
