<script>
(function () {
document.documentElement.lang = 'en';
// ---------- helpers ----------
const clamp01 = x => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const TAU = Math.PI * 2, DEG = Math.PI / 180;
function h(html) { const tp = document.createElement('template'); tp.innerHTML = html.trim(); return tp.content.firstElementChild; }
function fadeFromRight(el, t, t0) {
  if (!el._w) {
    const words = el.textContent.split(' ');
    el.textContent = '';
    el._w = words.map((w, i) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w + (i < words.length - 1 ? ' ' : ''); el.appendChild(s); return s; });
  }
  el._w.forEach((s, i) => { const p = eo(seg(t, t0 + i * .11, t0 + i * .11 + .5)); s.style.opacity = p; s.style.transform = 'translateX(' + ((1 - p) * 26).toFixed(1) + 'px)'; });
}
function subIn(st, t, a) { const p = eo(seg(t, a, a + .6)); st.opacity = p; st.transform = 'translateX(' + lerp(26, 0, p) + 'px)'; }
const textBlock = (top, tag, line, sub) =>
  '<div class="words" style="left:140px;top:' + top + 'px;width:640px">' +
  '<p class="tag">' + tag + '</p><h2 class="line">' + line + '</h2>' + (sub ? '<p class="sub">' + sub + '</p>' : '') + '</div>';
function textRefs(self, root) { self.tagS = root.querySelector('.words .tag').style; self.line = root.querySelector('.words .line'); const s = root.querySelector('.words .sub'); self.subS = s && s.style; }
function textRender(self, t, subAt) { self.tagS.opacity = eo(seg(t, 0.2, 0.7)); fadeFromRight(self.line, t, 0.4); if (self.subS) subIn(self.subS, t, subAt); }
let SCALE = 0.6;   // current stage scale, used for canvas text size
const fpx = (target, lo, hi) => Math.min(hi, Math.max(lo, target / SCALE));

// ---------- canvas drawing kit ----------
const C = { navy: '#1e376c', ink: '#25282b', orange: '#f47920', orangeDk: '#d4610c', blue: '#1667c4', red: '#c8322a', grid: '#8fa7cc', sea: '#dbe8f6', grass: '#e4efd9', tree: '#a8cf94', treeEdge: '#5f8f4e', plate: '#f4f6fa', wedge: '#dfe6f2' };
const P = (cx, cy, r, a) => [cx + r * Math.cos(a), cy - r * Math.sin(a)];   // math angle (counterclockwise) to screen
function label(ctx, txt, x, y, color, size, align, weight) {
  ctx.font = (weight || 700) + ' ' + size + 'px "Nunito Sans", system-ui, sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.26; ctx.strokeStyle = 'rgba(255,255,255,.95)';
  ctx.strokeText(txt, x, y); ctx.fillStyle = color; ctx.fillText(txt, x, y);
  return ctx.measureText(txt).width;
}
function disc(ctx, x, y, r, fill, stroke, lw) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 3; ctx.stroke(); } }
function line(ctx, pts, color, w, dash) {
  if (pts.length < 2) return;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash(dash || []);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]); ctx.stroke(); ctx.setLineDash([]);
}
function head(ctx, x, y, ang, size, color) {   // arrowhead at (x,y) pointing along screen angle ang
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x, y);
  ctx.lineTo(x - size * Math.cos(ang - 0.45), y - size * Math.sin(ang - 0.45));
  ctx.lineTo(x - size * Math.cos(ang + 0.45), y - size * Math.sin(ang + 0.45)); ctx.closePath(); ctx.fill();
}
function arrow(ctx, x1, y1, x2, y2, color, w) {
  const L = Math.hypot(x2 - x1, y2 - y1); if (L < 3) return;
  const a = Math.atan2(y2 - y1, x2 - x1), hd = Math.min(w * 4, L * 0.7);
  line(ctx, [[x1, y1], [x2 - Math.cos(a) * hd * 0.7, y2 - Math.sin(a) * hd * 0.7]], color, w);
  head(ctx, x2, y2, a, hd, color);
}
function pathArrow(ctx, pts, color, w, dash) {   // a line with an arrowhead at its end
  if (pts.length < 2) return;
  const n = pts.length - 1; let k = n - 1;
  while (k > 0 && Math.hypot(pts[n][0] - pts[k][0], pts[n][1] - pts[k][1]) < w * 3) k--;
  const a = Math.atan2(pts[n][1] - pts[k][1], pts[n][0] - pts[k][0]), hd = w * 4;
  line(ctx, pts.slice(0, n).concat([[pts[n][0] - Math.cos(a) * hd * 0.7, pts[n][1] - Math.sin(a) * hd * 0.7]]), color, w, dash);
  head(ctx, pts[n][0], pts[n][1], a, hd, color);
}
function arcPts(cx, cy, r, a0, a1, n) { const o = []; for (let i = 0; i <= (n || 40); i++) o.push(P(cx, cy, r, lerp(a0, a1, i / (n || 40)))); return o; }
function badge(ctx, x, y, letter, on, alpha) {
  ctx.globalAlpha = alpha;
  disc(ctx, x, y, 28, on ? C.orange : '#ffffff', on ? C.orange : C.navy, 4);
  ctx.font = '700 32px "Nunito Sans", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = on ? '#ffffff' : C.navy; ctx.fillText(letter, x, y + 1);
  ctx.globalAlpha = 1;
}
function clear(ctx) { ctx.clearRect(0, 0, 1920, 1080); }

// ================= the merry-go-round =================
const RD = { cx: 1370, cy: 560, R: 330, D: 55 * DEG, F: 3 };
RD.w = RD.D / RD.F; RD.land = RD.R - 46;
/* o: { rot: ride angle, world: angle of the park around the ride, you, friend, aim, opts, pick, ball:[x,y], trail:[[x,y]], trailDash, freeze } */
function drawRide(ctx, o) {
  const { cx, cy, R } = RD;
  // the park around the ride (trees and lamps), turning only when seen from the ride
  disc(ctx, cx, cy, R + 150, C.grass);
  for (let k = 0; k < 12; k++) {
    const [x, y] = P(cx, cy, R + 92, o.world + k * TAU / 12 + 0.26);
    if (k % 2) disc(ctx, x, y, 30, C.tree, C.treeEdge, 3);
    else { disc(ctx, x, y, 12, '#ffffff', C.navy, 3); }
  }
  // the turning plate, with stripes so the turning shows
  disc(ctx, cx, cy, R, C.plate);
  for (let k = 0; k < 8; k += 2) {
    const a0 = o.rot + k * Math.PI / 4, a1 = a0 + Math.PI / 4;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, -a1, -a0); ctx.closePath(); ctx.fillStyle = C.wedge; ctx.fill();
  }

// ball position, seen from above (straight) or from the ride (curving)
function ballAt(t, T0, rideView) {

}
function trailTo(t, T0, rideView) {

}

// ================= Earth seen from above a pole =================
/* rot: Earth's turn angle; sign: +1 above the North Pole (counterclockwise), -1 above the South Pole (clockwise) */
function drawPolar(ctx, cx, cy, R, rot, o) {
  o = o || {}; const w = o.k || 1;
  disc(ctx, cx, cy, R, C.sea);
  ctx.setLineDash([10 * w, 8 * w]); [1 / 3, 2 / 3].forEach(f => disc(ctx, cx, cy, R * f, null, C.grid, 2.5 * w)); ctx.setLineDash([]);
  for (let k = 0; k < 12; k++) { const e = P(cx, cy, R, rot + k * Math.PI / 6); line(ctx, [[cx, cy], e], k === 0 ? C.navy : C.grid, (k === 0 ? 4 : 2.5) * w); }
  disc(ctx, cx, cy, R, null, C.navy, 5 * w);
  disc(ctx, cx, cy, 8 * w, C.navy);
  if (o.spin) {
    const s = o.sign || 1, a0 = o.spinAt === undefined ? 40 * DEG : o.spinAt;
    ctx.globalAlpha = o.spin; pathArrow(ctx, arcPts(cx, cy, R + 28 * w, a0 - s * 30 * DEG, a0 + s * 30 * DEG), C.navy, 6 * w);
    if (o.spinLabel) { const q = P(cx, cy, R + 70, a0); label(ctx, o.spinLabel, q[0], q[1], C.navy, fpx(13, 26, 42), o.spinAlign || 'left'); }
    ctx.globalAlpha = 1;
  }
}
// the turning Earth with winds bending right (title scene, and again in the recap)
function titleGlobe(ctx, cx, cy, R, t, k) {
  const base = ctx.globalAlpha;
  drawPolar(ctx, cx, cy, R, 0.25 * t, { spin: base, sign: 1, spinAt: 60 * DEG, k });
  ctx.globalAlpha = base * eo(seg(t, 1.6, 2.4));
  [-150, -30, 90].forEach((a0, i) => {
    const pts = [], p = eo(seg(t, 1.6 + i * 0.3, 3.2 + i * 0.3));
    for (let n = 0; n <= 40 * p; n++) { const u = n / 40; pts.push(P(cx, cy, R * (0.25 + 0.55 * u), a0 * DEG - 0.9 * u * u)); }
    if (pts.length > 2) pathArrow(ctx, pts, C.orange, 9 * k);
  });
  ctx.globalAlpha = base;
}
/* a rocket launched from the pole; its path through space is straight, its track on the ground curves */
function flight(ctx, cx, cy, R, t, o) {
  const s = o.sign || 1, W = o.D / o.F, Rl = R * 0.8;
  const te = Math.min(t, o.T0 + o.F), rot = s * W * (te - o.T0) + (o.rot0 || 0);
  drawPolar(ctx, cx, cy, R, rot, { spin: o.spin, sign: s, spinLabel: o.spinLabel, spinAt: o.spinAt, spinAlign: o.spinAlign });
  const tgt = P(cx, cy, Rl, o.aim + rot - (o.rot0 || 0));
  const tau = Math.max(0, te - o.T0);
  // target city, carried around by Earth
  ctx.globalAlpha = o.city === undefined ? 1 : o.city;
  ctx.fillStyle = C.navy; ctx.fillRect(tgt[0] - 13, tgt[1] - 13, 26, 26); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.strokeRect(tgt[0] - 13, tgt[1] - 13, 26, 26);
  if (o.cityLabel) label(ctx, 'Target', tgt[0] + (o.cityLabelDx || 24), tgt[1] + (o.cityLabelDy || 0), C.navy, fpx(13, 26, 42), (o.cityLabelDx || 24) > 0 ? 'left' : 'right');
  ctx.globalAlpha = 1;
  if (t < o.T0) {   // before launch: aim at the target
    ctx.globalAlpha = o.aimA === undefined ? 1 : o.aimA; line(ctx, [[cx, cy], tgt], C.navy, 3, [12, 10]); ctx.globalAlpha = 1;
    return;
  }
  // straight path through space
  const end = P(cx, cy, Rl, o.aim);
  ctx.globalAlpha = o.space === undefined ? 1 : o.space; line(ctx, [[cx, cy], P(cx, cy, Rl * tau / o.F, o.aim)], C.navy, 3, [12, 10]); ctx.globalAlpha = 1;
  // track on the ground
  const tr = [];
  for (let k = 0; k <= 60; k++) { const u = tau * k / 60; tr.push(P(cx, cy, Rl * u / o.F, o.aim + s * W * (tau - u))); }
  if (tau >= o.F - 1e-6) pathArrow(ctx, tr, C.orange, 7); else line(ctx, tr, C.orange, 7);
  // rocket
  if (tau < o.F) { const r = P(cx, cy, Rl * tau / o.F, o.aim); disc(ctx, r[0], r[1], 14, C.orange, C.navy, 3); }
  return { end, tgt, tr };
}

  count.textContent = (i + 1) + ' of ' + SCENES.length;
  $('dTitle').textContent = 'Scene ' + (i + 1) + ' of ' + SCENES.length + ': ' + s.name;
  const c = s.cap;
  $('cap').innerHTML = '<p class="cap-tag">' + esc(c.tag) + '</p><p class="cap-line">' + esc(c.line) + '</p>' +
    (c.sub ? '<p class="cap-sub">' + esc(c.sub) + '</p>' : '') + (c.box ? '<div class="cap-box"><p class="cap-tag" style="color:var(--brand)">' + esc(c.box[0]) + '</p><p class="cap-sub">' + esc(c.box[1]) + '</p></div>' : '');
  $('dText').textContent = s.desc;
  [...dots.children].forEach((d, k) => { d.className = k === i ? 'on' : k < i ? 'done' : ''; if (k === i) d.setAttribute('aria-current', 'step'); else d.removeAttribute('aria-current'); });

  if (document.activeElement === nextB && i === SCENES.length - 1) backB.focus();

  nextB.disabled = i === SCENES.length - 1;

function frameLoop(now) {
  const t = sceneTime(now);
  const fp = prev === null ? 1 : clamp01((now - fadeStart) / 1000 / FADE);
  SCENES.forEach((s, k) => { s.root.style.display = (k === cur || (k === prev && fp < 1)) ? 'block' : 'none'; });
  if (prev !== null && fp < 1) { const ps = SCENES[prev]; ps.root.style.opacity = 1 - fp; ps.root.style.zIndex = 1; ps.render(prevT + (now - fadeStart) / 1000); }
  else prev = null;
  const s = SCENES[cur];
  s.root.style.opacity = fp; s.root.style.zIndex = 2;
  s.render(Math.max(0, t));
  nextB.classList.toggle('ready', (t >= s.dur || still) && cur < SCENES.length - 1);
  requestAnimationFrame(frameLoop);
}
nextB.onclick = () => go(cur + 1);
backB.onclick = () => go(cur - 1);
$('replay').onclick = () => { prev = null; still = false; setPaused(false); start = performance.now(); };
$('pause').onclick = () => setPaused(!paused);

// full screen, hidden where the browser can't do it (such as Safari on iPhone)
const app = $('app');
const fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) && !!(app.requestFullscreen || app.webkitRequestFullscreen);
if (!fsOK) body.classList.add('no-fs');
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
$('full').onclick = () => {
  try {
    if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const r = (app.requestFullscreen || app.webkitRequestFullscreen).call(app); if (r && r.catch) r.catch(() => {}); }
  } catch (e) {}
};
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { $('full').setAttribute('aria-label', fsEl() ? 'Exit full screen' : 'Full screen'); fit(); }));

// keyboard
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const onButton = e.target.closest && e.target.closest('button, a');
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); go(cur + 1); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(cur - 1); }
  else if (k === ' ' || k === 'Spacebar') { if (!onButton) { e.preventDefault(); go(cur + 1); } }
  else if (k === 'Home') { e.preventDefault(); go(0); }
  else if (k === 'End') { e.preventDefault(); go(SCENES.length - 1); }
  else if (k === 'r' || k === 'R') $('replay').click();
  else if (k === 'p' || k === 'P') $('pause').click();
  else if ((k === 'f' || k === 'F') && fsOK) $('full').click();
  else if (k === 't' || k === 'T') setText(!textOn);
  else if (k === 'Escape' && textOn && mode === 'land') { setText(false); textB.focus(); }
});

// touch: swipe left/right, tap the right side for next and the far left for back (mouse clicks ignored)
let tp = null;
frame.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch') return; tp = { x: e.clientX, y: e.clientY, t: performance.now() }; });
frame.addEventListener('pointercancel', () => { tp = null; });
frame.addEventListener('pointerup', e => {
  if (e.pointerType !== 'touch' || !tp) return;
  const dx = e.clientX - tp.x, dy = e.clientY - tp.y, dt = performance.now() - tp.t; tp = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 800) { go(cur + (dx < 0 ? 1 : -1)); return; }
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 350) {
    const r = frame.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width;

// test hook: COR.go(i), COR.seek(seconds) freezes the current scene at a moment
window.COR = { go, seek(t) { setPaused(false); start = performance.now() - t * 1000; prev = null; setPaused(true); }, scenes: SCENES.length };

fit();
go(0);
requestAnimationFrame(frameLoop);
})();
</script>
