<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Niño–Southern Oscillation and Upwelling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&family=Zilla+Slab:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --page:#e3e9f3; --bar:#ffffff; --ink:#25282b; --muted:#55595e; --line:#cfd1d3;
  --btn:#f1f2f3; --btn-ink:#1e376c; --primary:#1e376c; --on-primary:#ffffff; --focus:#f47920;
  --track:#c3cfe4; --done:#7e96c4; --now:#f47920;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page:#0d1830; --bar:#132349; --ink:#ffffff; --muted:#c3cfe4; --line:#2a4a8c;
    --btn:#1e376c; --btn-ink:#ffffff; --primary:#faa634; --on-primary:#0d1830; --focus:#faa634;
    --track:#2a4a8c; --done:#7e96c4; --now:#faa634;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page:#0d1830; --bar:#132349; --ink:#ffffff; --muted:#c3cfe4; --line:#2a4a8c;
  --btn:#1e376c; --btn-ink:#ffffff; --primary:#faa634; --on-primary:#0d1830; --focus:#faa634;
  --track:#2a4a8c; --done:#7e96c4; --now:#faa634;
  color-scheme: dark;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; height: 100%; background: var(--page); color: var(--ink);
  font-family: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; grid-template-rows: 1fr auto; overflow: hidden;
}
.viewport { position: relative; min-height: 0; overflow: hidden; }
#stage {
  position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
  transform-origin: 50% 50%; overflow: hidden; border-radius: 6px;
  box-shadow: 0 12px 28px rgba(0,0,0,.18);
}
.bar {
  background: var(--bar); border-top: 1px solid var(--line);
  padding: 12px clamp(12px, 3vw, 32px) 14px;
  display: grid; gap: 10px;
}
.progress { display: flex; gap: 6px; }
.progress button {
  flex: 1; height: 8px; padding: 0; border: 0; border-radius: 4px; cursor: pointer;
  background: var(--track);
}
.progress button.done { background: var(--done); }
.progress button.now { background: var(--now); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.where { flex: 1; min-width: 140px; display: flex; align-items: baseline; gap: 10px; }
.where .count { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.where .name { font-family: "Zilla Slab", Georgia, serif; font-weight: 700; font-size: 22px; }
.ctl {
  font: inherit; font-size: 16px; font-weight: 700; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--btn); color: var(--btn-ink);
  padding: 10px 16px; min-height: 44px; display: inline-flex; align-items: center; gap: 8px;
}
.ctl svg { width: 18px; height: 18px; }
.ctl:disabled { opacity: .45; cursor: default; }
.ctl.next { background: var(--primary); color: var(--on-primary); border-color: var(--primary); padding: 10px 26px; }
.ctl:focus-visible, .progress button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.hint { color: var(--muted); font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 640px) {
  .hint { display: none; }
  .ctl .lbl { display: none; }
  .ctl.next .lbl { display: inline; }
}

/* Film styles, scoped to the stage */
#stage { --ground:#ffffff; --main:#1e376c; --second:#25282b; --accent:#f47920;
  --sans: "Nunito Sans", system-ui, sans-serif; --display: "Zilla Slab", Georgia, serif;
  color:var(--second); font-family:var(--sans); background: var(--ground); }
#stage .box { position:absolute; inset:0; }
#stage .ground { position:absolute; inset:0; background:var(--ground) }
#stage .words { position:absolute; margin:0; display:flex; flex-direction:column; gap:20px } #stage .words > * { margin:0 }
#stage .line { font-family:var(--display); font-size:76px; line-height:1.05; font-weight:700; color:var(--main) }
#stage .sub { font-size:34px; line-height:1.3; color:color-mix(in srgb, var(--second) 82%, var(--ground)) }
#stage .tag { font-size:24px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent) }
#stage .art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }
#stage .sea { fill:color-mix(in srgb, var(--main) 8%, var(--ground)) }
#stage .land { fill:color-mix(in srgb, var(--second) 16%, var(--ground)); stroke:color-mix(in srgb, var(--second) 34%, var(--ground)); stroke-width:2; stroke-linejoin:round }
#stage .eq { stroke:color-mix(in srgb, var(--main) 45%, var(--ground)); stroke-width:2; stroke-dasharray:14 12; fill:none }
#stage .warm { fill:var(--accent) } #stage .cold { fill:var(--main) }
#stage .wind { fill:none; stroke:var(--main); stroke-width:7; stroke-linecap:round; stroke-linejoin:round }
#stage .badge circle { fill:var(--ground); stroke:var(--main); stroke-width:5 }
#stage .badge text { font-family:var(--display); font-size:50px; font-weight:700; fill:var(--main); text-anchor:middle }
#stage .badge.hi circle { stroke:var(--accent) } #stage .badge.hi text { fill:var(--accent) }
#stage .pin { fill:var(--second) } #stage .pin-label { font-family:var(--sans); font-size:28px; font-weight:700; fill:var(--second) }
#stage .small { font-family:var(--sans); font-size:24px; fill:color-mix(in srgb, var(--second) 70%, var(--ground)); letter-spacing:.06em }
#stage .caption { position:absolute; left:120px; right:120px; top:930px; margin:0; font-size:32px; line-height:1.35; color:var(--second) }
#stage .chip { display:inline-block; align-self:flex-start; padding:8px 18px; border-radius:999px; background:var(--main); color:var(--ground); font-size:24px; font-weight:700; letter-spacing:.1em; text-transform:uppercase }
#stage .thermo { fill:none; stroke:var(--main); stroke-width:6; stroke-dasharray:18 10 }
#stage .fx-word { display:inline-block; }
#stage .monitor-slider { outline:none; }
#stage .monitor-hit { fill:transparent; cursor:ew-resize; touch-action:none; }
#stage .monitor-focus { fill:none; stroke:var(--accent); stroke-width:4; stroke-dasharray:10 8; opacity:0; }
#stage .monitor-slider:focus-visible .monitor-focus { opacity:1; }
</style>
</head>
<body>
<main class="viewport" id="viewport">
  <div id="stage" role="region" aria-label="Animated map of the tropical Pacific"></div>
</main>
<nav class="bar" aria-label="Animation controls">
  <div class="progress" id="progress"></div>
  <div class="row">
    <div class="where"><span class="count" id="count">1 / 9</span><span class="name" id="name">The Pacific</span></div>
    <span class="hint">Arrow keys move between scenes</span>
    <button class="ctl" id="prev" type="button" aria-label="Previous scene">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span class="lbl">Back</span></button>
    <button class="ctl" id="replay" type="button" aria-label="Replay this scene">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4h4"/></svg><span class="lbl">Replay</span></button>
    <button class="ctl" id="pause" type="button" aria-label="Pause animation" aria-pressed="false">
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span class="lbl" id="pauseLbl">Pause</span></button>
    <button class="ctl next" id="next" type="button"><span class="lbl" id="nextLbl">Next</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="sr" aria-live="polite" id="live"></div>
</nav>

<script>
(function () {
  // ---------- Kit ----------
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const seg = (t, a, b) => clamp01((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eo = x => 1 - Math.pow(1 - x, 3);
  const ei = x => x * x * x;
  const eio = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const eob = (x, s) => { s = s == null ? 1.4 : s; if (x <= 0) return 0; const y = x - 1; return 1 + (s + 1) * y * y * y + s * y * y; };
  const TextFx = {
    fadeFromRight(el, t, t0, o) {
      o = o || {}; const st = o.stagger == null ? 0.11 : o.stagger, dur = o.dur || 0.5, dx = o.dx == null ? 26 : o.dx;
      if (!el._words) {
        const words = el.textContent.split(' ');
        el.textContent = '';
        el._words = words.map((w, i) => {
          const s = document.createElement('span'); s.className = 'fx-word'; s.textContent = w;
          el.appendChild(s); if (i < words.length - 1) el.appendChild(document.createTextNode(' '));
          return s;
        });
      }
      el._words.forEach((s, i) => {
        const p = eo(seg(t, t0 + i * st, t0 + i * st + dur));
        s.style.opacity = p; s.style.transform = 'translateX(' + ((1 - p) * dx).toFixed(1) + 'px)';
      });
    }
  };
  const tpl = document.createElement('template');
  const SCENES = {};
  const kit = {
    seg, lerp, eo, ei, eio, eob, clamp01, TextFx, stage: null,
    h(html) { tpl.innerHTML = html.trim(); return tpl.content.firstElementChild; },
    scene(id, def) { SCENES[id] = def; }
  };

  // ---------- Shared map ----------
  window.ENSO = (function () {
    const X = lon => 60 + (lon - 100) * 9.5;
    const Y = lat => 600 - lat * 10;
    const L = (a, b, p) => a + (b - a) * p;
    const P = a => a.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ');
    const LAND = [
      [[90,32],[100,32],[100,22],[98,16],[100,13],[100,8],[101,3],[104,1.5],[103,4],[103,9],[105,9],[107,11],[109,12],[108,16],[106,19],[107,21],[110,21],[113,22],[117,23],[120,25],[122,32],[90,32]],
      [[95,5.5],[98,3.5],[104,-2],[106,-6],[104,-5.8],[101,-3],[97,1],[95,3]],
      [[105.5,-6.2],[111,-6.5],[114.5,-7.7],[114,-8.6],[108,-7.8],[105.5,-6.8]],
      [[109,1.5],[111,2.7],[116,7],[119,5],[118,1],[116.5,-3.5],[114,-4],[110.5,-3],[109,-0.5]],
      [[119.5,-5.5],[119,-1],[120.5,1],[125,1.5],[121,-1],[123,-4],[121,-4],[120.5,-5.5]],
      [[120,18.5],[122,18.5],[124,13],[126,9],[126,6.5],[124,7],[122,10],[120.5,14],[120,16]],
      [[131,-1],[135,-3.5],[138,-1.5],[142,-3],[147,-6],[150,-10.5],[147,-10],[143,-9],[141,-9],[138,-8],[137.5,-5],[133,-4],[132,-2.5]],
      [[113.5,-22],[114,-26],[115,-34],[135,-34],[150,-38],[153.5,-28],[153,-25],[150,-22],[146,-19],[145.5,-15],[143.5,-14],[142.5,-10.7],[141.5,-13],[141.5,-17],[139,-17.5],[136,-15],[137,-12],[133,-11.3],[130,-12.5],[129,-15],[126,-14],[122,-17],[120,-19.5],[116,-21]],
      [[245,32],[249,26],[253,23],[255,20.5],[259,18],[265,16],[268,15],[272,13],[275,10],[277.5,8],[280,9],[282,8],[282.5,7],[283,4],[281,1],[279.5,-2],[279,-4],[281,-6],[283,-12],[286,-15],[289.5,-18],[289.5,-32],[302,-32],[302,32]]
    ];
    const blob = cls => '<g class="' + cls + '"><ellipse rx="100" ry="100" opacity=".3"/><ellipse rx="74" ry="68" opacity=".3"/><ellipse rx="46" ry="38" opacity=".3"/></g>';
    function map(id, under, over) {
      return '<svg class="art" viewBox="0 0 1920 1080"><defs><clipPath id="' + id + '-clip"><rect x="0" y="300" width="1920" height="600"/></clipPath></defs>' +
        '<g clip-path="url(#' + id + '-clip)"><rect class="sea" x="0" y="300" width="1920" height="600"/>' +
        blob('warm ' + id + '-warm') + blob('cold ' + id + '-cold') + blob('warm ' + id + '-coast') + (under || '') +
        LAND.map(a => '<polygon class="land" points="' + P(a) + '"/>').join('') +
        [[204.5,19.6],[203,21.3],[201.8,21.5]].map(p => '<circle class="land" cx="' + X(p[0]) + '" cy="' + Y(p[1]) + '" r="6"/>').join('') +
        '<line class="eq" x1="0" y1="600" x2="1920" y2="600"/><text class="small" x="1012" y="590">EQUATOR</text></g>' + (over || '') + '</svg>';
    }
    function sst(stage, id, w, a) {
      const g = n => stage.querySelector('.' + id + '-' + n);
      const warm = g('warm'), cold = g('cold'), coast = g('coast');
      const c = w < 0 ? L(150, 138, -w) : L(150, 196, w);
      const rx = w < 0 ? L(330, 290, -w) : L(330, 560, w);
      warm.setAttribute('transform', 'translate(' + X(c) + ' 600) scale(' + (rx / 100) + ' 1.4)');
      warm.style.opacity = a;
      const west = w < 0 ? L(198, 166, -w) : L(198, 274, w);
      const crx = (X(281) - X(west)) / 2;
      cold.setAttribute('transform', 'translate(' + (X(west) + crx) + ' 612) scale(' + (crx / 100) + ' ' + (w < 0 ? L(0.62, 0.82, -w) : L(0.62, 0.4, w)) + ')');
      cold.style.opacity = a * (w > 0 ? 1 - 0.9 * w : 1);
      coast.setAttribute('transform', 'translate(' + X(266) + ' 606) scale(2.6 0.95)');
      coast.style.opacity = a * Math.max(0, w);
    }
    function winds(id, lats, n) {
      let s = '';
      lats.forEach(lat => { for (let j = 0; j < n; j++) s += '<path class="wind ' + id + '-w" data-lat="' + lat + '" data-j="' + j + '" data-n="' + n + '" d="M10 -15 L-10 0 L10 15"/>'; });
      return s;
    }
    function windNodes(stage, id) {
      return Array.from(stage.querySelectorAll('.' + id + '-w')).map(el => ({ el, lat: +el.dataset.lat, j: +el.dataset.j, n: +el.dataset.n }));
    }
    function wind(nodes, t, v, a, lon0, lon1) {
      const x0 = X(lon0 || 168), x1 = X(lon1 || 272), span = x1 - x0;
      nodes.forEach(o => {
        const gap = span / o.n;
        const off = ((t * Math.abs(v) + o.j * gap + (o.lat % 8 === 0 ? gap / 2 : 0)) % span + span) % span;
        const x = v >= 0 ? x1 - off : x0 + off;
        const fade = Math.max(0, Math.min(1, off / 90, (span - off) / 90));
        o.el.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + Y(o.lat) + ') scale(' + (v >= 0 ? 1 : -1) + ' 1)');
        o.el.style.opacity = a * fade;
      });
    }
    function badge(cls, lon, lat) {
      return '<g class="badge ' + cls + '" transform="translate(' + X(lon) + ' ' + (Y(lat) - 78) + ')"><circle r="44"/><text y="17">L</text></g>';
    }
    function pin(lon, lat, name, dx, anchor) {
      return '<circle class="pin" cx="' + X(lon) + '" cy="' + Y(lat) + '" r="9"/><text class="pin-label" x="' + (X(lon) + (dx || 18)) + '" y="' + (Y(lat) + 36) + '" text-anchor="' + (anchor || 'start') + '">' + name + '</text>';
    }
    return { X, Y, map, sst, winds, windNodes, wind, badge, pin };
  })();

  // ---------- Scenes ----------
  {
    const { seg, eo, eio, lerp, TextFx } = kit;
    kit.scene('pacific', {
      init(kit) {
        const E = window.ENSO;
        const over = '<g class="pacific-labels">' +
          '<text class="small" x="' + E.X(126) + '" y="' + E.Y(-24) + '">AUSTRALIA</text>' +
          '<text class="small" x="' + E.X(213) + '" y="' + E.Y(14) + '" text-anchor="middle">PACIFIC OCEAN</text>' +
          '<text class="small" x="' + E.X(286) + '" y="' + E.Y(-24) + '" text-anchor="end">SOUTH AMERICA</text>' +
          '<text class="small" x="' + E.X(112) + '" y="' + E.Y(-11.5) + '">INDONESIA</text></g>';
        kit.stage.append(kit.h('<div class="ground">' +
          '<div class="pacific-map" style="position:absolute;inset:0;transform-origin:960px 600px">' + E.map('pacific', '', over) + '</div>' +
          '<div class="words" style="left:120px;top:64px;width:1680px"><span class="tag pacific-tag">ENSO explained</span>' +
          '<h1 class="line pacific-title">El Niño–Southern Oscillation</h1>' +
          '<p class="sub pacific-sub">How winds, warm water and upwelling trade places across the tropical Pacific</p></div></div>'));
        const q = s => kit.stage.querySelector('.pacific-' + s);
        this.map = q('map').style; this.tag = q('tag').style; this.title = q('title'); this.sub = q('sub').style; this.labels = q('labels').style;
        this.stageEl = kit.stage;
      },
      render(t) {
        this.tag.opacity = eo(seg(t, 0, 0.5));
        TextFx.fadeFromRight(this.title, t, 0.1);
        this.sub.opacity = eo(seg(t, 1.0, 1.6));
        this.sub.transform = 'translateX(' + lerp(26, 0, eo(seg(t, 1.0, 1.6))) + 'px)';
        this.map.transform = 'scale(' + lerp(1, 1.025, eio(seg(t, 0, 5))) + ')';
        this.labels.opacity = eo(seg(t, 0.6, 1.4));
        window.ENSO.sst(this.stageEl, 'pacific', 0.06 * Math.sin(t * 0.9) * seg(t, 3.4, 5), eo(seg(t, 2.0, 3.4)));
      },
    });
  }
  {
    const { seg, eo, eio, eob, lerp, TextFx } = kit;
    kit.scene('seesaw', {
      init(kit) {
        const E = window.ENSO;
        const over = E.pin(130.8, -12.4, 'Darwin') + E.pin(210.5, -17.6, 'Tahiti') +
          '<path class="wind seesaw-flow" pathLength="1000" d="M1062 688 Q730 540 404 638" style="stroke-width:6;stroke-dasharray:1000"/>' +
          '<path class="wind seesaw-head" d="M-24 -15 L0 0 L-24 15" transform="translate(404 638) rotate(163)"/>' +
          '<g class="seesaw-dar">' + E.badge('lo', 130.8, -12.4) + '</g>' +
          '<g class="seesaw-tah">' + E.badge('hi', 210.5, -17.6) + '</g>';
        kit.stage.append(kit.h('<div class="ground">' + E.map('seesaw', '', over) +
          '<div class="words" style="left:120px;top:64px;width:1680px"><span class="tag">The Southern Oscillation</span>' +
          '<h2 class="line seesaw-title">A pressure seesaw</h2>' +
          '<p class="sub seesaw-sub">Normally, pressure is lower over Darwin and higher over Tahiti, so air flows east to west</p></div></div>'));
        const q = s => kit.stage.querySelector('.seesaw-' + s);
        this.title = q('title'); this.sub = q('sub').style; this.flow = q('flow').style; this.head = q('head').style;
        this.dar = q('dar'); this.tah = q('tah');
        this.tah.querySelector('text').textContent = 'H';
        [this.dar, this.tah].forEach(g => { g.style.transformBox = 'fill-box'; g.style.transformOrigin = '50% 50%'; });
        this.stageEl = kit.stage;
      },
      render(t) {
        window.ENSO.sst(this.stageEl, 'seesaw', 0, 1);
        TextFx.fadeFromRight(this.title, t, 0.2);
        this.sub.opacity = eo(seg(t, 0.9, 1.5));
        this.sub.transform = 'translateX(' + lerp(26, 0, eo(seg(t, 0.9, 1.5))) + 'px)';
        const b = 1 + 0.02 * Math.sin(t * 2.1);
        const d = eob(seg(t, 1.6, 2.2), 1.7), h = eob(seg(t, 2.1, 2.7), 1.7);
        this.dar.style.transform = 'scale(' + d * b + ')'; this.dar.style.opacity = seg(t, 1.6, 1.75);
        this.tah.style.transform = 'scale(' + h * b + ')'; this.tah.style.opacity = seg(t, 2.1, 2.25);
        // Air keeps flowing: the arrow redraws on a loop once it has appeared
        const lp = t < 4.4 ? seg(t, 3.0, 4.4) : 1;
        const dash = t < 4.4 ? '1000' : '60 40';
        this.flow.strokeDasharray = dash;
        this.flow.strokeDashoffset = t < 4.4 ? lerp(1000, 0, eio(lp)) : 100 - ((t - 4.4) * 120) % 100;
        this.flow.opacity = seg(t, 2.95, 3.05);
        this.head.opacity = eo(seg(t, 4.3, 4.6));
      },
    });
  }
  {
    const { seg, eo, eio, lerp, TextFx } = kit;
    kit.scene('trades', {
      init(kit) {
        const E = window.ENSO;
        const under = E.winds('trades', [12, 4, -4, -12], 6);
        const over = '<g class="trades-warmlbl"><text class="pin-label" x="' + E.X(150) + '" y="' + E.Y(13) + '" text-anchor="middle">Warm pool</text></g>' +
          '<g class="trades-coldlbl"><text class="pin-label" x="' + E.X(258) + '" y="' + E.Y(-16) + '" text-anchor="middle">Cooler water</text></g>';
        kit.stage.append(kit.h('<div class="ground">' + E.map('trades', under, over) +
          '<div class="words" style="left:120px;top:64px;width:1680px"><span class="tag">Normal conditions</span>' +
          '<h2 class="line trades-title">Trade winds blow west</h2>' +

        this.title = q('title'); this.sub = q('sub').style; this.cap = q('cap').style;
        this.box = q('box').style; this.lbl = q('lbl').style; this.co = q('co').style;
        this.gauge = q('gauge').style; this.mk = q('mk'); this.val = q('val'); this.ph = q('ph');
        this.gc = gc;
        this.stageEl = kit.stage;
        this.ring = q('ring'); this.hint = q('hint').style;
        this.slider = q('slider'); this.track = q('hit');
        // No oscillation: the gauge is a slider from the start, at 0 (Neutral)
        this.oscEnd = 0;
        this.manual = false; this.manualV = 0; this.manualAt = null; this.lastT = 0;
        const self = this;
        const redraw = () => self.render(self.lastT);
        const takeOver = () => { if (!self.manual) { self.manual = true; self.manualV = self.currentV || 0; self.manualAt = self.lastT; } };
        const setFrom = e => {
          const r = self.track.getBoundingClientRect();
          // The hit area extends 30 units past each end of the 560-unit scale
          const pad = r.width * (30 / 620);
          const v = ((e.clientX - r.left - pad) / (r.width - 2 * pad)) * 6 - 3;
          self.manualV = Math.round(Math.max(-3, Math.min(3, v)) * 10) / 10;
          redraw();
        };
        let dragging = false;
        this.track.addEventListener('pointerdown', e => {
          e.preventDefault(); takeOver(); dragging = true;
          self.track.setPointerCapture(e.pointerId); setFrom(e); self.slider.focus({ preventScroll: true });
        });
        this.track.addEventListener('pointermove', e => { if (dragging) setFrom(e); });
        const end = e => { dragging = false; };
        this.track.addEventListener('pointerup', end);
        this.track.addEventListener('pointercancel', end);
        this.slider.addEventListener('keydown', e => {
          const step = { ArrowRight: 0.1, ArrowUp: 0.1, ArrowLeft: -0.1, ArrowDown: -0.1, PageUp: 0.5, PageDown: -0.5 }[e.key];
          if (step == null && e.key !== 'Home' && e.key !== 'End') return;
          e.preventDefault(); e.stopPropagation(); takeOver();
          let v = e.key === 'Home' ? -3 : e.key === 'End' ? 3 : self.manualV + step;
          self.manualV = Math.round(Math.max(-3, Math.min(3, v)) * 10) / 10;
          redraw();
        });
      },
      render(t) {
        this.lastT = t;
        if (!this.manual && t >= this.oscEnd) { this.manual = true; this.manualV = 0; this.manualAt = 1.4; }
        let v;
        if (this.manual) {
          v = this.manualV;
        } else {
          // Eased phase: slow through Neutral and Weak, same pace as before at the peaks
          const th = (t - 1.2) * 0.276, phi = th - 0.225 * Math.sin(2 * th);
          v = 2.5 * Math.sin(phi) * eio(seg(t, 1.0, 2.0));
        }
        this.currentV = v;
        const a = v / 2.5;
        window.ENSO.sst(this.stageEl, 'monitor', Math.max(-1, Math.min(1, 0.35 + 0.65 * a)), 1);
        this.mk.setAttribute('cx', (this.gc + v / 3 * 280).toFixed(1));
        this.mk.style.fill = v >= 0 ? 'var(--accent)' : 'var(--main)';
        this.val.textContent = (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) + ' °C';
        const mag = Math.abs(v);
        const strength = mag >= 2.0 ? 'Very Strong ' : mag >= 1.5 ? 'Strong ' : mag >= 1.0 ? 'Moderate ' : 'Weak ';
        const phase = v >= 0.5 ? strength + 'El Niño' : v <= -0.5 ? strength + 'La Niña' : 'Neutral';
        this.ph.textContent = phase;
        this.ph.style.fill = v >= 0.5 ? 'var(--accent)' : v <= -0.5 ? 'var(--main)' : 'var(--second)';
        this.slider.setAttribute('aria-valuenow', v.toFixed(1));
        this.slider.setAttribute('aria-valuetext', this.val.textContent + ', ' + phase);
        // Slider affordances appear once it is interactive: a soft breathing ring and a hint
        const on = this.manual ? eo(seg(t, this.manualAt, this.manualAt + 0.6)) : 0;
        this.ring.setAttribute('cx', this.mk.getAttribute('cx'));
        this.ring.style.opacity = on * (0.55 + 0.25 * Math.sin(t * 2.2));
        this.ring.setAttribute('r', (30 + 3 * Math.sin(t * 2.2)).toFixed(1));
        this.hint.opacity = on;
        this.gauge.opacity = eo(seg(t, 1.2, 1.8));
        TextFx.fadeFromRight(this.title, t, 0.1);
        this.sub.opacity = eo(seg(t, 0.7, 1.3));
        this.sub.transform = 'translateX(' + lerp(26, 0, eo(seg(t, 0.7, 1.3))) + 'px)';
        this.box.strokeDashoffset = lerp(1000, 0, eio(seg(t, 0.6, 1.6)));
        this.box.opacity = seg(t, 0.55, 0.65);
        this.lbl.opacity = eo(seg(t, 1.4, 1.9));
        this.co.opacity = eo(seg(t, 1.7, 2.2));
        this.cap.opacity = eo(seg(t, 2.2, 2.8));
        this.cap.transform = 'translateX(' + lerp(26, 0, eo(seg(t, 2.2, 2.8))) + 'px)';
      },
    });
  }
  {
    const { seg, eo, eio, eob, lerp, TextFx } = kit;
    kit.scene('global', {
      init(kit) {
        let chev = '';
        for (let i = 0; i < 7; i++) chev += '<path class="wind global-w" d="M10 -12 L-8 0 L10 12" style="stroke-width:6"/>';
        const box = (x, y, w, h) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="16" style="fill:var(--ground);stroke:var(--main);stroke-width:4"/>';
        const svg = '<svg class="art" viewBox="0 0 1920 1080"><defs>' +
          '<clipPath id="global-c1"><rect x="630" y="452" width="660" height="60"/></clipPath>' +
          '<clipPath id="global-c2"><rect x="200" y="768" width="560" height="84" rx="8"/></clipPath>' +
          '<clipPath id="global-c3"><rect x="1160" y="768" width="560" height="84" rx="8"/></clipPath></defs>' +
          '<path class="wind global-a1" pathLength="1000" d="M790 524 Q640 590 500 644" style="stroke-dasharray:1000"/>' +
          '<path class="wind global-h1" d="M-24 -15 L0 0 L-24 15" transform="translate(500 644) rotate(158)"/>' +
          '<path class="wind global-a2" pathLength="1000" d="M1130 524 Q1280 590 1420 644" style="stroke-dasharray:1000"/>' +
          '<path class="wind global-h2" d="M-24 -15 L0 0 L-24 15" transform="translate(1420 644) rotate(22)"/>' +
          '<g class="global-top">' + box(610, 340, 700, 182) +
          '<text class="pin-label" x="960" y="394" text-anchor="middle" style="font-size:34px;fill:var(--main)">Shifts in atmospheric circulation</text>' +
          '<text class="small" x="960" y="434" text-anchor="middle">Pressure patterns and winds change</text>' +
          '<g clip-path="url(#global-c1)">' + chev + '</g></g>' +
          '<g class="global-l">' + box(160, 650, 640, 230) +
          '<text class="pin-label" x="480" y="704" text-anchor="middle" style="font-size:32px">ENSO in the tropical Pacific</text>' +
          '<text class="small" x="480" y="742" text-anchor="middle">Trade winds, warm water and upwelling shift</text>' +
          '<g clip-path="url(#global-c2)"><rect class="sea" x="200" y="768" width="560" height="84"/>' +
          '<ellipse class="global-warm" cy="810" ry="34" style="fill:var(--accent);opacity:.55"/>' +
          '<ellipse class="global-cold" cy="812" ry="24" style="fill:var(--main);opacity:.45"/></g></g>' +
          '<g class="global-r">' + box(1120, 650, 640, 230) +
          '<text class="pin-label" x="1440" y="704" text-anchor="middle" style="font-size:32px">Weather around the world</text>' +
          '<text class="small" x="1440" y="742" text-anchor="middle">Jet stream, storm tracks and rainfall shift</text>' +
          '<g clip-path="url(#global-c3)"><rect class="sea" x="1160" y="768" width="560" height="84"/>' +
          '<path class="global-jet" style="fill:none;stroke:var(--main);stroke-width:6;stroke-linecap:round"/></g></g>' +
          '</svg>';
        kit.stage.append(kit.h('<div class="ground">' + svg +
          '<div class="words" style="left:120px;top:64px;width:1680px"><span class="tag">ENSO and global weather</span>' +
          '<h2 class="line global-title">What El Niño tells about weather</h2>' +
          '<p class="sub global-sub">The change is rarely more than about 3°C. ENSO doesn’t cause weather changes elsewhere. The same shifts in atmospheric circulation that drive ENSO also shift weather around the world.</p></div>' +
          '<p class="caption global-cap">When ENSO develops, it signals that the atmosphere has shifted, and those same shifts reach weather far beyond the Pacific.</p></div>'));
        const q = s => kit.stage.querySelector('.global-' + s);
        this.title = q('title'); this.sub = q('sub').style; this.cap = q('cap').style;
        this.top = q('top'); this.l = q('l'); this.r = q('r');
        [this.top, this.l, this.r].forEach(g => { g.style.transformBox = 'fill-box'; g.style.transformOrigin = '50% 50%'; });
        this.a1 = q('a1').style; this.a2 = q('a2').style; this.h1 = q('h1').style; this.h2 = q('h2').style;
        this.warm = q('warm'); this.cold = q('cold'); this.jet = q('jet');
        this.chev = Array.from(kit.stage.querySelectorAll('.global-w'));
      },
      render(t) {
        TextFx.fadeFromRight(this.title, t, 0.1);
        this.sub.opacity = eo(seg(t, 0.7, 1.3));
        this.sub.transform = 'translateX(' + lerp(26, 0, eo(seg(t, 0.7, 1.3))) + 'px)';
        const pop = (g, a) => { const s = eob(seg(t, a, a + 0.5), 1.6); g.style.opacity = seg(t, a, a + 0.12); g.style.transform = 'scale(' + Math.max(0.001, s) + ')'; };
        pop(this.top, 1.6); pop(this.l, 3.0); pop(this.r, 3.3);
        // Arrows from the shared cause: draw on, then keep flowing downward
        [[this.a1, this.h1], [this.a2, this.h2]].forEach(p => {
          const drawn = t >= 3.0;
          p[0].strokeDasharray = drawn ? '50 30' : '1000';
          p[0].strokeDashoffset = drawn ? 80 - ((t - 3.0) * 100) % 80 : lerp(1000, 0, eio(seg(t, 2.2, 3.0)));
          p[0].opacity = seg(t, 2.15, 2.25);
          p[1].opacity = eo(seg(t, 2.9, 3.1));
        });
        this.chev.forEach((c, i) => {
          const off = ((t * 110 + i * 100) % 700);
          c.setAttribute('transform', 'translate(' + (1300 - off) + ' 484)');
          c.style.opacity = eo(seg(t, 1.9, 2.3)) * Math.min(1, off / 60, (700 - off) / 60);
        });
        const o = (Math.sin(t * 0.9) + 1) / 2;
        this.warm.setAttribute('cx', lerp(330, 540, o)); this.warm.setAttribute('rx', lerp(150, 200, o));
        this.cold.setAttribute('cx', 760); this.cold.setAttribute('rx', lerp(200, 50, o));
        const amp = 20 + 10 * Math.sin(t * 0.9), ph = t * 1.2;
        let d = '';
        for (let x = 1150; x <= 1730; x += 20) d += (x === 1150 ? 'M' : 'L') + x + ' ' + (810 + amp * Math.sin((x - 1160) / 560 * Math.PI * 3 + ph)).toFixed(1) + ' ';
        this.jet.setAttribute('d', d);
        this.cap.opacity = eo(seg(t, 4.4, 5.0));
        this.cap.transform = 'translateX(' + lerp(26, 0, eo(seg(t, 4.4, 5.0))) + 'px)';
      },
    });
  }
  {
    const { seg, eo, lerp, TextFx } = kit;
    kit.scene('end', {
      init(kit) {
        kit.stage.append(kit.h('<div class="ground">' +
          '<div class="words" style="left:160px;top:230px;width:1600px;gap:28px">' +
          '<h2 class="line end-title" style="font-size:88px">El Niño–Southern Oscillation (ENSO)</h2>' +
          '<div class="end-bar" style="width:220px;height:8px;border-radius:4px;background:var(--accent);transform-origin:0 50%"></div>' +
          '<p class="sub end-sum" style="color:var(--second)">Winds steer the water. Upwelling sets the temperature.</p>' +
          '<div class="end-rows" style="display:flex;gap:80px;margin-top:24px">' +
          '<div class="end-a" style="display:flex;flex-direction:column;gap:14px;width:720px"><span class="chip">El Niño · warm phase</span><p class="sub" style="margin:0">Weaker trade winds, less upwelling, a warmer eastern Pacific</p></div>' +
          '<div class="end-b" style="display:flex;flex-direction:column;gap:14px;width:720px"><span class="chip">La Niña · cool phase</span><p class="sub" style="margin:0">Stronger trade winds, more upwelling, a cooler eastern Pacific</p></div></div></div>' +
          '<p class="caption end-src" style="font-size:24px">Source: NOAA JetStream, El Niño/Southern Oscillation</p></div>'));
        const q = s => kit.stage.querySelector('.end-' + s);
        this.title = q('title'); this.bar = q('bar').style; this.a = q('a').style; this.b = q('b').style; this.sum = q('sum').style; this.src = q('src').style;
      },
      render(t) {
        TextFx.fadeFromRight(this.title, t, 0.0, { stagger: 0.09 });
        this.bar.transform = 'scaleX(' + eo(seg(t, 0.6, 1.1)) + ')';
        this.sum.opacity = eo(seg(t, 0.9, 1.4));
        this.sum.transform = 'translateX(' + lerp(26, 0, eo(seg(t, 0.9, 1.4))) + 'px)';
        this.a.opacity = eo(seg(t, 1.4, 1.9));
        this.a.transform = 'translateY(' + lerp(24, 0, eo(seg(t, 1.4, 1.9))) + 'px)';
        this.b.opacity = eo(seg(t, 1.7, 2.2));
        this.b.transform = 'translateY(' + lerp(24, 0, eo(seg(t, 1.7, 2.2))) + 'px)';
        this.src.opacity = eo(seg(t, 2.2, 2.7));
      },
    });
  }

  // ---------- Player ----------
  const ORDER = [
    ['pacific', 'The Pacific'], ['seesaw', 'Pressure seesaw'], ['trades', 'Trade winds'],
    ['upwelling', 'Upwelling'], ['el-nino', 'El Niño'], ['rain-shift', 'Rain shifts'],
    ['la-nina', 'La Niña'], ['monitor', 'Niño 3.4'], ['global', 'Global weather'], ['end', 'Summary']
  ];
  const stage = document.getElementById('stage');
  const viewport = document.getElementById('viewport');
  const prog = document.getElementById('progress');
  const $ = id => document.getElementById(id);
  let idx = 0, t = 0, paused = false, last = null, current = null;

  ORDER.forEach((s, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('aria-label', 'Go to scene ' + (i + 1) + ': ' + s[1]);
    b.addEventListener('click', () => go(i));
    prog.appendChild(b);
  });

  function fit() {
    const w = viewport.clientWidth, h = viewport.clientHeight, pad = Math.min(32, w * 0.03);
    const s = Math.max(0.05, Math.min((w - pad * 2) / 1920, (h - pad * 2) / 1080));
    stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);

  function go(i) {
    idx = (i + ORDER.length) % ORDER.length;
    stage.innerHTML = '';
    const box = document.createElement('div'); box.className = 'box';
    stage.appendChild(box);
    kit.stage = box;
    current = SCENES[ORDER[idx][0]];
    current.init.call(current, kit);
    t = 0; last = null;
    current.render.call(current, 0, kit);
    $('count').textContent = (idx + 1) + ' / ' + ORDER.length;
    $('name').textContent = ORDER[idx][1];
    $('prev').disabled = idx === 0;
    $('nextLbl').textContent = idx === ORDER.length - 1 ? 'Start over' : 'Next';
    $('next').setAttribute('aria-label', idx === ORDER.length - 1 ? 'Start over from the first scene' : 'Next scene');
    Array.from(prog.children).forEach((b, j) => {
      b.className = j < idx ? 'done' : j === idx ? 'now' : '';
      if (j === idx) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    });
    $('live').textContent = 'Scene ' + (idx + 1) + ' of ' + ORDER.length + ': ' + ORDER[idx][1] + '. ' + box.textContent.replace(/\s+/g, ' ').trim();
  }

  function setPaused(p) {
    paused = p; last = null;
    $('pause').setAttribute('aria-pressed', String(p));
    $('pause').setAttribute('aria-label', p ? 'Play animation' : 'Pause animation');
    $('pauseLbl').textContent = p ? 'Play' : 'Pause';
    $('pauseIcon').innerHTML = p ? '<path d="M7 5l12 7-12 7z"/>' : '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
  }

  function frame(now) {
    if (!paused && current) {
      if (last != null) t += Math.min(0.1, (now - last) / 1000);
      last = now;
      current.render.call(current, t, kit);
    }
    requestAnimationFrame(frame);
  }

  $('next').addEventListener('click', () => go(idx + 1));
  $('prev').addEventListener('click', () => { if (idx > 0) go(idx - 1); });
  $('replay').addEventListener('click', () => go(idx));
  $('pause').addEventListener('click', () => setPaused(!paused));
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
    if (e.target.closest && e.target.closest('[role="slider"]') && e.key !== ' ') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(idx + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); if (idx > 0) go(idx - 1); }
    else if (e.key === 'p' || e.key === 'P') setPaused(!paused);
    else if (e.key === 'r' || e.key === 'R') go(idx);
  });

  fit();
  go(0);
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    // Show each scene's finished state, paused, for people who prefer less motion
    const goOrig = go;
    go = function (i) { goOrig(i); t = 8; current.render.call(current, t, kit); };
    go(0);
    setPaused(true);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
