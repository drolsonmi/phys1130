<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Niño–Southern Oscillation and Upwelling, in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&family=Zilla+Slab:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --page:#e3e9f3; --bar:#ffffff; --ink:#25282b; --muted:#55595e; --line:#cfd1d3;
  --btn:#f1f2f3; --btn-ink:#1e376c; --primary:#1e376c; --on-primary:#ffffff; --focus:#f47920;
  --track:#c3cfe4; --done:#7e96c4; --now:#f47920;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page:#0d1830; --bar:#132349; --ink:#ffffff; --muted:#c3cfe4; --line:#2a4a8c;
    --btn:#1e376c; --btn-ink:#ffffff; --primary:#faa634; --on-primary:#0d1830; --focus:#faa634;
    --track:#2a4a8c; --done:#7e96c4; --now:#faa634;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page:#0d1830; --bar:#132349; --ink:#ffffff; --muted:#c3cfe4; --line:#2a4a8c;
  --btn:#1e376c; --btn-ink:#ffffff; --primary:#faa634; --on-primary:#0d1830; --focus:#faa634;
  --track:#2a4a8c; --done:#7e96c4; --now:#faa634;
  color-scheme: dark;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; height: 100%; background: var(--page); color: var(--ink);
  font-family: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; grid-template-rows: 1fr auto; overflow: hidden;
}
.viewport { position: relative; min-height: 0; overflow: hidden; }
#stage {
  position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
  transform-origin: 50% 50%; overflow: hidden; border-radius: 6px;
  box-shadow: 0 12px 28px rgba(0,0,0,.18);
}
.bar {
  background: var(--bar); border-top: 1px solid var(--line);
  padding: 12px clamp(12px, 3vw, 32px) 14px;
  display: grid; gap: 10px;
}
.progress { display: flex; gap: 6px; }
.progress button {
  flex: 1; height: 8px; padding: 0; border: 0; border-radius: 4px; cursor: pointer;
  background: var(--track);
}
.progress button.done { background: var(--done); }
.progress button.now { background: var(--now); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.where { flex: 1; min-width: 140px; display: flex; align-items: baseline; gap: 10px; }
.where .count { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.where .name { font-family: "Zilla Slab", Georgia, serif; font-weight: 700; font-size: 22px; }
.ctl {
  font: inherit; font-size: 16px; font-weight: 700; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--btn); color: var(--btn-ink);
  padding: 10px 16px; min-height: 44px; display: inline-flex; align-items: center; gap: 8px;
}
.ctl svg { width: 18px; height: 18px; }
.ctl:disabled { opacity: .45; cursor: default; }
.ctl.next { background: var(--primary); color: var(--on-primary); border-color: var(--primary); padding: 10px 26px; }
.ctl:focus-visible, .progress button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.hint { color: var(--muted); font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 18px; color: var(--ink); }
@media (max-width: 640px) {
  .hint { display: none; }
  .ctl .lbl { display: none; }
  .ctl.next .lbl { display: inline; }
}

/* Film styles, scoped to the stage */
#stage { --ground:#ffffff; --main:#1e376c; --second:#25282b; --accent:#f47920;
  --sans: "Nunito Sans", system-ui, sans-serif; --display: "Zilla Slab", Georgia, serif;
  color:var(--second); font-family:var(--sans); background: var(--ground); }
#stage canvas.gl { position:absolute; left:0; top:0; width:1920px; height:1080px; display:block; }
#stage .layer { position:absolute; inset:0; pointer-events:none; }
#stage .veil { position:absolute; inset:0; background:var(--ground); opacity:0; pointer-events:none; }
#stage .box { position:absolute; inset:0; pointer-events:none; }
#stage .ground { position:absolute; inset:0; }
#stage .words { position:absolute; margin:0; display:flex; flex-direction:column; gap:20px } #stage .words > * { margin:0 }
#stage .line { font-family:var(--display); font-size:76px; line-height:1.05; font-weight:700; color:var(--main) }
#stage .sub { font-size:34px; line-height:1.3; color:color-mix(in srgb, var(--second) 82%, var(--ground)) }
#stage .tag { font-size:24px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent) }
#stage .art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }
#stage .sea { fill:color-mix(in srgb, var(--main) 8%, var(--ground)) }
#stage .wind { fill:none; stroke:var(--main); stroke-width:7; stroke-linecap:round; stroke-linejoin:round }
#stage .pin-label { font-family:var(--sans); font-size:28px; font-weight:700; fill:var(--second) }
#stage .small { font-family:var(--sans); font-size:24px; fill:color-mix(in srgb, var(--second) 70%, var(--ground)); letter-spacing:.06em }
#stage .caption { position:absolute; left:120px; right:120px; top:950px; margin:0; font-size:32px; line-height:1.35; color:var(--second);
  padding:10px 18px; border-radius:10px; background:color-mix(in srgb, var(--ground) 86%, transparent); width:fit-content; max-width:1680px }
#stage .chip { display:inline-block; align-self:flex-start; padding:8px 18px; border-radius:999px; background:var(--main); color:var(--ground); font-size:24px; font-weight:700; letter-spacing:.1em; text-transform:uppercase }
#stage .fx-word { display:inline-block; }
#stage .l3 { position:absolute; left:0; top:0; white-space:nowrap; font-size:28px; font-weight:700; color:var(--second);
  padding:4px 14px; border-radius:8px; background:color-mix(in srgb, var(--ground) 88%, transparent); opacity:0; will-change:transform }
#stage .l3.cap { font-size:22px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 75%, var(--ground)) }
#stage .l3.acc { color:var(--accent) } #stage .l3.blue { color:var(--main) }
#stage .l3.ondeep { background:color-mix(in srgb, var(--main) 80%, transparent); color:var(--ground) }
#stage .badge3 { position:absolute; left:0; top:0; width:92px; height:92px; margin:-46px 0 0 -46px; border-radius:50%;
  background:var(--ground); border:6px solid var(--main); display:grid; place-items:center;
  font-family:var(--display); font-weight:700; font-size:54px; line-height:1; color:var(--main); opacity:0 }
#stage .badge3.hi { border-color:var(--accent); color:var(--accent) }
#stage .panel { position:absolute; left:1150px; top:672px; width:700px; height:240px; border-radius:16px;
  background:color-mix(in srgb, var(--ground) 92%, transparent); box-shadow:0 4px 12px rgba(0,0,0,.10) }
#stage .monitor-slider { outline:none; }
#stage .monitor-hit { fill:transparent; cursor:ew-resize; touch-action:none; pointer-events:all; }
#stage .monitor-focus { fill:none; stroke:var(--accent); stroke-width:4; stroke-dasharray:10 8; opacity:0; }
#stage .monitor-slider:focus-visible .monitor-focus { opacity:1; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<main class="viewport" id="viewport">
  <div id="stage" role="region" aria-label="3D view of the tropical Pacific from the southeast"></div>
</main>
<nav class="bar" aria-label="Animation controls">
  <div class="progress" id="progress"></div>
  <div class="row">
    <div class="where"><span class="count" id="count">1 / 10</span><span class="name" id="name">The Pacific</span></div>
    <span class="hint">Arrow keys move between scenes</span>
    <button class="ctl" id="prev" type="button" aria-label="Previous scene">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span class="lbl">Back</span></button>
    <button class="ctl" id="replay" type="button" aria-label="Replay this scene">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4h4"/></svg><span class="lbl">Replay</span></button>
    <button class="ctl" id="pause" type="button" aria-label="Pause animation" aria-pressed="false">
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span class="lbl" id="pauseLbl">Pause</span></button>
    <button class="ctl next" id="next" type="button"><span class="lbl" id="nextLbl">Next</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="sr" aria-live="polite" id="live"></div>
</nav>

<script>
(function () {
  const viewportEl = document.getElementById('viewport');
  let glOK = !!window.THREE;
  if (glOK) { try { const c = document.createElement('canvas'); glOK = !!(c.getContext('webgl') || c.getContext('experimental-webgl')); } catch (e) { glOK = false; } }
  if (!glOK) {
    viewportEl.innerHTML = '<div class="nogl">This 3D version needs WebGL, which isn’t available in this browser. Try another browser or device.</div>';
    return;
  }

  // ---------- Kit ----------
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const seg = (t, a, b) => clamp01((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eo = x => 1 - Math.pow(1 - x, 3);
  const eio = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const eob = (x, s) => { s = s == null ? 1.4 : s; if (x <= 0) return 0; const y = x - 1; return 1 + (s + 1) * y * y * y + s * y * y; };
  const sm = (a, b, x) => { const k = clamp01((x - a) / (b - a)); return k * k * (3 - 2 * k); };
  const TextFx = {
    fadeFromRight(el, t, t0, o) {
      o = o || {}; const st = o.stagger == null ? 0.11 : o.stagger, dur = o.dur || 0.5, dx = o.dx == null ? 26 : o.dx;
      if (!el._words) {
        const words = el.textContent.split(' ');
        el.textContent = '';
        el._words = words.map((w, i) => {
          const s = document.createElement('span'); s.className = 'fx-word'; s.textContent = w;
          el.appendChild(s); if (i < words.length - 1) el.appendChild(document.createTextNode(' '));
          return s;
        });
      }
      el._words.forEach((s, i) => {
        const p = eo(seg(t, t0 + i * st, t0 + i * st + dur));
        s.style.opacity = p; s.style.transform = 'translateX(' + ((1 - p) * dx).toFixed(1) + 'px)';
      });
    }
  };
  const tpl = document.createElement('template');
  const SCENES = {};
  const kit = {
    seg, lerp, eo, eio, eob, sm, clamp01, TextFx, stage: null,
    h(html) { tpl.innerHTML = html.trim(); return tpl.content.firstElementChild; },
    scene(id, def) { SCENES[id] = def; },
    // A label pinned to a 3D point (lon, height, lat); call place() in render
    label(cls, text) { const el = document.createElement('div'); el.className = 'l3 ' + (cls || ''); el.textContent = text; kit.stage.appendChild(el); return el; },
    place(el, lon, y, lat, op, dy) {
      const p = World.project(lon, y, lat);
      el.style.transform = 'translate(' + p[0].toFixed(1) + 'px,' + (p[1] + (dy || 0)).toFixed(1) + 'px) translate(-50%,-100%)';
      el.style.opacity = p[2] ? op : 0;
    },
    redraw: null
  };

  // ---------- 3D world ----------
  const World = (function () {
    const T3 = window.THREE;
    const LON0 = 92, LON1 = 300, LAT0 = -30, LAT1 = 30, LS = 1.8, VS = 0.6, D = 12, A = 0.9;
    const X = lon => lon - 195, Z = lat => -lat * LS;
    const col = h => new T3.Color(h);
    const C = {
      sea: col(0xd5dfee), warm: col(0xf47920), cold: col(0x3f5a92), deep: col(0x566990), warmLayer: col(0xf9bf95),
      main: col(0x1e376c)
    };
    const LAND = [
      [[90,29.6],[100,29.6],[100,22],[98,16],[100,13],[100,8],[101,3],[104,1.5],[103,4],[103,9],[105,9],[107,11],[109,12],[108,16],[106,19],[107,21],[110,21],[113,22],[117,23],[120,25],[121,29.6]],
      [[95,5.5],[98,3.5],[104,-2],[106,-6],[104,-5.8],[101,-3],[97,1],[95,3]],
      [[105.5,-6.2],[111,-6.5],[114.5,-7.7],[114,-8.6],[108,-7.8],[105.5,-6.8]],
      [[109,1.5],[111,2.7],[116,7],[119,5],[118,1],[116.5,-3.5],[114,-4],[110.5,-3],[109,-0.5]],
      [[119.5,-5.5],[119,-1],[120.5,1],[125,1.5],[121,-1],[123,-4],[121,-4],[120.5,-5.5]],
      [[120,18.5],[122,18.5],[124,13],[126,9],[126,6.5],[124,7],[122,10],[120.5,14],[120,16]],
      [[131,-1],[135,-3.5],[138,-1.5],[142,-3],[147,-6],[150,-10.5],[147,-10],[143,-9],[141,-9],[138,-8],[137.5,-5],[133,-4],[132,-2.5]],
      [[113.5,-22],[114,-26],[114.6,-29.6],[152.5,-29.6],[153.5,-28],[153,-25],[150,-22],[146,-19],[145.5,-15],[143.5,-14],[142.5,-10.7],[141.5,-13],[141.5,-17],[139,-17.5],[136,-15],[137,-12],[133,-11.3],[130,-12.5],[129,-15],[126,-14],[122,-17],[120,-19.5],[116,-21]],
      [[249.5,29.6],[251,26],[253,23],[255,20.5],[259,18],[265,16],[268,15],[272,13],[275,10],[277.5,8],[280,9],[282,8],[282.5,7],[283,4],[281,1],[279.5,-2],[279,-4],[281,-6],[283,-12],[286,-15],[289.5,-18],[289.5,-29.6],[299.6,-29.6],[299.6,29.6]]
    ];
    let renderer, scene, camera, layer, veil, badgeL, badgeH, pins = [], places = [], regions = [];
    const group = new T3.Group();
    const surf = [], boxes = {};
    let xsGeo, xsMesh, pIn, pOut, upArrow, chev = [], chevMat, clouds = [];
    let windPhase = 0, upPhase = 0;
    let Lp = [132, -8], Hp = [212, -18], curE = 0, curTs = 1, slopeA = 1;
    const tmpM = new T3.Matrix4(), tmpV = new T3.Vector3(), tmpQ = new T3.Quaternion(), tmpS = new T3.Vector3();

    function hAt(lon) { return slopeA * A * curTs * (195 - lon) / 95; }
    function thermo(lon, e) {
      const w = e >= 0 ? lerp(10, 7, e) : lerp(10, 11, -e);
      const east = e >= 0 ? lerp(2, 6.5, e) : lerp(2, 1.2, -e);
      return VS * (w + (east - w) * sm(140, 282, lon));
    }
    function sst(lon, lat, w) {
      const c = w < 0 ? lerp(150, 138, -w) : lerp(150, 196, w);
      const rx = (w < 0 ? lerp(330, 290, -w) : lerp(330, 560, w)) / 9.5;
      const dx = (lon - c) / rx, dy = lat / 15;
      const warm = Math.exp(-(dx * dx + dy * dy) * 2.0);
      const west = w < 0 ? lerp(198, 166, -w) : lerp(198, 274, w);
      const cc = (west + 281) / 2, hw = Math.max(2, (281 - west) / 2);
      const ry = (w < 0 ? lerp(0.62, 0.82, -w) : lerp(0.62, 0.4, w)) * 10;
      const ex = (lon - cc) / hw, ey = (lat + 1.2) / ry;
      const cold = Math.exp(-(ex * ex * ex * ex + ey * ey) * 1.6) * (w > 0 ? 1 - 0.9 * w : 1 + 0.2 * -w);
      const kx = (lon - 266) / 26, ky = (lat + 0.6) / 9.5;
      const coast = Math.exp(-(kx * kx + ky * ky) * 2.0) * Math.max(0, w);
      return Math.max(-1, Math.min(1, 0.9 * warm + 0.9 * coast - 0.85 * cold));
    }

    function makeSurface(lat0, lat1, segZ) {
      const g = new T3.PlaneGeometry(LON1 - LON0, (lat1 - lat0) * LS, 104, segZ);
      g.rotateX(-Math.PI / 2);
      g.translate(X((LON0 + LON1) / 2), 0, Z((lat0 + lat1) / 2));
      const n = g.attributes.position.count;
      g.setAttribute('color', new T3.BufferAttribute(new Float32Array(n * 3), 3));
      const m = new T3.MeshLambertMaterial({ vertexColors: true, transparent: true, opacity: 1 });
      const mesh = new T3.Mesh(g, m);
      const lon = new Float32Array(n), lat = new Float32Array(n);
      for (let i = 0; i < n; i++) { lon[i] = g.attributes.position.getX(i) + 195; lat[i] = -g.attributes.position.getZ(i) / LS; }
      return { mesh, g, lon, lat, n };
    }

    function makeCloud() {
      const g = new T3.Group();
      const mat = new T3.MeshLambertMaterial({ color: 0xf4f6f9 });
      const put = (x, y, z, r, sx, sy, sz) => { const m = new T3.Mesh(new T3.SphereGeometry(r, 18, 14), mat); m.position.set(x, y, z); if (sx) m.scale.set(sx, sy, sz); g.add(m); };
      put(-3.5, 8, 1, 3.8); put(3, 8.2, -1, 3.6); put(0, 8, 2.6, 3.4); put(0.5, 9, -2.5, 3.6);
      put(-1, 12.5, 0, 3.6); put(1.8, 13.5, 0.8, 3.1); put(-0.5, 17, 0.2, 3.2); put(1.2, 19.5, -0.4, 2.8);
      put(0, 23, 0, 1, 10.5, 2.4, 7.5); put(3.5, 22.3, 0.5, 1, 5, 1.8, 4);
      const base = new T3.Mesh(new T3.CylinderGeometry(6.2, 6.4, 1.6, 24), new T3.MeshLambertMaterial({ color: 0xc9ced8 }));
      base.position.y = 5.6; g.add(base);
      const N = 56, seed = [];
      for (let i = 0; i < N; i++) { const a = i * 2.39996, r = 0.8 + 4.8 * Math.sqrt((i + 0.5) / N); seed.push([Math.cos(a) * r, Math.sin(a) * r, (i * 0.618) % 1]); }
      const rain = new T3.InstancedMesh(new T3.BoxGeometry(0.28, 1.5, 0.28), new T3.MeshBasicMaterial({ color: 0x3a5fa8 }), N);
      g.add(rain);
      return { g, rain, seed, N };
    }

    function chevGeo() {
      const s = new T3.Shape();
      const P = [[-2.2, 0], [0.9, 2.5], [2.0, 2.5], [-0.6, 0], [2.0, -2.5], [0.9, -2.5]];
      s.moveTo(P[0][0], P[0][1]); for (let i = 1; i < P.length; i++) s.lineTo(P[i][0], P[i][1]);
      const g = new T3.ShapeGeometry(s); g.rotateX(-Math.PI / 2); return g;
    }

    function init(stage) {
      renderer = new T3.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setClearColor(0xffffff, 1);
      renderer.setSize(1920, 1080, false);
      renderer.domElement.className = 'gl';
      renderer.domElement.setAttribute('aria-hidden', 'true');
      stage.appendChild(renderer.domElement);
      scene = new T3.Scene();
      scene.fog = new T3.Fog(0xffffff, 380, 760);
      camera = new T3.PerspectiveCamera(30, 1920 / 1080, 1, 2000);
      scene.add(new T3.HemisphereLight(0xffffff, 0x9aa6bd, 0.72));
      const sun = new T3.DirectionalLight(0xffffff, 0.42); sun.position.set(60, 140, 90); scene.add(sun);

      surf.push(makeSurface(0, LAT1, 30)); surf.push(makeSurface(LAT0, 0, 30));
      surf.forEach(s => scene.add(s.mesh));
      const slabMat = () => new T3.MeshLambertMaterial({ color: 0x8191b6, transparent: true, opacity: 1 });
      // Slab walls whose top edge follows the sloping sea surface
      const slab = () => { const g = new T3.BoxGeometry(LON1 - LON0, D, 30 * LS, 104, 1, 1); const P = g.attributes.position; g.userData.top = []; for (let i = 0; i < P.count; i++) if (P.getY(i) > 0) g.userData.top.push(i); return new T3.Mesh(g, slabMat()); };
      boxes.n = slab(); boxes.n.position.set(X(196), -D / 2 - 0.05, -15 * LS);
      boxes.s = slab(); boxes.s.position.set(X(196), -D / 2 - 0.05, 15 * LS);
      scene.add(boxes.n); scene.add(boxes.s);

      const landMat = new T3.MeshLambertMaterial({ color: 0xc4c8ce });
      LAND.forEach((pts, i) => {
        const s = new T3.Shape(); s.moveTo(X(pts[0][0]), pts[0][1] * LS); for (let k = 1; k < pts.length; k++) s.lineTo(X(pts[k][0]), pts[k][1] * LS);
        const top = i === LAND.length - 1 ? 2.8 : 2.0;
        const g = new T3.ExtrudeGeometry(s, { depth: D + top, bevelEnabled: false });
        g.rotateX(-Math.PI / 2); g.translate(0, -D, 0);
        scene.add(new T3.Mesh(g, landMat));
      });
      [[204.5, 19.6, 1.2], [203, 21.3, 0.6], [201.8, 21.5, 0.5]].forEach(p => {
        const m = new T3.Mesh(new T3.CylinderGeometry(p[2], p[2], 2, 12), landMat); m.position.set(X(p[0]), 0.4, Z(p[1])); scene.add(m);
      });

      // Equatorial cross-section (seen when the southern half of the ocean is lifted away)
      const NC = 90, nv = NC * 6;
      xsGeo = new T3.BufferGeometry();
      xsGeo.setAttribute('position', new T3.BufferAttribute(new Float32Array(nv * 3), 3));
      const cols = new Float32Array(nv * 3), idx = [];
      for (let i = 0; i < NC; i++) {

  ORDER.forEach((s, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('aria-label', 'Go to scene ' + (i + 1) + ': ' + s[1]);
    b.addEventListener('click', () => go(i));
    prog.appendChild(b);
  });

  function fit() {
    const w = viewportEl.clientWidth, h = viewportEl.clientHeight, pad = Math.min(32, w * 0.03);
    const s = Math.max(0.05, Math.min((w - pad * 2) / 1920, (h - pad * 2) / 1080));
    stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
    World.setScale(s);
    if (current) drawFrame(0);
  }
  window.addEventListener('resize', fit);

  // Blend from wherever the world was when this scene began, so every change of scene glides
  function blendState(want, b) {
    const S = Object.assign({}, DEF, want);
    if (S.wS == null) S.wS = S.e;
    if (!snap || b >= 1) return S;
    const out = {};
    Object.keys(S).forEach(k => {
      if (k === 'cam') out.cam = camLerp(snap.cam, S.cam, b);
      else out[k] = lerp(snap[k], S[k], b);
    });
    return out;
  }
  function drawFrame(dt) {
    const want = current.state.call(current, t);
    const S = blendState(want, eio(seg(t, 0, 1.6)));
    World.render(S, gt, dt);
    current.render.call(current, t, kit);
    World.draw();
    lastState = S;
  }
  let gt = 0;
  kit.redraw = () => drawFrame(0);

  function go(i) {
    idx = (i + ORDER.length) % ORDER.length;
    snap = lastState;
    World.clearGroup();
    sceneHost.innerHTML = '';
    const box = document.createElement('div'); box.className = 'box';
    sceneHost.appendChild(box);
    kit.stage = box;
    current = SCENES[ORDER[idx][0]];
    current.init.call(current, kit);
    t = 0; last = null;
    drawFrame(0);
    $('count').textContent = (idx + 1) + ' / ' + ORDER.length;
    $('name').textContent = ORDER[idx][1];
    $('prev').disabled = idx === 0;
    $('nextLbl').textContent = idx === ORDER.length - 1 ? 'Start over' : 'Next';
    $('next').setAttribute('aria-label', idx === ORDER.length - 1 ? 'Start over from the first scene' : 'Next scene');
    Array.from(prog.children).forEach((b, j) => {
      b.className = j < idx ? 'done' : j === idx ? 'now' : '';
      if (j === idx) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    });
    const words = Array.from(box.querySelectorAll('.words, .caption')).map(n => n.textContent).join(' ');
    $('live').textContent = 'Scene ' + (idx + 1) + ' of ' + ORDER.length + ': ' + ORDER[idx][1] + '. ' + words.replace(/\s+/g, ' ').trim();
  }

  function setPaused(p) {
    paused = p; last = null;
    $('pause').setAttribute('aria-pressed', String(p));
    $('pause').setAttribute('aria-label', p ? 'Play animation' : 'Pause animation');
    $('pauseLbl').textContent = p ? 'Play' : 'Pause';
    $('pauseIcon').innerHTML = p ? '<path d="M7 5l12 7-12 7z"/>' : '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
  }

  function frame(now) {
    if (!paused && current) {
      let dt = 0;
      if (last != null) dt = Math.min(0.1, (now - last) / 1000);
      last = now; t += dt; gt += dt;
      drawFrame(dt);
    }
    requestAnimationFrame(frame);
  }

  $('next').addEventListener('click', () => go(idx + 1));
  $('prev').addEventListener('click', () => { if (idx > 0) go(idx - 1); });
  $('replay').addEventListener('click', () => go(idx));
  $('pause').addEventListener('click', () => setPaused(!paused));
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
    if (e.target.closest && e.target.closest('[role="slider"]') && e.key !== ' ') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(idx + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); if (idx > 0) go(idx - 1); }
    else if (e.key === 'p' || e.key === 'P') setPaused(!paused);
    else if (e.key === 'r' || e.key === 'R') go(idx);
  });

  // Expose for previews
  window.__enso = { go: i => go(i), setT: v => { t = v; drawFrame(0); }, pause: () => setPaused(true) };

  fit();
  go(0);
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const goOrig = go;
    go = function (i) { goOrig(i); t = 8; drawFrame(0); };
    go(0);
    setPaused(true);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
